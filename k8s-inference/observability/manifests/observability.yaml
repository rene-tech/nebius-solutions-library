apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fs2-control-plane
  namespace: fs2-observability
  labels:
    app.kubernetes.io/part-of: fs2-serve
    observability.fs2.nebius/owner: fs2-serve-lean-observability-live
spec:
  namespaceSelector:
    matchNames: [fs2-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: fs2-serve-control-plane
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
      metricRelabelings: &safe-labels
        - action: labeldrop
          regex: "(?i:authorization|api_?key|token|tenant(_?id)?|user(_?id)?|subject|request(_?id)?)"
---
apiVersion: monitoring.coreos.com/v1
