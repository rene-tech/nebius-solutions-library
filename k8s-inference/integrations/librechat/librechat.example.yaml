# Merge this fragment into the deployment's librechat.yaml. The schema version
# is not the LibreChat application version.
version: 1.3.15

interface:
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false

endpoints:
  agents:
    capabilities:
      - skills
      - tools
      - artifacts
      - context

mcpServers:
  bionemo-models:
    type: streamable-http
    url: '${SCIENTIFIC_MODELS_MCP_URL}'
    # Discovery is caller-specific and cannot run before this user supplies a key.
    startup: false
    requiresOAuth: false
    initTimeout: 30000
    # Model calls return durable operation IDs. This is transport time, not the
    # maximum cold-start or scientific-job duration.
    timeout: 120000
    serverInstructions: true
    headers:
      Authorization: 'Bearer {{SCIENTIFIC_MODELS_API_KEY}}'
    customUserVars:
      SCIENTIFIC_MODELS_API_KEY:
        title: 'Scientific platform API key'
        description: 'Your ordinary model-access key, without the Bearer prefix.'
        sensitive: true
