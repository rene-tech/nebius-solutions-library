# Exact additive migration for the existing H100 deployment. This is a release
# receipt; portable installations use the chart's migration Job and values.
apiVersion: batch/v1
kind: Job
metadata:
  name: fs2-customer-workbenches-migrate-20261002
  namespace: fs2-system
  labels:
    app.kubernetes.io/name: fs2-serve-control-plane
    app.kubernetes.io/instance: fs2-serve-control-plane
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fs2-serve-control-plane
        app.kubernetes.io/instance: fs2-serve-control-plane
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: fs2-serve-control-plane-migration
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      tolerations:
        - key: workload.fs2.nebius/general-cpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-platform/fs2-serve-control-plane@sha256:47f01a59734d738aee5afef6f3a36df85f5b3eb0cd830163d7005210862d58f6
          args: [migrate]
          env:
            - name: FS2_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fs2-serve-database-migrations, key: url}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: database-ca, mountPath: /tls, readOnly: true}
      volumes:
        - name: database-ca
          secret:
            secretName: fs2-serve-database-migrations
            defaultMode: 0400
            items: [{key: ca.crt, path: ca.crt}]
