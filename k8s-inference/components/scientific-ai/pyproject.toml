[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "nebius-scientific-ai-execution"
version = "0.1.0"
description = "Scientific application adapters for Serverless 2.0; no scheduler"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3==1.40.47",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.12.5",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_ai"]

[tool.hatch.build.targets.wheel.force-include]
"../../models/molecular-dynamics/gromacs/runtime/fs2_gromacs" = "fs2_gromacs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
