[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "fs2-mindeval-gateway"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.141.1", "httpx==0.28.1", "uvicorn==0.35.0", "pydantic==2.12.5"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.11"]

[project.scripts]
fs2-mindeval-serve = "fs2_mindeval.server:main"
fs2-mindeval-rehearse = "fs2_mindeval.rehearse:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fs2_mindeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
