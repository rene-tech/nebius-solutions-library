apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mindeval-gateway-data
  namespace: fs2-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: compute-csi-default-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs2-mindeval-gateway
  namespace: fs2-system
spec:
  # Single scheduler/process is mandatory. Recreate prevents overlapping budgets.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fs2-mindeval-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fs2-mindeval-gateway
    spec:
      terminationGracePeriodSeconds: 210
      securityContext:
        fsGroup: 10001
      containers:
        - name: gateway
          image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-platform/mindeval-gateway:fs2-mindeval-20260916
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MINDEVAL_AUTHZ_URL
              value: http://fs2-serve-control-plane.fs2-system.svc:8080/internal/ext-authz
            - name: MINDEVAL_DB_PATH
              value: /data/mindeval/gateway.sqlite
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data/mindeval}
            - {name: token-factory, mountPath: /run/secrets/token-factory, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mindeval-gateway-data}
        - name: token-factory
          secret: {secretName: mindeval-token-factory, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: fs2-mindeval-gateway
  namespace: fs2-system
spec:
  selector:
    app.kubernetes.io/name: fs2-mindeval-gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
