[project]
name = "fs2-pipecat-reference"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pipecat-ai==1.10.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
