[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "fs2-speech-runtime"
version = "0.1.0"
description = "Pinned NVIDIA streaming ASR adapter for Scientific AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.12.5", "fastapi==0.141.1", "starlette==1.6.0",
  "uvicorn==0.35.0", "httpx==0.28.1", "python-multipart==0.0.32",
  "websockets==15.0.1", "prometheus-client==0.22.1",
]

[project.optional-dependencies]
nemo = [
  "nemo-toolkit[asr-only,common-only,core] @ git+https://github.com/NVIDIA/NeMo.git@3b08b2acacc13ec1268e53653346266202b2335f",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==5.17.0",
  "numba-cuda[cu12]==0.30.4",
  "cuda-python==12.9.4",
  "soundfile==0.13.1",
]
test = ["pytest==8.4.1", "ruff==0.12.11"]

[project.scripts]
fs2-speech-probe = "fs2_speech.probe:main"
fs2-speech-serve = "fs2_speech.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fs2_speech"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
