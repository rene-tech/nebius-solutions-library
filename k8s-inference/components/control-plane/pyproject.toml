[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "fs2-serve-control-plane"
version = "0.1.0"
description = "Durable authenticated admission and MCP gateway for fs2-serve"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Nebius" }]
dependencies = [
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==50.0.1",
  "croniter==6.2.4",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "mcp==2.1.1",
  "opentelemetry-api==1.37.0",
  "opentelemetry-exporter-otlp-proto-http==1.37.0",
  "opentelemetry-instrumentation-fastapi==0.58b0",
  "opentelemetry-instrumentation-httpx==0.58b0",
  "opentelemetry-sdk==1.37.0",
  "prometheus-client==0.22.1",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.2",
  "starlette==1.6.0",
  "uvicorn==0.35.0",
  "zstandard==0.24.0",
]

[project.scripts]
fs2-serve = "fs2_serve.cli:main"
fs2-serve-accept-all-models = "fs2_serve.live_acceptance:main"

[dependency-groups]
build = [
  "hatchling==1.29.0",
]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "pyyaml==6.0.2",
  "types-pyyaml==6.0.12.20260815",
  "respx==0.22.0",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fs2_serve"]

[tool.hatch.build.targets.wheel.force-include]
"../../catalog/runtime/fs2_serve_catalog" = "fs2_serve_catalog"
"migrations" = "fs2_serve/migrations"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires FS2_TEST_DATABASE_URL"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fs2_serve"]
mypy_path = "../../catalog/runtime"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fs2_serve_catalog.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "huggingface_hub"
ignore_missing_imports = true
