[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "fs2-voice-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic==2.12.5", "fastapi==0.141.1", "uvicorn==0.35.0", "websockets==15.0.1", "prometheus-client==0.22.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.11"]

[project.scripts]
fs2-voice-serve = "fs2_voice.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fs2_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
