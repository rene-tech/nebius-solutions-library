apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-smoke
  namespace: fs2-disposable-smoke
  labels:
    app.kubernetes.io/name: qwen3-smoke
    app.kubernetes.io/part-of: fs2-terraform-recipe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-smoke
    spec:
      nodeSelector:
        capacity.fs2.nebius/preset: b300-1x
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --revision
            - c1899de289a04d12100db370d81485cdf75e47ca
            - --served-model-name
            - fs2-terraform-smoke
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.50"
            - --enforce-eager
          env:
            - name: HF_HOME
              value: /cache/huggingface
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-smoke
  namespace: fs2-disposable-smoke
  labels:
    app.kubernetes.io/name: qwen3-smoke
    app.kubernetes.io/part-of: fs2-terraform-recipe
spec:
  selector:
    app.kubernetes.io/name: qwen3-smoke
  ports:
    - name: http
      port: 8000
      targetPort: http
