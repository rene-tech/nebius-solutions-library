          imagePullPolicy: Always
          command:
            - python
            - -c
            - |
              import json

              print(json.dumps({
                  "schema": "fs2-serve.nebius.ai/source-registry-pull-smoke/v1",
                  "result": "PASS",
              }, sort_keys=True))
