apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-smoke
  namespace: fs2-disposable-smoke
  labels:
    app.kubernetes.io/name: cuda-smoke
    app.kubernetes.io/part-of: fs2-terraform-recipe
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuda-smoke
    spec:
      restartPolicy: Never
      nodeSelector:
        capacity.fs2.nebius/preset: b300-1x
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      containers:
        - name: cuda-sm103
          image: docker.io/vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
          imagePullPolicy: IfNotPresent
          command:
            - python3
          args:
            - -c
            - |
              import json
              import os
              import subprocess

              import torch

              if not torch.cuda.is_available():
                  raise SystemExit("CUDA_UNAVAILABLE")
              if torch.cuda.device_count() != 1:
                  raise SystemExit("CUDA_VISIBLE_DEVICE_COUNT_INVALID")

              gpu_name = torch.cuda.get_device_name(0)
              compute_capability = torch.cuda.get_device_capability(0)
              if "NVIDIA B300" not in gpu_name:
                  raise SystemExit("GPU_MODEL_NOT_B300")
              if compute_capability != (10, 3):
                  raise SystemExit("GPU_COMPUTE_CAPABILITY_NOT_SM103")

              query_with_capability = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=uuid,name,compute_cap,driver_version,memory.total",
                      "--format=csv,noheader,nounits",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if query_with_capability.returncode == 0:
                  lines = query_with_capability.stdout.strip().splitlines()
                  if len(lines) != 1:
                      raise SystemExit("NVIDIA_SMI_QUERY_SHAPE_INVALID")
                  fields = [item.strip() for item in lines[0].split(",", 4)]
                  if len(fields) != 5 or fields[2] != "10.3":
                      raise SystemExit("NVIDIA_SMI_COMPUTE_CAPABILITY_NOT_SM103")
                  gpu_uuid, smi_name, smi_capability, driver_version, memory_mib = fields
              else:
                  fallback = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=uuid,name,driver_version,memory.total",
                          "--format=csv,noheader,nounits",
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if fallback.returncode != 0:
                      raise SystemExit("NVIDIA_SMI_QUERY_FAILED")
                  lines = fallback.stdout.strip().splitlines()
                  if len(lines) != 1:
                      raise SystemExit("NVIDIA_SMI_QUERY_SHAPE_INVALID")
                  fields = [item.strip() for item in lines[0].split(",", 3)]
                  if len(fields) != 4:
                      raise SystemExit("NVIDIA_SMI_QUERY_SHAPE_INVALID")
                  gpu_uuid, smi_name, driver_version, memory_mib = fields
                  smi_capability = None

              if "NVIDIA B300" not in smi_name:
                  raise SystemExit("NVIDIA_SMI_GPU_MODEL_NOT_B300")
              evidence = {
                  "schema": "fs2-serve.nebius.ai/cuda-smoke/v2",
                  "node": os.environ["FS2_NODE_NAME"],
                  "cuda": {
                      "available": True,
                      "device_count": 1,
                      "runtime_version": torch.version.cuda,
                  },
                  "gpu": {
                      "compute_capability": list(compute_capability),
                      "driver_version": driver_version,
                      "memory_mib": int(memory_mib),
                      "name": gpu_name,
                      "nvidia_smi_compute_capability": smi_capability,
                      "uuid": gpu_uuid,
                  },
              }
              print(json.dumps(evidence, sort_keys=True, separators=(",", ":")))
          env:
            - name: FS2_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              nvidia.com/gpu: "1"
