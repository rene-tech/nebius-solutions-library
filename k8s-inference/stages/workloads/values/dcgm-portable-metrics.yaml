# Merge after the cluster's existing DCGM values. No node/GPU scheduling changes.
# Profiling watches crash on the current L40S driver; retain normal utilization,
# memory, power and hardware-health metrics on every GPU SKU.
podAnnotations:
  fs2.nebius.ai/metric-profile: portable-device-v1
customMetrics: |
  # Portable device telemetry; profiling counters require a separately qualified GPU/driver.
  DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (MHz).
  DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (MHz).
  DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (C).
  DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (C).
  DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (W).
  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy since boot (mJ).
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, PCIe retries.
  DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (%).
  DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (%).
  DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization (%).
  DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization (%).
  DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error.
  DCGM_FI_DEV_FB_FREE, gauge, Free framebuffer memory (MiB).
  DCGM_FI_DEV_FB_USED, gauge, Used framebuffer memory (MiB).
  DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, NVLink bandwidth counters for all lanes.
  DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Uncorrectable remapped rows.
  DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Correctable remapped rows.
  DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Row remapping failure.

