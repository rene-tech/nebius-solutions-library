fullnameOverride: fs2-dcgm-exporter
image:
  repository: nvcr.io/nvidia/k8s/dcgm-exporter
  digest: sha256:b4df763de9558e5b3f1f1d79bc65b772fcf65b8a9c3664ea7173e47153112b4a
  pullPolicy: IfNotPresent
nodeSelector:
  workload.fs2.nebius/gpu: "true"
tolerations:
  - key: dedicated
    operator: Equal
    value: fs2-inference
    effect: NoSchedule
service:
  enable: true
  type: ClusterIP
  internalTrafficPolicy: Cluster
  port: 9400
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 25s
  metricRelabelings:
    # Preserve the bounded workload labels and pod identity required to join
    # GPU samples to models. Drop only infrastructure/request identities that
    # are not part of that attribution contract.
    - action: labeldrop
      regex: '(?i)^(uuid|gpu_uuid|hostname|operation|operation_id|principal|token|tenant)$'
kubernetes:
  enablePodLabels: true
  enablePodUID: true
  podLabelAllowlistRegex:
    - ^app\.kubernetes\.io/(component|instance|name|part-of)$
    - ^fs2\.nebius\.ai/.*$
  rbac:
    create: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
