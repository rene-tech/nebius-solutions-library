fullnameOverride: fs2-dcgm-exporter
image:
  repository: nvcr.io/nvidia/k8s/dcgm-exporter
  digest: sha256:b4df763de9558e5b3f1f1d79bc65b772fcf65b8a9c3664ea7173e47153112b4a
  pullPolicy: IfNotPresent
nodeSelector:
  workload.fs2.nebius/gpu: "true"
tolerations:
  - key: dedicated
    operator: Equal
    value: fs2-inference
    effect: NoSchedule
service:
  enable: true
  type: ClusterIP
  internalTrafficPolicy: Cluster
  port: 9400
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 25s
  # dcgm-exporter already emits the workload namespace/pod/container labels.
  # Preserve those canonical values instead of replacing them with the
  # ServiceMonitor target's fs2-observability identity.
  honorLabels: true
  metricRelabelings:
    # Keep GPU UUID and Pod UID: both are required for exact device-to-attempt
    # lifecycle joins. Request/principal identity belongs in OTel/SQL, never in
    # the high-frequency Prometheus label set.
    - action: labeldrop
      regex: '(?i)^(operation(_id)?|principal(_id)?|token(_id)?|tenant(_id)?|request(_id)?)$'
kubernetes:
  enablePodLabels: true
  enablePodUID: true
  podLabelAllowlistRegex:
    - ^app\.kubernetes\.io/(component|instance|name|part-of)$
    - ^fs2\.nebius\.ai/.*$
  rbac:
    create: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
