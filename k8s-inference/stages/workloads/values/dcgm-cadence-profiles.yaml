schema: fs2-serve.nebius.ai/dcgm-cadence-profiles/v1
campaignMetrics:
  - DCGM_FI_DEV_GPU_UTIL
  - DCGM_FI_DEV_FB_USED
profiles:
  standard:
    attributionMetricCollectionInterval: 5s
    minimumNominalWindowSeconds: 10
    helmValues:
      arguments:
        - --collect-interval
        - "5000"
      config:
        enabled: false
      serviceMonitor:
        interval: 5s
        scrapeTimeout: 4s
        metricRelabelings:
          - action: labeldrop
            regex: '(?i)^(operation(_id)?|principal(_id)?|token(_id)?|tenant(_id)?|request(_id)?)$'
  coldStartCampaign:
    attributionMetricCollectionInterval: 1s
    minimumNominalWindowSeconds: 2
    helmValues:
      arguments: []
      config:
        enabled: true
        create: true
        data: |
          version: 1
          metrics:
            file: /etc/dcgm-exporter/default-counters.csv
          collection:
            interval: 30s
            watchGroups:
              - name: cold-start-attribution
                interval: 1s
                fields:
                  - DCGM_FI_DEV_GPU_UTIL
                  - DCGM_FI_DEV_FB_USED
      serviceMonitor:
        interval: 1s
        scrapeTimeout: 900ms
        metricRelabelings:
          - action: keep
            sourceLabels:
              - __name__
            regex: DCGM_FI_DEV_(GPU_UTIL|FB_USED)
          - action: labeldrop
            regex: '(?i)^(operation(_id)?|principal(_id)?|token(_id)?|tenant(_id)?|request(_id)?)$'
