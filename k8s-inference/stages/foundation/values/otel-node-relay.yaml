exporters:
  otlp_grpc:
    endpoint: fs2-otel-gateway.fs2-observability.svc.cluster.local:4317
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_elapsed_time: 60s
      max_interval: 10s
    sending_queue:
      enabled: true
      queue_size: 2048
    tls:
      insecure: true
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  k8s_attributes:
    auth_type: serviceAccount
    extract:
      labels:
        - from: pod
          key: fs2.nebius.ai/model-id
          tag_name: fs2.model.id
        - from: pod
          key: fs2.nebius.ai/workload-id
          tag_name: fs2.workload.id
        - from: pod
          key: fs2.nebius.ai/attempt-id
          tag_name: fs2.attempt.id
        - from: pod
          key: fs2.nebius.ai/tenant-id
          tag_name: fs2.tenant.id
        - from: pod
          key: fs2.nebius.ai/service-class
          tag_name: fs2.service.class
        - from: pod
          key: fs2.nebius.ai/local-queue
          tag_name: fs2.kueue.local_queue
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.container.name
        - k8s.node.name
      otel_annotations: true
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource/sanitize:
    attributes:
      - action: delete
        key: api.key
      - action: delete
        key: api.key.value
      - action: delete
        key: http.request.header.authorization
      - action: delete
        key: http.response.header.set-cookie
receivers:
  file_log:
    exclude:
      - /var/log/pods/fs2-observability_*/*/*.log
    include:
      - /var/log/pods/fs2-*_*/*/*.log
    include_file_name: false
    include_file_path: true
    operators:
      - id: container-parser
        type: container
    retry_on_failure:
      enabled: true
    start_at: end
service:
  extensions:
    - health_check
  pipelines:
    logs:
      exporters:
        - otlp_grpc
      processors:
        - memory_limiter
        - k8s_attributes
        - resource/sanitize
        - batch
      receivers:
        - file_log
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
    resource:
      host.name: ${env:OTEL_K8S_NODE_NAME}
      k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
      k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
      k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
      k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
      k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
