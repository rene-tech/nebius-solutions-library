command:
  name: otelcol-k8s
config:
  exporters:
    debug: null
    otlp:
      endpoint: fs2-otel-gateway.fs2-observability.svc.cluster.local:4317
      retry_on_failure: {enabled: true, initial_interval: 1s, max_elapsed_time: 60s, max_interval: 10s}
      sending_queue: {enabled: true, queue_size: 2048}
      tls: {insecure: true}
  extensions:
    health_check: {endpoint: "${env:MY_POD_IP}:13133"}
  processors:
    batch: {send_batch_size: 1024, timeout: 5s}
    memory_limiter: {check_interval: 5s, limit_percentage: 75, spike_limit_percentage: 20}
    resource/sanitize:
      attributes:
        - {action: delete, key: api.key}
        - {action: delete, key: api.key.value}
        - {action: delete, key: http.request.header.authorization}
        - {action: delete, key: http.response.header.set-cookie}
  receivers:
    jaeger: null
    otlp: null
    prometheus: null
    zipkin: null
  service:
    extensions: [health_check]
    pipelines:
      logs:
        exporters: [otlp]
        processors: [memory_limiter, resource/sanitize, batch]
        receivers: []
      metrics: null
      traces: null
fullnameOverride: fs2-otel-cluster
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: 0.159.0
mode: deployment
nodeSelector:
  workload.fs2.nebius/system: "true"
podDisruptionBudget: {enabled: false}
podSecurityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: {type: RuntimeDefault}
ports:
  jaeger-compact: {enabled: false}
  jaeger-grpc: {enabled: false}
  jaeger-thrift: {enabled: false}
  metrics: {containerPort: 8888, enabled: true, protocol: TCP, servicePort: 8888}
  otlp: {enabled: false}
  otlp-http: {enabled: false}
  zipkin: {enabled: false}
presets:
  kubernetesEvents:
    enabled: true
    useK8sEventsReceiver: false
replicaCount: 1
resources:
  limits: {cpu: 500m, memory: 512Mi}
  requests: {cpu: 50m, memory: 128Mi}
securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
serviceMonitor:
  enabled: true
  metricsEndpoints: [{interval: 30s, port: metrics}]
