global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.8.3

# Keep the controller available while it reconciles the public data plane and
# the global rate-limit service.
deployment:
  replicas: 2
  pod:
    nodeSelector:
      workload.fs2.nebius/system: "true"
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway
podDisruptionBudget:
  minAvailable: 1
service:
  type: ClusterIP

config:
  envoyGateway:
    provider:
      type: Kubernetes
      kubernetes:
        rateLimitDeployment:
          replicas: 2
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1
          pod:
            automountServiceAccountToken: false
            labels:
              fs2.nebius.ai/edge-rate-limit-service: "true"
            # The pinned RLS image runs as nobody (65534). Projected client-key
            # files are 0440 and kubelet assigns this exact group, so neither a
            # world-readable key nor an image-specific root workaround is needed.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            nodeSelector:
              workload.fs2.nebius/system: "true"
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    fs2.nebius.ai/edge-rate-limit-service: "true"
            volumes:
              - name: ratelimit-tmp
                emptyDir:
                  sizeLimit: 64Mi
          container:
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: ratelimit-tmp
                mountPath: /tmp
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
    rateLimit:
      backend:
        type: Redis
        redis:
          # Envoy RLS Sentinel URL format is
          # <master-name>,<sentinel-host:port>... . Each endpoint is a stable
          # StatefulSet Pod identity; no Service ever balances Redis writes.
          url: fs2-edge-rate-limit,fs2-edge-rate-limit-redis-0.fs2-edge-rate-limit-redis-headless.envoy-gateway-system.svc.cluster.local:26379,fs2-edge-rate-limit-redis-1.fs2-edge-rate-limit-redis-headless.envoy-gateway-system.svc.cluster.local:26379,fs2-edge-rate-limit-redis-2.fs2-edge-rate-limit-redis-headless.envoy-gateway-system.svc.cluster.local:26379
      timeout: 100ms
      # A total RLS/store failure must not silently turn off edge protection.
      # Sentinel handles a single store loss without this path; fail-closed is
      # the final bounded behavior after loss of the complete HA authority.
      failClosed: true
      telemetry:
        metrics:
          prometheus:
            disable: false
