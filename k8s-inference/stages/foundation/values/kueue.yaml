controllerManager:
  nodeSelector:
    workload.fs2.nebius/system: "true"
  manager:
    image:
      repository: registry.k8s.io/kueue/kueue
      tag: v0.17.8@sha256:cecba825d0b0feab9bed2835efe2eb8d825512f1616c8762ab80c53f2ea6afe6
      pullPolicy: IfNotPresent
  # Indexed Jobs can declare a bounded minimum parallelism while still asking
  # for their ideal fan-out. Independent scientific shards remain separate
  # Jobs and therefore do not require partial admission.
  featureGates:
    - name: PartialAdmission
      enabled: true
managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      groupKindConcurrency:
        Job.batch: 5
        Pod: 5
        Workload.kueue.x-k8s.io: 5
        LocalQueue.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 1
        ResourceFlavor.kueue.x-k8s.io: 1
    clientConnection:
      qps: 50
      burst: 100
    # ClusterQueue weights govern cross-tenant borrowing. LocalQueue weights
    # independently govern historical-usage admission within each queue. The
    # defaults are intentionally slow-moving enough for event and PoC bursts
    # while still converging after sustained batch use.
    fairSharing:
      preemptionStrategies:
        - LessThanOrEqualToFinalShare
        - LessThanInitialShare
    admissionFairSharing:
      usageHalfLifeTime: 168h
      usageSamplingInterval: 5m
    # Keep a quota reservation only when Pods become ready within the existing
    # two-hour activation ceiling. A short guessed timeout would evict valid
    # scale-from-zero model starts before their measured qualification exists.
    # Creation-based requeue timestamps retain age after transient node loss.
    waitForPodsReady:
      timeout: 2h
      recoveryTimeout: 15m
      blockAdmission: false
      requeuingStrategy:
        timestamp: Creation
        backoffLimitCount: 5
        backoffBaseSeconds: 15
        backoffMaxSeconds: 300
    integrations:
      frameworks:
        - batch/job
        - kubeflow.org/mpijob
        - ray.io/rayjob
        - ray.io/rayservice
        - ray.io/raycluster
        - jobset.x-k8s.io/jobset
        - trainer.kubeflow.org/trainjob
        - kubeflow.org/paddlejob
        - kubeflow.org/pytorchjob
        - kubeflow.org/tfjob
        - kubeflow.org/xgboostjob
        - kubeflow.org/jaxjob
        - workload.codeflare.dev/appwrapper
        - pod
        - deployment
        - statefulset
        - leaderworkerset.x-k8s.io/leaderworkerset
    # ClusterQueues budget accelerator capacity. The Kubernetes scheduler
    # remains responsible for fitting each admitted Pod's core resources to
    # the exact node pool selected by its ResourceFlavor.
    resources:
      excludeResourcePrefixes:
        - cpu
        - memory
        - ephemeral-storage
