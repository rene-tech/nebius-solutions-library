# Image provenance admission policy for the fs2-serve platform (SAI-09).
#
# Enforced invariants for Pods and workload controllers (Deployments,
# DaemonSets, StatefulSets, Jobs, CronJobs) admitted into the platform
# namespaces (fs2-system, fs2-models):
#
#   1. Every container, init container, and ephemeral-container image must be
#      digest-pinned (…@sha256:<64 hex>). Mutable tags are refused — including
#      ephemeral containers injected through the pods/ephemeralcontainers
#      subresource by `kubectl debug`.
#   2. Every image must come from an allow-listed registry prefix.
#   3. Platform application images (control plane, admin console, website —
#      anything under the platform repository prefix) must additionally use a
#      digest present in the signed release allow-list.
#   4. Pods running as an AUTOMATION identity (the deploy/security
#      ServiceAccounts listed in the allow-list's automation-service-accounts
#      key) must be token-hardened: automountServiceAccountToken false at the
#      pod level, every serviceAccountToken projection bound to the exact
#      token-audience with <=3600s expiry, and NO Secret volumes or
#      env/envFrom Secret references — a workload-create grant can no longer
#      be pivoted into identity-token minting or stored-credential
#      exfiltration through the automation identity's own pods.
#   5. No OTHER pod may project a serviceAccountToken carrying the automation
#      token-audience: the release audience is exclusive to the automation
#      identities, so an app pod cannot mint a token that impersonates the
#      release identity toward its verifiers.
#   6. Workloads WRITTEN BY an automation identity (request.userInfo is a
#      listed automation ServiceAccount) may only run as an OWNER-ENUMERATED
#      ServiceAccount (workload-service-accounts key; 'default' and security
#      principals are unenumerable by scope validation) and may carry NO
#      hostPath volumes, NO privileged containers, NO host
#      network/PID/IPC namespaces, NO added capabilities or privilege
#      escalation, NO direct nodeName scheduling, NO Secret volumes or
#      Secret env values (credentials reach automation-deployed workloads
#      only through the owner-named credential CSI driver), and NO token
#      projections outside the bounded automation audience — the deploy
#      identity's workload-create right cannot be pivoted into identity,
#      credential, host, node, storage, or privilege escalation.
#
# Matching workload controllers as well as Pods means a direct `helm upgrade`
# or `kubectl apply` that introduces an unpinned or non-allow-listed image
# fails immediately at the Deployment update, not minutes later at Pod churn.
#
# The environment-specific data (registry prefixes, platform repository
# prefix, signed digests, deploy principals) lives in the paramRef ConfigMap
# fs2-system/fs2-image-provenance-allowlist. The governed path renders it with
# security/image-provenance/provenance.py render-allowlist, which requires a
# signed release receipt and a cosign verification for every digest. The
# ConfigMap IS mutation-protected in-cluster once fs2-provenance-guard is
# applied (only the security automation identity may write it); the policy
# OBJECTS themselves cannot be admission-protected (see the guard header:
# admission-configuration writes are architecturally exempt), so their
# non-removability is the owner-executed EXTERNAL IAM closure — which the
# renderer ENFORCES read-only at every render: verify-iam-boundary refuses
# to render while any non-exempt subject holds admission-configuration
# write/delete, impersonation (users/groups/serviceaccounts/uids/extras),
# ServiceAccount token minting, RBAC bind/escalate, or protected-namespace
# secrets access, and the live-equality check refuses on any drifted,
# weakened, or missing policy object.
#
# Failure posture:
#   - failurePolicy Fail plus fail-closed CEL: a missing or malformed
#     allow-list key denies admission in the matched namespaces.
#   - parameterNotFoundAction Deny: a deleted allow-list ConfigMap fails
#     closed. Operational consequence: Pod churn in the matched namespaces
#     stalls until the ConfigMap is restored from the run-root receipt.
#   - The pods/ephemeralcontainers subresource IS matched: `kubectl debug`
#     injection is admission-governed like any other image. Debugging stays
#     available through the governed workflow below; it is never disabled.
#
# Governed debugging (kubectl debug keeps working END TO END, with pinned
# images; the injection command shape is proven verbatim on an isolated kind
# cluster by tests/test_admission_kind.py). The AUTHORIZED CALLER is the
# owner-designated DEBUG identity (scope.debug_principals; iam-boundary.yaml
# defines fs2-debugger in BOTH platform namespaces with exactly pods +
# pods/log get/list, pods/ephemeralcontainers get/update/patch, and
# pods/attach get/create — so injection, `-it` interactive attach, and log
# reading all function). exec and port-forward stay forbidden for every
# identity: exec spawns arbitrary processes in EXISTING containers, while
# attach only reaches containers whose images admission pinned at injection.
# TRUTHFUL LIMIT: RBAC attach is pod-scoped, not container-scoped — within
# its bound namespaces the debug identity can attach to any container; that
# breadth is why it is a separate, token-hardened, individually auditable
# automation identity. The sanctioned, image-pinned debug path:
#   kubectl -n fs2-system debug <pod> --container debugger \
#     --image <allow-listed-registry>/fs2-tools/debug@sha256:<digest> -- sleep 3600
#   (add -it to attach interactively once the ephemeral container is admitted)
#   The debug image must be digest-pinned and come from an allow-listed
#   registry prefix; host debug tooling OUTSIDE the platform repository
#   prefix (e.g. an fs2-tools repository) so it needs no release allow-list
#   entry, or receipt+sign+inventory it like a platform image if it must
#   live under the platform prefix. Mutable tags (`:latest`) and foreign
#   registries (e.g. evil.invalid/debug:latest) are denied at injection.
#
# Rollback / break-glass (governed; never a direct patch, never deletion):
#   1. The OWNER signs a bounded recovery authorization naming the target
#      binding and exactly one sanctioned state — [Audit, Warn] to observe,
#      [Deny, Audit] to restore enforcement.
#   2. `provenance.py verify-recovery --recovery <doc> --public-key
#      security/image-provenance/cosign.pub` verifies it and prints the
#      annotation value; `provenance.py reconcile-boundary --recovery <doc>`
#      emits the exact annotated patch (PLAN only; --execute works only in an
#      authorized rollout window under the SECURITY identity).
#   3. While a binding is weakened, every allow-list render REFUSES (live
#      actions differ from the committed definition), so observation mode
#      cannot silently become the new normal.
# A direct kubectl patch by any other identity is an out-of-contract bypass:
# it is detected (render refusal + audit) and, once the external IAM closure
# is executed, the identity holding such rights no longer exists. Deletion is
# never rollback.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-image-provenance
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
        scope: Namespaced
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob'
         ? object.spec.jobTemplate.spec.template.spec
         : object.spec.template.spec)
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image)
        + (has(variables.podSpec.initContainers)
           ? variables.podSpec.initContainers.map(c, c.image) : [])
        + (has(variables.podSpec.ephemeralContainers)
           ? variables.podSpec.ephemeralContainers.map(c, c.image) : [])
    - name: registryPrefixes
      expression: >-
        ('registry-prefixes' in params.data
         ? params.data['registry-prefixes'] : '')
        .split("\n").filter(p, p != '')
    - name: platformRepositoryPrefix
      expression: >-
        'platform-repository-prefix' in params.data
        ? params.data['platform-repository-prefix'] : ''
    - name: platformDigests
      expression: >-
        ('platform-digests' in params.data
         ? params.data['platform-digests'] : '')
        .split("\n").filter(d, d != '')
    - name: allowedNamespaces
      expression: >-
        ('namespaces' in params.data
         ? params.data['namespaces'] : '')
        .split("\n").filter(n, n != '')
    - name: tokenAudience
      expression: >-
        'token-audience' in params.data
        ? params.data['token-audience'] : ''
    - name: automationServiceAccounts
      expression: >-
        ('automation-service-accounts' in params.data
         ? params.data['automation-service-accounts'] : '')
        .split("\n").filter(a, a != '')
    - name: serviceAccountRow
      expression: >-
        request.namespace + ':' +
        (has(variables.podSpec.serviceAccountName)
         ? variables.podSpec.serviceAccountName : 'default')
    - name: isAutomationPod
      expression: >-
        variables.automationServiceAccounts.exists(
          a, a == variables.serviceAccountRow)
    - name: workloadServiceAccounts
      expression: >-
        ('workload-service-accounts' in params.data
         ? params.data['workload-service-accounts'] : '')
        .split("\n").filter(a, a != '')
    - name: writerIsAutomation
      expression: >-
        variables.automationServiceAccounts.exists(a,
          'system:serviceaccount:' + a == request.userInfo.username)
    - name: deployCredentialCsiDriver
      expression: >-
        'deploy-credential-csi-driver' in params.data
        ? params.data['deploy-credential-csi-driver'] : ''
    - name: deployCredentialSpc
      expression: >-
        'deploy-credential-spc' in params.data
        ? params.data['deploy-credential-spc'] : ''
    - name: workloadCsiDrivers
      expression: >-
        ('workload-csi-drivers' in params.data
         ? params.data['workload-csi-drivers'] : '')
        .split("\n").filter(d, d != '')
    - name: workloadPvcPrefixes
      expression: >-
        ('workload-pvc-prefixes' in params.data
         ? params.data['workload-pvc-prefixes'] : '')
        .split("\n").filter(p, p != '')
    - name: usesProjectedSecretSource
      expression: >-
        has(variables.podSpec.volumes) &&
        variables.podSpec.volumes.exists(v,
          has(v.projected) && has(v.projected.sources) &&
          v.projected.sources.exists(s, has(s.secret)))
    - name: allContainersRefusePrivEsc
      expression: >-
        variables.podSpec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
        && (!has(variables.podSpec.initContainers) ||
            variables.podSpec.initContainers.all(c,
              has(c.securityContext) &&
              has(c.securityContext.allowPrivilegeEscalation) &&
              c.securityContext.allowPrivilegeEscalation == false))
        && (!has(variables.podSpec.ephemeralContainers) ||
            variables.podSpec.ephemeralContainers.all(c,
              has(c.securityContext) &&
              has(c.securityContext.allowPrivilegeEscalation) &&
              c.securityContext.allowPrivilegeEscalation == false))
    - name: usesHostPath
      expression: >-
        has(variables.podSpec.volumes) &&
        variables.podSpec.volumes.exists(v, has(v.hostPath))
    - name: usesHostNamespaces
      expression: >-
        (has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork)
        || (has(variables.podSpec.hostPID) && variables.podSpec.hostPID)
        || (has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC)
    - name: usesAddedCapsOrPrivEsc
      expression: >-
        variables.podSpec.containers.exists(c, has(c.securityContext) && (
          (has(c.securityContext.capabilities) &&
           has(c.securityContext.capabilities.add) &&
           size(c.securityContext.capabilities.add) > 0) ||
          (has(c.securityContext.allowPrivilegeEscalation) &&
           c.securityContext.allowPrivilegeEscalation)))
        || (has(variables.podSpec.initContainers) &&
            variables.podSpec.initContainers.exists(c,
              has(c.securityContext) && (
                (has(c.securityContext.capabilities) &&
                 has(c.securityContext.capabilities.add) &&
                 size(c.securityContext.capabilities.add) > 0) ||
                (has(c.securityContext.allowPrivilegeEscalation) &&
                 c.securityContext.allowPrivilegeEscalation))))
        || (has(variables.podSpec.ephemeralContainers) &&
            variables.podSpec.ephemeralContainers.exists(c,
              has(c.securityContext) && (
                (has(c.securityContext.capabilities) &&
                 has(c.securityContext.capabilities.add) &&
                 size(c.securityContext.capabilities.add) > 0) ||
                (has(c.securityContext.allowPrivilegeEscalation) &&
                 c.securityContext.allowPrivilegeEscalation))))
    - name: usesForeignAudienceProjection
      expression: >-
        has(variables.podSpec.volumes) &&
        variables.podSpec.volumes.exists(v,
          has(v.projected) && has(v.projected.sources) &&
          v.projected.sources.exists(s,
            has(s.serviceAccountToken) &&
            (!has(s.serviceAccountToken.audience) ||
             s.serviceAccountToken.audience != variables.tokenAudience)))
    - name: setsNodeName
      expression: >-
        has(variables.podSpec.nodeName) &&
        (object.kind != 'Pod' || request.operation == 'CREATE')
    - name: usesPrivileged
      expression: >-
        variables.podSpec.containers.exists(c,
          has(c.securityContext) && has(c.securityContext.privileged) &&
          c.securityContext.privileged == true)
        || (has(variables.podSpec.initContainers) &&
            variables.podSpec.initContainers.exists(c,
              has(c.securityContext) && has(c.securityContext.privileged) &&
              c.securityContext.privileged == true))
        || (has(variables.podSpec.ephemeralContainers) &&
            variables.podSpec.ephemeralContainers.exists(c,
              has(c.securityContext) && has(c.securityContext.privileged) &&
              c.securityContext.privileged == true))
    - name: usesSecretEnv
      expression: >-
        variables.podSpec.containers.exists(c,
          (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))) ||
          (has(c.env) && c.env.exists(e,
            has(e.valueFrom) && has(e.valueFrom.secretKeyRef))))
        || (has(variables.podSpec.initContainers) &&
            variables.podSpec.initContainers.exists(c,
              (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))) ||
              (has(c.env) && c.env.exists(e,
                has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))))
        || (has(variables.podSpec.ephemeralContainers) &&
            variables.podSpec.ephemeralContainers.exists(c,
              (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))) ||
              (has(c.env) && c.env.exists(e,
                has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))))
  validations:
    - expression: >-
        variables.allowedNamespaces.exists(n, n == request.namespace)
      message: >-
        this namespace is not part of the owner-approved release scope
        recorded in fs2-image-provenance-allowlist; the signed scope and the
        enforced coverage must be identical (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.images.all(i, i.matches('^.+@sha256:[0-9a-f]{64}$'))
      message: >-
        every container image in this namespace must be pinned to an exact
        @sha256 digest (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.images.all(i,
          variables.registryPrefixes.exists(p, i.startsWith(p)))
      message: >-
        every container image in this namespace must come from an allow-listed
        registry prefix in fs2-image-provenance-allowlist (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.platformRepositoryPrefix != '' &&
        variables.images.all(i,
          !i.startsWith(variables.platformRepositoryPrefix) ||
          variables.platformDigests.exists(d, i.endsWith('@' + d)))
      message: >-
        platform application images must use a cosign-signed digest recorded in
        fs2-image-provenance-allowlist; sign and allow-list the release before
        deploying it (SAI-09)
      reason: Forbidden
    - expression: >-
        !variables.isAutomationPod || (
          has(variables.podSpec.automountServiceAccountToken) &&
          variables.podSpec.automountServiceAccountToken == false &&
          (!has(variables.podSpec.volumes) ||
           variables.podSpec.volumes.all(v,
             (has(v.projected) || has(v.configMap) || has(v.emptyDir) ||
              has(v.downwardAPI) ||
              (has(v.csi) && variables.deployCredentialCsiDriver != '' &&
               v.csi.driver == variables.deployCredentialCsiDriver &&
               has(v.csi.readOnly) && v.csi.readOnly == true &&
               has(v.csi.volumeAttributes) &&
               'secretProviderClass' in v.csi.volumeAttributes &&
               v.csi.volumeAttributes['secretProviderClass'] ==
                 variables.deployCredentialSpc)) &&
             (!has(v.projected) || !has(v.projected.sources) ||
              v.projected.sources.all(s,
                !has(s.secret) &&
                (!has(s.serviceAccountToken) || (
                  has(s.serviceAccountToken.audience) &&
                  s.serviceAccountToken.audience == variables.tokenAudience &&
                  has(s.serviceAccountToken.expirationSeconds) &&
                  s.serviceAccountToken.expirationSeconds <= 3600)))))) &&
          !variables.usesSecretEnv)
      message: >-
        pods running as an automation identity must disable token automount,
        project only the exact bounded token-audience (<=3600s), and mount
        ONLY projected/configMap/emptyDir/downwardAPI volumes plus the one
        owner-named credential CSI driver — no Secret volumes, no Secret env
        values, no other storage; workload-create rights never become
        identity-credential or stored-credential access (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.isAutomationPod ||
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v,
          !has(v.projected) || !has(v.projected.sources) ||
          v.projected.sources.all(s,
            !has(s.serviceAccountToken) ||
            !has(s.serviceAccountToken.audience) ||
            s.serviceAccountToken.audience != variables.tokenAudience))
      message: >-
        the automation token-audience is exclusive to the automation
        identities; no other pod may project a token carrying it (SAI-09)
      reason: Forbidden
    - expression: >-
        !variables.writerIsAutomation || (
          variables.workloadServiceAccounts.exists(
            a, a == variables.serviceAccountRow) &&
          !variables.usesHostPath &&
          !variables.usesPrivileged &&
          !variables.usesHostNamespaces &&
          !variables.usesAddedCapsOrPrivEsc &&
          !variables.setsNodeName &&
          !variables.usesForeignAudienceProjection &&
          !variables.usesSecretEnv &&
          !variables.usesProjectedSecretSource &&
          variables.allContainersRefusePrivEsc &&
          (!has(variables.podSpec.volumes) ||
           variables.podSpec.volumes.all(v,
             has(v.projected) || has(v.configMap) || has(v.emptyDir) ||
             has(v.downwardAPI) ||
             (has(v.persistentVolumeClaim) &&
              variables.workloadPvcPrefixes.exists(p,
                p.endsWith('*')
                ? v.persistentVolumeClaim.claimName.startsWith(
                    p.substring(0, p.size() - 1))
                : v.persistentVolumeClaim.claimName == p)) ||
             (has(v.csi) && variables.workloadCsiDrivers.exists(
                d, d == v.csi.driver) &&
              v.csi.driver != variables.deployCredentialCsiDriver &&
              has(v.csi.readOnly) && v.csi.readOnly == true))))
      message: >-
        workloads written by an automation identity must run as an
        owner-enumerated ServiceAccount, set allowPrivilegeEscalation false
        on every container, and may mount only projected(no Secret
        sources)/configMap/emptyDir/downwardAPI volumes, PVCs whose claim
        names carry an owner-enumerated prefix, and read-only owner-listed
        CSI drivers — never hostPath, privileged
        containers, host network/PID/IPC namespaces, added capabilities,
        direct nodeName scheduling, Secret volumes/env, or token projections
        outside the bounded automation audience; workload-create rights
        never become identity, credential, host, node, storage, or privilege
        escalation (SAI-09)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-image-provenance
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  policyName: fs2-image-provenance
  validationActions: [Deny, Audit]
  paramRef:
    name: fs2-image-provenance-allowlist
    namespace: fs2-system
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [fs2-system, fs2-models]
---
# A digest allow-list alone does not stop a config-only `helm upgrade` that
# reuses allow-listed images while changing Services, routes, or chart
# behavior. Helm records every release version as a Secret of type
# helm.sh/release.v1, so restricting who may write those Secrets makes such an
# upgrade admission-visible. Under the DECIDED release-identity contract
# (owner decision 2026-09-16; defined in iam-boundary.yaml and applied at the
# separately authorized rollout window), Helm release state moves out of
# Secrets entirely (HELM_DRIVER=sql against the control-plane PostgreSQL —
# the renderer's pinned tool runner passes HELM_DRIVER and
# HELM_DRIVER_SQL_CONNECTION_STRING through so its Helm enumeration reads the
# SQL backend too, and Helm OPERATES without any release-Secret write) and
# the release Role holds NO Secret verbs. The scope's helm_secret_writers
# field (rendered into this policy's deploy-principals key) is then EMPTY —
# the CONTRACT IS FEASIBLE: an empty writer list denies EVERY
# helm.sh/release.v1 Secret write outright while Helm keeps working on the
# SQL driver, strictly stronger than principal pinning. Until that rollout
# executes, the owner may keep a non-empty writer list and Terraform's
# no-drift plan remains the compensating detective control for config-only
# kubectl drift outside admission's view.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-helm-release-governance
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
        scope: Namespaced
  variables:
    - name: deployPrincipals
      expression: >-
        ('deploy-principals' in params.data
         ? params.data['deploy-principals'] : '')
        .split("\n").filter(p, p != '')
  validations:
    - expression: >-
        !(has(object.type) && object.type == 'helm.sh/release.v1') ||
        variables.deployPrincipals.exists(p, p == request.userInfo.username)
      message: >-
        Helm release versions in this namespace may only be written by the
        governed deploy principals recorded in fs2-image-provenance-allowlist;
        use the release-gated wrapper path (SAI-09)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-helm-release-governance
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  policyName: fs2-helm-release-governance
  validationActions: [Deny, Audit]
  paramRef:
    name: fs2-image-provenance-allowlist
    namespace: fs2-system
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [fs2-system]
---
# Security-owned parameter guard (owner decision #4 support control — NOT the
# non-removable boundary itself).
#
# CORRECTED CONTRACT (independent reviewer ruling, 2026-09-16): Kubernetes
# admission INTENTIONALLY does not evaluate in-cluster admission policies or
# webhooks on writes/deletion of admission-configuration resources
# (ValidatingAdmissionPolicy/Binding, Mutating/ValidatingWebhookConfiguration)
# — an anti-lockout design to avoid circular dependencies. Therefore NO
# in-cluster VAP or webhook can make the provenance policies non-removable,
# and this guard does not claim to. The NON-REMOVABLE guarantee for the
# policy objects is the owner-approved EXTERNAL control: provider/IAM/RBAC —
# no human or release-identity delete/update rights on admissionregistration
# resources, no impersonation grants, provider-held apiserver/etcd. Until
# that external control is in place, deletion or weakening of the policy
# objects is DETECTED (not prevented) by the renderer: every allow-list
# render fetches the live policy objects and refuses to render unless they
# equal the committed, owner-scope-pinned definitions.
#
# What this guard DOES enforce (ConfigMaps are ordinary resources that
# admission fully evaluates): only the security automation identity may
# create, update, or delete the allow-list ConfigMap and this guard's own
# parameter ConfigMap. The release identity produces the rendered allow-list
# and hands it to the security identity for application; humans write
# nothing here. Break-glass (validationActions changes) is a PROCEDURAL
# contract enforced by the external control and verified with
# `provenance.py verify-recovery` (owner-signed, bounded, reversible, never
# deletion); the renderer refuses to render against weakened live actions.
# Bootstrap order: create fs2-security-guard-params, then apply this guard;
# afterwards both ConfigMaps are admission-protected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-provenance-guard
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
        scope: Namespaced
  variables:
    - name: securityPrincipals
      expression: >-
        ('security-principals' in params.data
         ? params.data['security-principals'] : '')
        .split("\n").filter(p, p != '')
    - name: guardAutomationAccounts
      expression: >-
        ('automation-service-accounts' in params.data
         ? params.data['automation-service-accounts'] : '')
        .split("\n").filter(a, a != '')
    - name: guardWriterIsAutomation
      expression: >-
        variables.guardAutomationAccounts.exists(a,
          'system:serviceaccount:' + a == request.userInfo.username)
    - name: guardNamespaces
      expression: >-
        ('namespaces' in params.data
         ? params.data['namespaces'] : '')
        .split("\n").filter(n, n != '')
    - name: subject
      expression: >-
        object != null ? object : oldObject
    - name: isProtected
      expression: >-
        variables.subject.metadata.namespace == 'fs2-system' &&
        ['fs2-image-provenance-allowlist', 'fs2-security-guard-params']
        .exists(n, n == variables.subject.metadata.name)
  validations:
    - expression: >-
        !variables.isProtected ||
        variables.securityPrincipals.exists(p, p == request.userInfo.username)
      message: >-
        the allow-list and guard parameter ConfigMaps may only be changed by
        the security automation identity; the release identity and humans
        write nothing here (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.subject.kind != 'Service' ||
        !variables.guardWriterIsAutomation || (
          (!has(variables.subject.spec.type) ||
           (variables.subject.spec.type != 'NodePort' &&
            variables.subject.spec.type != 'LoadBalancer' &&
            variables.subject.spec.type != 'ExternalName')) &&
          !has(variables.subject.spec.externalIPs) &&
          !has(variables.subject.spec.externalName))
      message: >-
        Services written by an automation identity must stay ClusterIP-only:
        NodePort/LoadBalancer/ExternalName types, externalIPs, and
        externalName redirects turn a deploy grant into external exposure or
        traffic diversion (SAI-09)
      reason: Forbidden
    - expression: >-
        !variables.guardWriterIsAutomation ||
        variables.guardNamespaces.exists(n, n == request.namespace)
      message: >-
        automation identities write ConfigMaps and Services only inside the
        owner-approved scope namespaces (SAI-09)
      reason: Forbidden
    - expression: >-
        variables.subject.kind != 'Service' ||
        !variables.guardWriterIsAutomation ||
        request.operation != 'UPDATE' ||
        oldObject == null ||
        !has(oldObject.spec.selector) ||
        (has(object.spec.selector) &&
         object.spec.selector == oldObject.spec.selector)
      message: >-
        an automation identity may not CHANGE a Service selector: selector
        swaps silently redirect existing traffic to different pods (SAI-09)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-provenance-guard
  labels:
    app.kubernetes.io/name: fs2-image-provenance
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
spec:
  policyName: fs2-provenance-guard
  validationActions: [Deny, Audit]
  paramRef:
    name: fs2-security-guard-params
    namespace: fs2-system
    parameterNotFoundAction: Deny
  matchResources: {}
