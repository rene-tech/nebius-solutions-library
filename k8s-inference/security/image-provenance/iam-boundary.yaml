# PREVENTIVE external identity boundary — SOURCE DEFINITION (SAI-09,
# owner decision #4). This manifest DEFINES the boundary; it is applied only
# at a separately authorized rollout window by the owner/security identity
# (source-only additive implementation now; NO live mutation before then).
#
# The contract this defines, verified live at every render by
# provenance.py's identity audit (verify path: _assert_iam_boundary +
# _assert_identity_hygiene):
#   * Exactly two automation identities exist for the release system, both
#     ServiceAccounts with automountServiceAccountToken: false (tokens only
#     via bounded, audience-bound TokenRequest projections):
#       - RELEASE identity (deploy principal): writes Helm release Secrets
#         through the gated wrapper path; may NOT touch admission
#         configuration, parameter ConfigMaps, RBAC, tokens, or secrets.
#       - SECURITY identity: sole writer of the two parameter ConfigMaps and
#         sole executor of reconcile-boundary under an owner-signed,
#         plan-bound, single-use authorization.
#   * NO human and NO release identity holds, directly or transitively:
#     admissionregistration writes (any current or future kind), RBAC
#     role/binding mutation,
#     impersonation in any dimension (users/groups/serviceaccounts/uids/
#     userextras/*), ServiceAccount token minting (serviceaccounts/token or
#     legacy token-Secret writes), RBAC bind/escalate, CSR
#     create/approve/sign, secrets read/write in the protected namespaces,
#     pods/exec|attach|ephemeralcontainers in the protected namespaces, or
#     workload/ServiceAccount writes in fs2-security.
#   * PROVIDER attestations (outside the RBAC surface): system:masters
#     client-certificate issuance, apiserver flags/etcd/node access are
#     provider-held facts that enter ONLY as the ATTESTOR-SIGNED provider
#     attestation document — verified against the SEPARATE attestor key
#     pinned by the owner-signed scope's attestation_key_sha256 (required to
#     differ from the release verification key, so the pipeline can never
#     attest its own boundary), binding the exported provider IAM policy by
#     SHA-256 and embedding the anchored-heads snapshot for EVERY
#     tamper-evident chain. The WORM anchor export (export-anchored-heads)
#     is stored off-host so chain deletion AND history rewrite beneath new
#     growth are detectable (prefix-verified).
#   * IDENTITY allowances in the audit are FUNCTION-SCOPED, never blanket:
#     the security identity is permitted admission-configuration writes ONLY
#     (its reconciler function), the deploy identity workload writes in the
#     scope namespaces ONLY; either identity holding any other forbidden
#     verb — impersonation, token minting, secret access included — fails
#     the audit like any other subject.
apiVersion: v1
kind: Namespace
metadata:
  name: fs2-security
  labels:
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-admission-guard
  namespace: fs2-security
  labels:
    security.fs2.nebius.ai/finding: sai-09
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-release-automation
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
automountServiceAccountToken: false
---
# SECURITY identity: parameter-ConfigMap writes + reconciler reads/patches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fs2-security-boundary-operator
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: ["get", "list", "create", "update", "patch"]
  # NO secrets verbs: the reconciler never reads stored credentials, and the
  # function-scoped audit would refuse a security identity holding
  # secret access (the allowance covers admission-configuration writes only).
  - apiGroups: [""]
    resources: ["namespaces", "pods", "serviceaccounts"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-security-boundary-operator
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-security-boundary-operator
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-admission-guard
---
# RELEASE identity: workload apply ONLY. It holds NO forbidden verb — in
# particular NO Secret verbs at all: Helm release state moves out of Secrets
# entirely (HELM_DRIVER=sql against the control-plane PostgreSQL; the DSN
# reaches the deploy job as a pod-mounted credential provisioned by the
# owner, never through Secret API access), application Secret PROVISIONING
# is a separated security/owner duty (charts must not template Secrets —
# integration requirement), and with an EMPTY deploy-principals list the
# fs2-helm-release-governance policy then denies every helm.sh/release.v1
# Secret write outright, strictly stronger than principal pinning.
#
# INDIRECT-pivot closure (workload rights are still identity-adjacent: a pod
# spec can mount Secrets or project tokens without any Secret/token RBAC):
# the fs2-image-provenance policy enforces, IN ADMISSION, that any pod
# running as an automation identity disables token automount, projects only
# the exact bounded token-audience, and mounts no Secret volumes or Secret
# env values — and that NO other pod projects the automation token-audience.
# The render-time hygiene audit re-verifies the same facts live. So the
# workload-create grant below cannot be pivoted into minting an
# apiserver-audience token for the release identity or exfiltrating stored
# credentials through an identity pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-release-deployer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - services
      - configmaps
      - deployments
      - daemonsets
      - statefulsets
      - jobs
      - cronjobs
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-release-deployer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-release-deployer
subjects:
  - kind: ServiceAccount
    namespace: fs2-system
    name: fs2-release-automation
