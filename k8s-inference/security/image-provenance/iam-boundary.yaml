# PREVENTIVE external identity boundary — SOURCE DEFINITION (SAI-09,
# owner decision #4). This manifest DEFINES the boundary; it is applied only
# at a separately authorized rollout window by the owner/security identity
# (source-only additive implementation now; NO live mutation before then).
#
# The contract this defines, verified live at every render by
# provenance.py's identity audit (verify path: _assert_iam_boundary +
# _assert_identity_hygiene):
#   * Exactly three automation identities exist for the release system, all
#     ServiceAccounts with automountServiceAccountToken: false (tokens only
#     via bounded, audience-bound TokenRequest projections):
#       - RELEASE identity (deploy principal): applies workloads through the
#         gated wrapper path (Helm state on the SQL driver); may NOT touch
#         admission configuration, parameter ConfigMaps, RBAC, tokens, or
#         secrets.
#       - SECURITY identity: sole writer of the four protected state
#         ConfigMaps and
#         sole executor of reconcile-boundary under an owner-signed,
#         plan-bound, single-use authorization.
#       - DEBUG identity: sole holder of pods/ephemeralcontainers writes —
#         the documented kubectl-debug path, admission-image-pinned.
#   * NO human and NO release identity holds, directly or transitively:
#     admissionregistration writes (any current or future kind), RBAC
#     role/binding mutation,
#     impersonation in any dimension (users/groups/serviceaccounts/uids/
#     userextras/*), ServiceAccount token minting (serviceaccounts/token or
#     legacy token-Secret writes), RBAC bind/escalate, CSR
#     create/approve/sign, secrets read/write in the protected namespaces,
#     pods/exec|attach|portforward in the protected namespaces (NOBODY holds
#     these), pods/ephemeralcontainers outside the designated DEBUG identity
#     (the documented kubectl-debug path stays capable, admission-pinned,
#     least-privilege), or workload/ServiceAccount writes in fs2-security.
#   * PROVIDER attestations (outside the RBAC surface): system:masters
#     client-certificate issuance, apiserver flags/etcd/node access are
#     provider-held facts that enter ONLY as the ATTESTOR-SIGNED provider
#     attestation document — verified against the SEPARATE attestor key
#     pinned by the owner-signed scope's attestation_key_sha256 (required to
#     differ from the release verification key, so the pipeline can never
#     attest its own boundary; the CURRENTLY committed attestor key is an
#     ENFORCED bootstrap placeholder — ATTESTATION_KEY_PROVENANCE — that
#     every path refuses until the OWNER originates the real key).
#     This manifest itself is pinned by the scope (iam_boundary_sha256) and
#     every object below must exist LIVE and equal it at verification time. The provider facts are checked LIVE through
#     the owner-pinned provider CLI: every scope-enumerated ancestry level's
#     access bindings (admin-class grants must name attestation-enumerated
#     subjects) and the WORM bucket's object-lock/retention configuration.
#     The attestation embeds the anchored-heads snapshot for EVERY
#     tamper-evident chain; the WORM anchor export (export-anchored-heads)
#     is stored off-host so chain deletion AND history rewrite beneath new
#     growth are detectable (prefix-verified), and checkpoint-less legacy
#     ledgers are adopted only when the signed anchor confirms them.
#   * IDENTITY allowances in the audit are FUNCTION-SCOPED, never blanket:
#     the security identity is permitted admission-configuration writes ONLY
#     (its reconciler function), the deploy identity workload writes in the
#     scope namespaces ONLY; either identity holding any other forbidden
#     verb — impersonation, token minting, secret access included — fails
#     the audit like any other subject.
apiVersion: v1
kind: Namespace
metadata:
  name: fs2-security
  labels:
    app.kubernetes.io/part-of: fs2-serve
    security.fs2.nebius.ai/finding: sai-09
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-admission-guard
  namespace: fs2-security
  labels:
    security.fs2.nebius.ai/finding: sai-09
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-release-automation
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
automountServiceAccountToken: false
---
# SECURITY identity: the MINIMUM its reconciler function needs, nothing
# broad. Mutation is resourceName-scoped to the six protected admission
# objects. Bootstrap creation is an OWNER rollout action because Kubernetes
# RBAC cannot resourceName-scope `create`; the reconciler therefore has no
# admission-object create/delete authority. NO secrets verbs, NO pod/serviceaccount
# reads, NO cluster-wide ConfigMap authority: the reconciler never reads
# stored credentials, and the function-scoped audit refuses a security
# identity holding anything beyond admission-configuration writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fs2-security-boundary-operator
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    resourceNames:
      - fs2-image-provenance
      - fs2-helm-release-governance
      - fs2-provenance-guard
      - fs2-reviewed-source-governance
      - fs2-debug-session-access
      - fs2-debug-session-rbac
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["fs2-debug-admission"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["fs2-debug-admission"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["fs2-debug-session-connect"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-security-boundary-operator
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-security-boundary-operator
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-admission-guard
---
# SECURITY identity's ConfigMap authority: NAMESPACED to fs2-system and
# name-scoped to exactly the four protected state ConfigMaps (create is
# namespace-bounded; updates/patches are name-bounded; the guard VAP
# additionally denies any other principal writing these names).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-security-guard-params-writer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - fs2-image-provenance-allowlist
      - fs2-security-guard-params
      - fs2-debug-sessions
      - fs2-reviewed-resources
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-security-guard-params-writer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-security-guard-params-writer
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-admission-guard
---
# Append-only debug-session registry. The guard policy prevents deletion,
# mutation of active rows, or removal of retirement markers. Session rows are
# installed only after owner-signature, cluster, Pod UID, tenant, container,
# image, nonce, and expiry verification by provenance.py. The exact signed
# document and detached signature are retained beside each active row so the
# read-only IAM audit re-verifies authority instead of trusting row shape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fs2-debug-sessions
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
data: {}
---
# Append-only owner-reviewed release-resource registry. Each session stores
# one immutable meta.<nonce> row and immutable grant.<nonce>.<index> rows
# rendered only from an owner-signed plan. The release admission webhook
# hashes the actual defaulted AdmissionReview object and requires an exact
# operation/resource/name/hash/old-UID/old-resourceVersion grant before any
# direct, config-only, or HELM_DRIVER=sql mutation is admitted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fs2-reviewed-resources
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
data: {}
---
# The owner-signed scope pins this IAM manifest, which in turn pins the exact
# installable debug-admission manifest bytes. provenance.py refuses if this
# digest does not match debug-admission.example.yaml or if any live webhook,
# deployment, Service, SA, or read-only RBAC object differs from those bytes.
# The owner replaces the template image/CA, updates this digest, and signs the
# resulting scope as one review transaction.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fs2-debug-admission-pin
  namespace: fs2-security
  labels:
    security.fs2.nebius.ai/finding: sai-09
data:
  manifest-sha256: "90f73f39b8c8e85b1a14753ae078859e95fb3c59d3a72f58e6ad424cb566c559"
---
# SECURITY installs and retires exact session Roles/RoleBindings. Delete is
# deliberately absent: retirement is a deny marker followed by empty rules
# and subjects, preserving forensic history.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-debug-session-installer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-debug-session-installer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-debug-session-installer
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-admission-guard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-debug-session-installer
  namespace: fs2-models
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-debug-session-installer
  namespace: fs2-models
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-debug-session-installer
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-admission-guard
---
# DEBUG identity: the DOCUMENTED customer kubectl-debug workflow stays
# FUNCTIONAL end to end, but with EXACT governed target binding — the debug
# verbs are never a standing namespace-wide grant (that would let the
# identity attach to / read logs of ANY pod, an exfiltration pivot). Flow:
#   1. The OWNER (security) signs a debug-session document naming the exact
#      cluster/namespace/pod/container/tenant + a nonce and a bounded TTL.
#   2. `provenance.py render-debug-session` emits an ephemeral Role +
#      RoleBinding scoped by resourceNames to THAT pod
#      (pods/ephemeralcontainers get/update/patch, pods/attach get/create)
#      plus the standing pods get/list below; the security
#      identity applies it for the TTL; expiry denies access, and retirement
#      appends a durable deny marker before emptying rules/subjects. Objects
#      are never deleted, so the grant history remains inspectable.
#   3. kubectl -n <ns> debug <pod> --image <pinned> …  (inject; -it attaches)
#      functions against exactly that pod. pods/log stays denied because GET
#      does not traverse the TTL-enforcing CONNECT admission path.
# exec and port-forward remain forbidden for EVERYONE. The live IAM audit
# permits the session Role only because it is resourceName-scoped
# (session grant-shape); a namespace-wide debug grant still violates. The
# standing Role/RoleBinding pair is defined for BOTH platform namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-debugger
  namespace: fs2-security
  labels:
    security.fs2.nebius.ai/finding: sai-09
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-debug-ephemeral
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  # STANDING grant: only enumerate pods to locate a target. The debug
  # verbs (pods/ephemeralcontainers, pods/attach) are NOT
  # standing — they are rendered per OWNER-SIGNED debug-session,
  # resourceName-scoped to the exact target pod, by
  # `provenance.py render-debug-session` and applied for the session's TTL.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-debug-ephemeral
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-debug-ephemeral
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-debugger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-debug-ephemeral
  namespace: fs2-models
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  # STANDING grant: only enumerate pods to locate a target. The debug
  # verbs (pods/ephemeralcontainers, pods/attach) are NOT
  # standing — they are rendered per OWNER-SIGNED debug-session,
  # resourceName-scoped to the exact target pod, by
  # `provenance.py render-debug-session` and applied for the session's TTL.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-debug-ephemeral
  namespace: fs2-models
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-debug-ephemeral
subjects:
  - kind: ServiceAccount
    namespace: fs2-security
    name: fs2-debugger
---
# RELEASE identity: workload apply ONLY. It holds NO forbidden verb — in
# particular NO Secret verbs at all: Helm release state moves out of Secrets
# entirely (HELM_DRIVER=sql against the control-plane PostgreSQL; the DSN
# reaches the deploy job as a pod-mounted credential provisioned by the
# owner, never through Secret API access), application Secret PROVISIONING
# is a separated security/owner duty (charts must not template Secrets —
# integration requirement), and with an EMPTY deploy-principals list the
# fs2-helm-release-governance policy then denies every helm.sh/release.v1
# Secret write outright, strictly stronger than principal pinning.
#
# INDIRECT-pivot closure (workload rights are still identity-adjacent: a pod
# spec can mount Secrets or project tokens without any Secret/token RBAC):
# the fs2-image-provenance policy enforces, IN ADMISSION, that any pod
# running as an automation identity disables token automount, projects only
# the exact bounded token-audience, and mounts no Secret volumes or Secret
# env values — and that NO other pod projects the automation token-audience.
# ADDITIONALLY, any workload WRITTEN BY an automation identity may only run
# as an OWNER-ENUMERATED ServiceAccount (scope.workload_service_accounts,
# rendered into the allow-list) and may not use hostPath volumes or
# privileged containers — so the grant below cannot schedule a pod under an
# arbitrary ServiceAccount to harvest its tokens/Secrets, reach the host
# filesystem, or gain privileged execution. The render-time hygiene audit
# re-verifies the identity-pod facts live. So the workload-create grant
# below cannot be pivoted into minting an apiserver-audience token for the
# release identity or exfiltrating stored credentials through an identity
# pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-release-deployer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - services
      - configmaps
      - deployments
      - daemonsets
      - statefulsets
      - jobs
      - cronjobs
    verbs: ["get", "list", "create", "update", "patch"]
  # PVC writes are a SEPARATE rule (and a separate audited identity path):
  # the grant-shape check binds each rule to its own forbidden-rule shape,
  # and PVC delete is never granted.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-release-deployer
  namespace: fs2-system
  labels:
    security.fs2.nebius.ai/finding: sai-09
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-release-deployer
subjects:
  - kind: ServiceAccount
    namespace: fs2-system
    name: fs2-release-automation
