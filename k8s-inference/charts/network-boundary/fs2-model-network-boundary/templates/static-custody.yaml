# This policy is evaluated by kube-apiserver itself and protects only resource
# kinds Kubernetes actually sends through ValidatingAdmissionPolicy. Kubernetes
# deliberately excludes ValidatingAdmissionPolicy and its binding from both VAP
# and validating-webhook matching. Those excluded objects are therefore guarded
# by the external provider/IAM policy named in the signed custody receipt and
# checked here only as detective live/source equality. This manifest must never
# be described as self-protecting.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-model-network-static-custody
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-custody
  annotations:
    fs2-serve.nebius.ai/custody-provider: nebius-iam
    fs2-serve.nebius.ai/custody-trust-domain: {{ .Values.custodyTrustDomain | quote }}
    fs2-serve.nebius.ai/custodian-principal-id: {{ .Values.custodianPrincipalId | quote }}
    fs2-serve.nebius.ai/recovery-principal-id: {{ .Values.recoveryPrincipalId | quote }}
    fs2-serve.nebius.ai/break-glass-mode: externally-custodied-update-only
    fs2-serve.nebius.ai/external-custody-policy-id: {{ .Values.externalCustody.policyId | quote }}
    fs2-serve.nebius.ai/external-custody-policy-revision: {{ .Values.externalCustody.policyRevision | quote }}
    fs2-serve.nebius.ai/external-custody-policy-sha256: {{ .Values.externalCustody.policySha256 | quote }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts", "services", "secrets", "configmaps"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
        scope: Namespaced
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["leases"]
        scope: Namespaced
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
        scope: Namespaced
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
        scope: Namespaced
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["issuers", "issuers/status", "certificates", "certificates/status"]
        scope: Namespaced
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
        scope: "*"
  variables:
    - name: newMetadata
      expression: "request.operation == 'DELETE' ? null : object.metadata"
    - name: oldMetadata
      expression: "request.operation == 'CREATE' ? null : oldObject.metadata"
    - name: protectedObject
      expression: >-
        (variables.newMetadata != null && has(variables.newMetadata.labels) &&
         'fs2-serve.nebius.ai/network-boundary-authority' in variables.newMetadata.labels &&
         variables.newMetadata.labels['fs2-serve.nebius.ai/network-boundary-authority'] == 'true') ||
        (variables.oldMetadata != null && has(variables.oldMetadata.labels) &&
         'fs2-serve.nebius.ai/network-boundary-authority' in variables.oldMetadata.labels &&
         variables.oldMetadata.labels['fs2-serve.nebius.ai/network-boundary-authority'] == 'true') ||
        (request.resource.group == 'rbac.authorization.k8s.io' &&
         ((variables.newMetadata != null && variables.newMetadata.name.startsWith('fs2-model-network-')) ||
          (variables.oldMetadata != null && variables.oldMetadata.name.startsWith('fs2-model-network-'))))
    - name: noExtras
      expression: "!has(request.userInfo.extra) || request.userInfo.extra.size() == 0"
    - name: custodian
      expression: >-
        request.userInfo.username == {{ .Values.custodianUsername | quote }} &&
        request.userInfo.groups.size() == {{ len .Values.custodianGroups }} &&
        request.userInfo.groups.all(group, group in {{ .Values.custodianGroups | toJson }}) &&
        variables.noExtras
    - name: recovery
      expression: >-
        request.userInfo.username == {{ .Values.recoveryUsername | quote }} &&
        request.userInfo.groups.size() == {{ len .Values.recoveryGroups }} &&
        request.userInfo.groups.all(group, group in {{ .Values.recoveryGroups | toJson }}) &&
        variables.noExtras
    - name: transitionLeaseWriter
      expression: >-
        request.operation == 'UPDATE' &&
        request.resource.group == 'coordination.k8s.io' &&
        request.resource.resource == 'leases' &&
        request.namespace == {{ .Values.systemNamespace | quote }} &&
        request.name == 'fs2-model-network-transition' &&
        request.userInfo.username == {{ .Values.transitionWriterUsername | quote }} &&
        request.userInfo.groups.size() == {{ len .Values.transitionWriterGroups }} &&
        request.userInfo.groups.all(group, group in {{ .Values.transitionWriterGroups | toJson }}) &&
        variables.noExtras
    - name: maintenanceLeaseWriter
      expression: >-
        request.operation == 'UPDATE' &&
        request.resource.group == 'coordination.k8s.io' &&
        request.resource.resource == 'leases' &&
        request.namespace == {{ .Values.systemNamespace | quote }} &&
        request.name == 'fs2-model-network-maintenance' &&
        request.userInfo.username == {{ .Values.maintenanceWriterUsername | quote }} &&
        request.userInfo.groups.size() == {{ len .Values.maintenanceWriterGroups }} &&
        request.userInfo.groups.all(group, group in {{ .Values.maintenanceWriterGroups | toJson }}) &&
        variables.noExtras
    - name: certificateController
      expression: >-
        request.operation in ['CREATE', 'UPDATE'] &&
        request.namespace == {{ .Values.authorityNamespace | quote }} &&
        request.userInfo.username == {{ .Values.certificateWriterUsername | quote }} &&
        request.userInfo.groups.size() == {{ len .Values.certificateWriterGroups }} &&
        request.userInfo.groups.all(group, group in {{ .Values.certificateWriterGroups | toJson }}) &&
        (!has(request.userInfo.extra) || request.userInfo.extra.all(key, key in ['authentication.kubernetes.io/credential-id', 'authentication.kubernetes.io/node-name', 'authentication.kubernetes.io/node-uid', 'authentication.kubernetes.io/pod-name', 'authentication.kubernetes.io/pod-uid'])) &&
        ((request.resource.group == '' && request.resource.resource == 'secrets' && request.name in [{{ .Values.certificate.secretName | quote }}, {{ .Values.certificate.caSecretName | quote }}]) ||
         (request.operation == 'UPDATE' && request.resource.group == 'cert-manager.io' &&
          request.resource.resource in ['certificates', 'issuers'] && request.subResource == 'status' &&
          request.name in ['fs2-model-network-boundary', {{ .Values.certificate.caCertificateName | quote }}, {{ .Values.certificate.bootstrapIssuerName | quote }}, {{ .Values.certificate.servingIssuerName | quote }}]))
    - name: certificateSecretOnly
      expression: >-
        !variables.certificateController || request.resource.group != '' || request.resource.resource != 'secrets' ||
        (object.type == 'kubernetes.io/tls' &&
         has(object.data) &&
         'tls.crt' in object.data && 'tls.key' in object.data &&
         object.data.keys().all(key, key in ['tls.crt', 'tls.key', 'ca.crt']) &&
         has(object.metadata.labels) &&
         'fs2-serve.nebius.ai/network-boundary-authority' in object.metadata.labels &&
         object.metadata.labels['fs2-serve.nebius.ai/network-boundary-authority'] == 'true' &&
         (request.operation == 'CREATE' ||
          (oldObject.type == object.type &&
           oldObject.metadata.name == object.metadata.name &&
           oldObject.metadata.namespace == object.metadata.namespace &&
           oldObject.metadata.labels == object.metadata.labels &&
           oldObject.metadata.annotations == object.metadata.annotations)))
    - name: certificateStatusOnly
      expression: >-
        !variables.certificateController || request.resource.group != 'cert-manager.io' ||
        (request.operation == 'UPDATE' &&
         request.resource.resource in ['certificates', 'issuers'] &&
         request.subResource == 'status' &&
         object.apiVersion == oldObject.apiVersion && object.kind == oldObject.kind &&
         object.metadata.name == oldObject.metadata.name &&
         object.metadata.namespace == oldObject.metadata.namespace &&
         object.metadata.labels == oldObject.metadata.labels &&
         object.metadata.annotations == oldObject.metadata.annotations &&
         object.spec == oldObject.spec)
  validations:
    - expression: "!variables.protectedObject || request.operation != 'DELETE'"
      message: "network-boundary custody objects are update-only; recovery never deletes them"
      reason: Forbidden
    - expression: "!variables.certificateController || (variables.certificateSecretOnly && variables.certificateStatusOnly)"
      message: "the certificate controller may rotate only exact TLS data or update status without changing spec or metadata"
      reason: Forbidden
    - expression: "!variables.protectedObject || variables.custodian || variables.recovery || variables.transitionLeaseWriter || variables.maintenanceLeaseWriter || (variables.certificateController && variables.certificateSecretOnly && variables.certificateStatusOnly)"
      message: "network-boundary custody requires the exact external identity and group set"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-model-network-static-custody-binding
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-custody
  annotations:
    fs2-serve.nebius.ai/custody-provider: nebius-iam
    fs2-serve.nebius.ai/privileged-capability-cluster-roles-sha256: {{ .Values.privilegedCapabilityClusterRoles | sortAlpha | toJson | sha256sum | quote }}
    fs2-serve.nebius.ai/privileged-capability-roles-sha256: {{ .Values.privilegedCapabilityRoles | sortAlpha | toJson | sha256sum | quote }}
spec:
  policyName: fs2-model-network-static-custody
  validationActions: [Deny]
  matchResources:
    matchPolicy: Equivalent
---
# RBAC cannot express a deny. This policy blocks newly introduced identity-mint
# grants for ordinary writers. It is not self-custody: external provider/IAM
# custody prevents changes to this excluded admission object, and the receipt
# independently detects any drift in the complete stored policy/binding specs.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-model-network-impersonation-guard
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-custody
  annotations:
    fs2-serve.nebius.ai/custody-provider: nebius-iam
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
        scope: "*"
  variables:
    - name: isRole
      expression: "request.resource.resource in ['roles', 'clusterroles']"
    - name: isBinding
      expression: "request.resource.resource in ['rolebindings', 'clusterrolebindings']"
    - name: newIdentityMintRules
      expression: >-
        !variables.isRole || !has(object.rules) ? [] : object.rules.filter(rule,
          (rule.verbs.exists(verb, verb in ['impersonate', '*']) &&
           rule.apiGroups.exists(group, group in ['', 'authentication.k8s.io', '*']) &&
           rule.resources.exists(resource,
             resource in ['users', 'groups', 'serviceaccounts', 'uids', 'userextras', '*'] ||
             resource.startsWith('userextras/'))) ||
          (rule.verbs.exists(verb, verb in ['bind', 'escalate', '*']) &&
           rule.apiGroups.exists(group, group in ['rbac.authorization.k8s.io', '*']) &&
           rule.resources.exists(resource, resource in ['roles', 'clusterroles', '*'])) ||
          (rule.verbs.exists(verb, verb in ['approve', 'sign', '*']) &&
           rule.apiGroups.exists(group, group in ['certificates.k8s.io', '*']) &&
           rule.resources.exists(resource,
             resource in ['certificatesigningrequests', 'certificatesigningrequests/approval', 'signers', '*'])) ||
          (rule.verbs.exists(verb, verb in ['create', 'get', 'list', 'watch', 'update', 'patch', '*']) &&
           ((rule.apiGroups.exists(group, group in ['', '*']) &&
             rule.resources.exists(resource, resource in ['serviceaccounts/token', 'secrets', '*'])) ||
            (rule.apiGroups.exists(group, group in ['certificates.k8s.io', '*']) &&
             rule.resources.exists(resource, resource in ['certificatesigningrequests', '*'])))) ||
          (rule.verbs.exists(verb, verb in ['create', 'get', 'list', 'watch', 'update', 'patch', 'delete', 'deletecollection', '*']) &&
           ((rule.apiGroups.exists(group, group in ['', '*']) &&
             rule.resources.exists(resource, resource in ['pods', 'pods/attach', 'pods/ephemeralcontainers', 'pods/exec', 'pods/log', 'pods/portforward', 'pods/proxy', 'replicationcontrollers', 'replicationcontrollers/scale', '*'])) ||
            (rule.apiGroups.exists(group, group in ['apps', '*']) &&
             rule.resources.exists(resource, resource in ['daemonsets', 'deployments', 'deployments/scale', 'replicasets', 'replicasets/scale', 'statefulsets', 'statefulsets/scale', '*'])) ||
            (rule.apiGroups.exists(group, group in ['batch', '*']) &&
             rule.resources.exists(resource, resource in ['cronjobs', 'jobs', '*'])) ||
            (rule.apiGroups.exists(group, group in ['jobset.x-k8s.io', '*']) &&
             rule.resources.exists(resource, resource in ['jobsets', '*'])))))
    - name: oldIdentityMintRules
      expression: >-
        request.operation == 'CREATE' || !variables.isRole || !has(oldObject.rules) ? [] : oldObject.rules.filter(rule,
          (rule.verbs.exists(verb, verb in ['impersonate', '*']) &&
           rule.apiGroups.exists(group, group in ['', 'authentication.k8s.io', '*']) &&
           rule.resources.exists(resource,
             resource in ['users', 'groups', 'serviceaccounts', 'uids', 'userextras', '*'] ||
             resource.startsWith('userextras/'))) ||
          (rule.verbs.exists(verb, verb in ['bind', 'escalate', '*']) &&
           rule.apiGroups.exists(group, group in ['rbac.authorization.k8s.io', '*']) &&
           rule.resources.exists(resource, resource in ['roles', 'clusterroles', '*'])) ||
          (rule.verbs.exists(verb, verb in ['approve', 'sign', '*']) &&
           rule.apiGroups.exists(group, group in ['certificates.k8s.io', '*']) &&
           rule.resources.exists(resource,
             resource in ['certificatesigningrequests', 'certificatesigningrequests/approval', 'signers', '*'])) ||
          (rule.verbs.exists(verb, verb in ['create', 'get', 'list', 'watch', 'update', 'patch', '*']) &&
           ((rule.apiGroups.exists(group, group in ['', '*']) &&
             rule.resources.exists(resource, resource in ['serviceaccounts/token', 'secrets', '*'])) ||
            (rule.apiGroups.exists(group, group in ['certificates.k8s.io', '*']) &&
             rule.resources.exists(resource, resource in ['certificatesigningrequests', '*'])))) ||
          (rule.verbs.exists(verb, verb in ['create', 'get', 'list', 'watch', 'update', 'patch', 'delete', 'deletecollection', '*']) &&
           ((rule.apiGroups.exists(group, group in ['', '*']) &&
             rule.resources.exists(resource, resource in ['pods', 'pods/attach', 'pods/ephemeralcontainers', 'pods/exec', 'pods/log', 'pods/portforward', 'pods/proxy', 'replicationcontrollers', 'replicationcontrollers/scale', '*'])) ||
            (rule.apiGroups.exists(group, group in ['apps', '*']) &&
             rule.resources.exists(resource, resource in ['daemonsets', 'deployments', 'deployments/scale', 'replicasets', 'replicasets/scale', 'statefulsets', 'statefulsets/scale', '*'])) ||
            (rule.apiGroups.exists(group, group in ['batch', '*']) &&
             rule.resources.exists(resource, resource in ['cronjobs', 'jobs', '*'])) ||
            (rule.apiGroups.exists(group, group in ['jobset.x-k8s.io', '*']) &&
             rule.resources.exists(resource, resource in ['jobsets', '*'])))))
    - name: newPrivilegedBinding
      expression: >-
        variables.isBinding &&
        ((object.roleRef.kind == 'ClusterRole' && object.roleRef.name in {{ .Values.privilegedCapabilityClusterRoles | toJson }}) ||
         (object.roleRef.kind == 'Role' && (request.namespace + '/' + object.roleRef.name) in {{ .Values.privilegedCapabilityRoles | toJson }}))
    - name: noExtras
      expression: "!has(request.userInfo.extra) || request.userInfo.extra.size() == 0"
    - name: repair
      expression: >-
        ((request.userInfo.username == {{ .Values.custodianUsername | quote }} &&
          request.userInfo.groups.size() == {{ len .Values.custodianGroups }} &&
          request.userInfo.groups.all(group, group in {{ .Values.custodianGroups | toJson }})) ||
         (request.userInfo.username == {{ .Values.recoveryUsername | quote }} &&
          request.userInfo.groups.size() == {{ len .Values.recoveryGroups }} &&
          request.userInfo.groups.all(group, group in {{ .Values.recoveryGroups | toJson }}))) &&
        variables.noExtras
  validations:
    - expression: >-
        variables.repair ||
        variables.newIdentityMintRules.all(rule,
          variables.oldIdentityMintRules.exists(prior, prior == rule))
      message: "new or expanded identity, Secret read, workload mutation, exec, escalation, signer, token, or credential grants require external repair custody"
      reason: Forbidden
    - expression: >-
        variables.repair || !variables.newPrivilegedBinding ||
        (request.operation == 'UPDATE' &&
         object.roleRef == oldObject.roleRef &&
         ((!has(object.subjects) && !has(oldObject.subjects)) ||
          (has(object.subjects) && has(oldObject.subjects) && object.subjects == oldObject.subjects)))
      message: "new principals or bindings to receipt-enumerated privileged roles require external repair custody"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-model-network-impersonation-guard-binding
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-custody
  annotations:
    fs2-serve.nebius.ai/custody-provider: nebius-iam
spec:
  policyName: fs2-model-network-impersonation-guard
  validationActions: [Deny]
  matchResources:
    matchPolicy: Equivalent
