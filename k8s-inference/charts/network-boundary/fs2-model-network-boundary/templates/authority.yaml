apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: fs2-model-network-transition
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    fs2-serve.nebius.ai/network-transition-writer: {{ .Values.transitionWriterUsername | quote }}
spec:
  holderIdentity: ""
  leaseDurationSeconds: 1
  leaseTransitions: 0
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: fs2-model-network-maintenance
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    fs2-serve.nebius.ai/network-transition-writer: {{ .Values.maintenanceWriterUsername | quote }}
spec:
  holderIdentity: ""
  leaseDurationSeconds: 1
  leaseTransitions: 0
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certificate.bootstrapIssuerName }}
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.caCertificateName }}
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  isCA: true
  commonName: fs2-model-network-boundary-ca
  duration: 8760h
  renewBefore: 720h
  secretName: {{ .Values.certificate.caSecretName }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ .Values.certificate.bootstrapIssuerName }}
  secretTemplate:
    labels:
      {{- include "fs2-network-boundary.labels" . | nindent 6 }}
    annotations:
      {{- include "fs2-network-boundary.annotations" . | nindent 6 }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certificate.servingIssuerName }}
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.certificate.caSecretName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fs2-model-network-boundary
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  duration: 720h
  renewBefore: 168h
  secretName: {{ .Values.certificate.secretName }}
  dnsNames:
    - fs2-model-network-boundary.{{ .Values.authorityNamespace }}.svc
    - fs2-model-network-boundary.{{ .Values.authorityNamespace }}.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ .Values.certificate.servingIssuerName }}
  secretTemplate:
    labels:
      {{- include "fs2-network-boundary.labels" . | nindent 6 }}
    annotations:
      {{- include "fs2-network-boundary.annotations" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs2-model-network-boundary
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
    fs2-serve.nebius.ai/external-custody-policy-id: {{ .Values.externalCustody.policyId | quote }}
    fs2-serve.nebius.ai/external-custody-policy-revision: {{ .Values.externalCustody.policyRevision | quote }}
    fs2-serve.nebius.ai/external-custody-policy-sha256: {{ .Values.externalCustody.policySha256 | quote }}
    fs2-serve.nebius.ai/provider-trust-root-sha256: {{ .Values.externalCustody.providerTrustRootSha256 | quote }}
    fs2-serve.nebius.ai/custody-credential-epoch: {{ .Values.externalCustody.credentialEpoch | quote }}
    fs2-serve.nebius.ai/custody-active-from: {{ .Values.externalCustody.activeFrom | quote }}
    fs2-serve.nebius.ai/custody-active-until: {{ .Values.externalCustody.activeUntil | quote }}
    fs2-serve.nebius.ai/release-inventory-sha256: {{ .Values.releaseInventory | toJson | sha256sum | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fs2-network-boundary.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fs2-network-boundary.labels" . | nindent 8 }}
        {{- include "fs2-network-boundary.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "fs2-network-boundary.annotations" . | nindent 8 }}
        fs2.nebius.ai/image-digest: {{ .Values.image.digest | quote }}
    spec:
      serviceAccountName: fs2-model-network-boundary
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fs2-network-boundary"]
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_ENABLED
              value: "true"
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_API_URL
              value: {{ .Values.kubernetesApiUrl | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_MODEL_NAMESPACE
              value: {{ .Values.modelNamespace | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_SYSTEM_NAMESPACE
              value: {{ .Values.systemNamespace | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_AUTHORITY_NAMESPACE
              value: {{ .Values.authorityNamespace | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_ACQUISITION_WRITER
              value: {{ printf "system:serviceaccount:%s:%s" .Values.systemNamespace .Values.acquisitionServiceAccountName | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_AUTHORIZER_WRITER
              value: {{ .Values.authorizerUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_DIRECT_JOB_WRITER
              value: {{ .Values.directJobWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_JOBSET_WRITER
              value: {{ required "jobsetWriterUsername must be the run-scoped JobSet controller identity" .Values.jobsetWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_MODEL_CONTROLLER_WRITER
              value: {{ .Values.modelControllerWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_TRANSITION_WRITER
              value: {{ .Values.transitionWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_MAINTENANCE_WRITER
              value: {{ .Values.maintenanceWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_CERTIFICATE_WRITER
              value: {{ .Values.certificateWriterUsername | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_AUTHORIZER_GROUPS
              value: {{ .Values.authorizerGroups | toJson | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_TRANSITION_GROUPS
              value: {{ .Values.transitionWriterGroups | toJson | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_MAINTENANCE_GROUPS
              value: {{ .Values.maintenanceWriterGroups | toJson | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_CERTIFICATE_GROUPS
              value: {{ .Values.certificateWriterGroups | toJson | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_RELEASE_INVENTORY
              value: {{ .Values.releaseInventory | toJson | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_API_TIMEOUT_SECONDS
              value: {{ .Values.apiTimeoutSeconds | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_CUSTODY_EPOCH
              value: {{ .Values.externalCustody.credentialEpoch | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_CUSTODY_ACTIVE_FROM
              value: {{ .Values.externalCustody.activeFrom | quote }}
            - name: FS2_NETWORK_BOUNDARY_ADMISSION_CUSTODY_ACTIVE_UNTIL
              value: {{ .Values.externalCustody.activeUntil | quote }}
          volumeMounts:
            - name: kubernetes-api
              mountPath: /var/run/secrets/fs2-network-boundary
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/fs2-network-boundary-tls
              readOnly: true
          startupProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: kubernetes-api
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  expirationSeconds: {{ .Values.tokenExpirationSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
        - name: tls
          secret:
            secretName: {{ .Values.certificate.secretName }}
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "fs2-network-boundary.selectorLabels" . | nindent 18 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "fs2-network-boundary.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "fs2-network-boundary.selectorLabels" . | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fs2-model-network-boundary
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  selector:
    {{- include "fs2-network-boundary.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fs2-model-network-boundary
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "fs2-network-boundary.selectorLabels" . | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fs2-model-network-boundary
  namespace: {{ .Values.authorityNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fs2-network-boundary.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: {{ .Values.service.targetPort }}, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchExpressions:
              - {key: k8s-app, operator: In, values: [coredns, kube-dns]}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range .Values.kubernetesApiCidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {port: 443, protocol: TCP}
    {{- end }}
