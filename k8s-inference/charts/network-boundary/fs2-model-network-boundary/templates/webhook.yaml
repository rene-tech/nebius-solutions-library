{{- $releaseIdentities := list -}}
{{- range $entry := .Values.releaseInventory -}}
{{- range $operation := $entry.operations -}}
{{- $releaseIdentities = append $releaseIdentities (printf "%s|%s|%s|%s|%s" $entry.group $entry.resource $entry.namespace $entry.name $operation) -}}
{{- end -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fs2-model-network-boundary
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    fs2-serve.nebius.ai/policy-owner: independent-network-boundary
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
    # caBundle rotation is an externally custodied exact-object update. The
    # in-cluster cainjector intentionally has no VWC mutation credential.
    fs2-serve.nebius.ai/ca-bundle-custody: external-provider
webhooks:
  - name: children.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: &client
      service:
        namespace: {{ .Values.authorityNamespace }}
        name: fs2-model-network-boundary
        path: /validate
        port: {{ .Values.service.port }}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    objectSelector:
      matchExpressions:
        - key: fs2-serve.nebius.ai/network-profile
          operator: Exists
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "replicationcontrollers"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
        scope: Namespaced
      - apiGroups: ["jobset.x-k8s.io"]
        apiVersions: ["v1alpha2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobsets"]
        scope: Namespaced
  - name: models.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    rules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
        scope: Namespaced
  - name: marker.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    matchConditions:
      - name: exact-boundary-marker
        expression: "request.name == 'fs2-runtime-network-policy-boundary-v2'"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
        scope: Namespaced
  - name: helm.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels:
        owner: helm
        name: fs2-serve-control-plane
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "secrets"]
        scope: Namespaced
  - name: control-plane.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels:
        app.kubernetes.io/instance: fs2-serve-control-plane
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs", "cronjobs"]
        scope: Namespaced
      - apiGroups: ["autoscaling"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["horizontalpodautoscalers"]
        scope: Namespaced
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ingresses", "networkpolicies"]
        scope: Namespaced
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
        scope: Namespaced
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
        scope: Namespaced
  # This hook selects every exact signed release tuple regardless of the caller
  # or caller-supplied labels. The authority then requires both the exact
  # object digest and the phase-specific external identity/Lease. Release
  # identities have no cluster mutation RBAC; excluded cluster guards use the
  # provider/IAM custody path and detective live/source equality instead.
  - name: release-writers.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    matchConditions:
      - name: finite-signed-release-inventory
        expression: {{ printf "%s.exists(identity, identity == request.resource.group + '|' + request.resource.resource + '|' + request.namespace + '|' + request.name + '|' + request.operation)" ($releaseIdentities | uniq | sortAlpha | toJson) | quote }}
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  # Conversely, route every write made with one of the three release
  # credentials even when the submitted object omits all Helm/application
  # labels. The authority rejects anything absent from the signed inventory.
  - name: release-identities.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    matchConditions:
      - name: exact-release-identity
        expression: "request.userInfo.username in [{{ .Values.authorizerUsername | quote }}, {{ .Values.maintenanceWriterUsername | quote }}, {{ .Values.transitionWriterUsername | quote }}]"
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  - name: lease.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels: {fs2-serve.nebius.ai/network-boundary-object: "true"}
    matchConditions:
      - name: exact-boundary-lease
        expression: "request.name in ['fs2-model-network-transition', 'fs2-model-network-maintenance']"
    rules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["leases"]
        scope: Namespaced
