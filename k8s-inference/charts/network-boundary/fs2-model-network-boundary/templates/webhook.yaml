apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fs2-model-network-boundary
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
    fs2-serve.nebius.ai/policy-owner: independent-network-boundary
  annotations:
    {{- include "fs2-network-boundary.annotations" . | nindent 4 }}
    cert-manager.io/inject-ca-from-secret: {{ .Values.authorityNamespace }}/{{ .Values.certificate.caSecretName }}
webhooks:
  - name: children.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: &client
      service:
        namespace: {{ .Values.authorityNamespace }}
        name: fs2-model-network-boundary
        path: /validate
        port: {{ .Values.service.port }}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    objectSelector:
      matchExpressions:
        - key: fs2-serve.nebius.ai/network-profile
          operator: Exists
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
        scope: Namespaced
      - apiGroups: ["jobset.x-k8s.io"]
        apiVersions: ["v1alpha2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobsets"]
        scope: Namespaced
  - name: models.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    rules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
        scope: Namespaced
  - name: marker.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.modelNamespace }}}
    matchConditions:
      - name: exact-boundary-marker
        expression: "request.name == 'fs2-runtime-network-policy-boundary-v2'"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
        scope: Namespaced
  - name: helm.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels:
        owner: helm
        name: fs2-serve-control-plane
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "secrets"]
        scope: Namespaced
  - name: control-plane.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels:
        app.kubernetes.io/instance: fs2-serve-control-plane
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs", "cronjobs"]
        scope: Namespaced
      - apiGroups: ["autoscaling"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["horizontalpodautoscalers"]
        scope: Namespaced
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ingresses", "networkpolicies"]
        scope: Namespaced
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
        scope: Namespaced
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
        scope: Namespaced
  # These two hooks scope the otherwise broad Helm writer RBAC by authenticated
  # identity. Only the release-writer identities invoke them; the distinct
  # external recovery identity bypasses this Service and can repair authority
  # objects under the API-server-native static-custody policy.
  - name: release-writers.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    matchConditions:
      - name: exact-release-writer
        expression: "request.userInfo.username in [{{ .Values.maintenanceWriterUsername | quote }}, {{ .Values.transitionWriterUsername | quote }}]"
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  - name: release-writers-cluster.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    matchConditions:
      - name: exact-release-writer
        expression: "request.userInfo.username in [{{ .Values.maintenanceWriterUsername | quote }}, {{ .Values.transitionWriterUsername | quote }}]"
    rules:
      - apiGroups: ["admissionregistration.k8s.io", "gateway.networking.k8s.io", "rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Cluster
  - name: lease.network.fs2.nebius.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 3
    clientConfig: *client
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.systemNamespace }}}
    objectSelector:
      matchLabels: {fs2-serve.nebius.ai/network-boundary-object: "true"}
    matchConditions:
      - name: exact-boundary-lease
        expression: "request.name in ['fs2-model-network-transition', 'fs2-model-network-maintenance']"
    rules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["leases"]
        scope: Namespaced
