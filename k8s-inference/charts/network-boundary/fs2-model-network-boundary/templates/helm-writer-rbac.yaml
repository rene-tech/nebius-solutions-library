# The externally issued maintenance and rollback users are deliberately broad
# enough for the control-plane Helm release. The release-writer webhooks above
# independently reduce that authority to objects carrying the exact release
# identity, while static-custody prevents either user from editing these grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-model-network-helm-writer
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps", "autoscaling", "batch", "networking.k8s.io", "policy", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io", "external-secrets.io", "gateway.networking.k8s.io", "keda.sh", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-model-network-helm-maintenance
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.maintenanceWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-model-network-helm-rollback
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.transitionWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fs2-model-network-helm-writer
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io", "gateway.networking.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-model-network-helm-maintenance
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.maintenanceWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-model-network-helm-rollback
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.transitionWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-model-network-helm-writer
