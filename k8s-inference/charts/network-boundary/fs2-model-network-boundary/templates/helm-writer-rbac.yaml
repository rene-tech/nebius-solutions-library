# Namespaced Helm writes are admitted only when the object is present in the
# externally signed finite release inventory loaded by the boundary authority.
# The release identities have no cluster-scoped mutation permission: excluded
# admission guards and cluster RBAC are installed/repaired only by the external
# provider-custodied path. Read-only cluster access lets Helm compare retained
# prerequisites without being able to rewrite or remove them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fs2-model-network-helm-writer
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps", "autoscaling", "batch", "networking.k8s.io", "policy", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io", "external-secrets.io", "gateway.networking.k8s.io", "keda.sh", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-model-network-helm-prepare
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.authorizerUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-model-network-helm-maintenance
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.maintenanceWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fs2-model-network-helm-rollback
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.transitionWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fs2-model-network-helm-writer
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io", "gateway.networking.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-model-network-helm-maintenance
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.authorizerUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: {{ .Values.maintenanceWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-model-network-helm-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fs2-model-network-helm-rollback
  labels:
    {{- include "fs2-network-boundary.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.transitionWriterUsername | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fs2-model-network-helm-writer
