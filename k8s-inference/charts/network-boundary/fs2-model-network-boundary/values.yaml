image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2
modelNamespace: fs2-models
systemNamespace: fs2-system
authorityNamespace: fs2-network-security
authorizerUsername: fs2-model-network-authorizer
transitionWriterUsername: fs2-model-network-transition
maintenanceWriterUsername: fs2-model-network-maintenance
custodianUsername: fs2-model-network-custodian
recoveryUsername: fs2-model-network-recovery
auditorUsername: fs2-model-network-auditor
custodyTrustDomain: ""
custodianPrincipalId: ""
recoveryPrincipalId: ""
certificateWriterUsername: system:serviceaccount:cert-manager:cert-manager
custodianGroups: [fs2:model-network-custodian, system:authenticated]
recoveryGroups: [fs2:model-network-recovery, system:authenticated]
auditorGroups: [fs2:model-network-auditor, system:authenticated]
authorizerGroups: [fs2:model-network-authorizer, system:authenticated]
transitionWriterGroups: [fs2:model-network-transition, system:authenticated]
maintenanceWriterGroups: [fs2:model-network-maintenance, system:authenticated]
certificateWriterGroups: [system:serviceaccounts, system:serviceaccounts:cert-manager, system:authenticated]
acquisitionServiceAccountName: fs2-catalog-acquisition
scientificWriterServiceAccountName: fs2-scientific-job-writer
directJobWriterUsername: system:serviceaccount:fs2-system:fs2-scientific-job-writer
# Required per cluster. The workload-stage receipt must repeat this exact
# run-scoped ServiceAccount; there is intentionally no generic controller name.
jobsetWriterUsername: ""
modelControllerWriterUsername: system:serviceaccount:fs2-system:fs2-serve-control-plane-controller
transitionHolder: ""
maintenanceHolder: ""
# This list is produced by the signed RBAC census. The static API-server guard
# prevents any new binding to an already impersonation-capable role and
# prevents any role from acquiring impersonate/* after the receipt is signed.
impersonationCapableClusterRoles: [cluster-admin]
impersonationCapableRoles: []
# Installed only from an externally signed Platform-Security receipt. Each
# entry is an exact API resource/name/namespace/operation tuple. Helm release
# storage Secret names are enumerated explicitly for the one admitted revision.
releaseInventory: []
externalCustody:
  policyId: ""
  policyRevision: ""
  policySha256: ""
  providerTrustRootSha256: ""
kubernetesApiUrl: https://kubernetes.default.svc
kubernetesApiCidrs: []
apiTimeoutSeconds: "2"
tokenExpirationSeconds: 600
service:
  port: 443
  targetPort: 8443
certificate:
  secretName: fs2-model-network-boundary-tls
  caSecretName: fs2-model-network-boundary-ca
  bootstrapIssuerName: fs2-model-network-boundary-selfsigned
  caCertificateName: fs2-model-network-boundary-ca
  servingIssuerName: fs2-model-network-boundary-ca
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: fs2-model-network-boundary
            app.kubernetes.io/instance: fs2-model-network-boundary
            app.kubernetes.io/component: admission
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: fs2-model-network-boundary
        app.kubernetes.io/instance: fs2-model-network-boundary
        app.kubernetes.io/component: admission
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: fs2-model-network-boundary
        app.kubernetes.io/instance: fs2-model-network-boundary
        app.kubernetes.io/component: admission
