{{- if ne .Release.Name "fs2-nim-admission-provider-head" }}{{ fail "the provider head release name is fixed" }}{{ end }}
{{- if ne .Release.Namespace "fs2-system" }}{{ fail "the provider head namespace is fixed" }}{{ end }}
{{- if ne .Values.securityCustody "external-platform-security" }}{{ fail "the provider head requires external Platform Security custody" }}{{ end }}
{{- if ne (empty .Values.headUid) (empty .Values.headResourceVersion) }}{{ fail "provider head UID and resourceVersion CAS inputs must be supplied together" }}{{ end }}
{{- if ne (sha256sum (printf "%s\n" .Values.envelopeJson)) .Values.envelopeSha256 }}{{ fail "provider head bytes differ from their digest" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fs2-nim-admission-provider-head
  namespace: fs2-system
  annotations:
    helm.sh/resource-policy: keep
    fs2-serve.nebius.ai/head-generation: {{ .Values.generation | quote }}
    fs2-serve.nebius.ai/head-subject-sha256: {{ .Values.subjectSha256 | quote }}
    fs2-serve.nebius.ai/head-envelope-sha256: {{ .Values.envelopeSha256 | quote }}
    fs2-serve.nebius.ai/previous-head-subject-sha256: {{ .Values.previousHeadSubjectSha256 | quote }}
    {{- if .Values.headUid }}
    fs2-serve.nebius.ai/cas-precondition-uid: {{ .Values.headUid | quote }}
    fs2-serve.nebius.ai/cas-precondition-resource-version: {{ .Values.headResourceVersion | quote }}
    {{- end }}
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
    fs2-serve.nebius.ai/provider-renewal-head: "true"
data:
  envelope.json: {{ .Values.envelopeJson | quote }}
  envelope.sha256: {{ .Values.envelopeSha256 | quote }}
