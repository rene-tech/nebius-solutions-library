{{- $name := printf "fs2-nim-admission-provider-envelope-%d-%s" (.Values.generation | int) (trunc 16 .Values.subjectSha256) }}
{{- if ne .Release.Name $name }}{{ fail "each provider envelope requires its own generation-addressed release" }}{{ end }}
{{- if ne .Release.Namespace "fs2-system" }}{{ fail "the provider envelope namespace is fixed" }}{{ end }}
{{- if ne .Values.securityCustody "external-platform-security" }}{{ fail "provider envelopes require external Platform Security custody" }}{{ end }}
{{- if ne (sha256sum (printf "%s\n" .Values.envelopeJson)) .Values.envelopeSha256 }}{{ fail "provider envelope bytes differ from their digest" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: fs2-system
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
    fs2-serve.nebius.ai/provider-renewal-envelope: "true"
    fs2-serve.nebius.ai/provider-renewal-generation: {{ .Values.generation | quote }}
immutable: true
data:
  envelope.json: {{ .Values.envelopeJson | quote }}
  envelope.sha256: {{ .Values.envelopeSha256 | quote }}
