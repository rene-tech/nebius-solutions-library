              object.metadata.ownerReferences[0].apiVersion == 'apps/v1' &&
              object.metadata.ownerReferences[0].name == 'fs2-serve-control-plane-nim-admission' &&
              object.metadata.ownerReferences[0].uid == {{ .Values.derivedObjects.deploymentUid | quote }} &&
              has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller == true &&
              {{ .Values.derivedObjects.replicaSets | toJson }}.exists(rs, rs.apiVersion == object.apiVersion && rs.name == object.metadata.name && (request.operation == 'CREATE' || rs.uid == object.metadata.uid) && rs.deploymentUid == object.metadata.ownerReferences[0].uid)
            : (request.resource.group == '' && request.resource.resource == 'pods')
              ? {{ .Values.derivedObjects.enabled }} && request.userInfo.username in {{ .Values.derivedObjects.replicaSetControllerUsernames | toJson }} &&
                object.spec.serviceAccountName == 'fs2-serve-control-plane-nim-admission' &&
                object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences[0].apiVersion == 'apps/v1' &&
                object.metadata.ownerReferences[0].kind == 'ReplicaSet' &&
                has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller == true &&
                {{ .Values.derivedObjects.replicaSets | toJson }}.exists(rs, rs.apiVersion == object.metadata.ownerReferences[0].apiVersion && rs.name == object.metadata.ownerReferences[0].name && rs.uid == object.metadata.ownerReferences[0].uid && rs.deploymentUid == {{ .Values.derivedObjects.deploymentUid | quote }})
              : (request.resource.group == 'discovery.k8s.io' && request.resource.resource == 'endpointslices')
                ? {{ .Values.derivedObjects.enabled }} && request.userInfo.username in {{ .Values.derivedObjects.endpointSliceControllerUsernames | toJson }} &&
                  object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences[0].kind == 'Service' &&
                  object.metadata.ownerReferences[0].apiVersion == 'v1' &&
                  object.metadata.ownerReferences[0].name == 'fs2-serve-control-plane-nim-admission' &&
                  object.metadata.ownerReferences[0].uid == {{ .Values.derivedObjects.serviceUid | quote }} &&
                  has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller == true
                : request.userInfo.username in {{ $allowedPrincipals | toJson }})
      message: protected SAI-25 objects require the external Platform Security identity
