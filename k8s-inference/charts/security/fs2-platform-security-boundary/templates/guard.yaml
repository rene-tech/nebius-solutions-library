apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-platform-security-admission-guard
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
  annotations:
    fs2-serve.nebius.ai/provider-authorization-sha256: {{ .Values.providerAuthorizationSha256 | quote }}
    fs2-serve.nebius.ai/principal-epoch-sha256: {{ .Values.principalEpochSha256 | quote }}
spec:
  policyName: fs2-platform-security-admission-guard
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-nim-admission-apply-fence
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: coordination.k8s.io/v1
    kind: Lease
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps.nvidia.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nimcaches", "nimservices"]
  validations:
    - expression: >-
        request.operation != 'DELETE' && object != null && has(object.metadata) &&
        has(object.metadata.annotations) &&
        'fs2-serve.nebius.ai/apply-fence-nonce' in object.metadata.annotations &&
        object.metadata.annotations['fs2-serve.nebius.ai/apply-fence-nonce'] == params.spec.holderIdentity &&
        request.userInfo.username in {{ $allowedPrincipals | toJson }}
      message: NIM root mutation requires the live externally owned apply fence and epoch principal
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-nim-admission-apply-fence
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
spec:
  policyName: fs2-nim-admission-apply-fence
  validationActions: [Deny, Audit]
  paramRef:
    name: fs2-nim-admission-apply-fence
    namespace: fs2-system
    parameterNotFoundAction: Deny
