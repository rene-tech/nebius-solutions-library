{{- $name := printf "fs2-nim-admission-provider-renewal-checkpoint-%d-%s" (.Values.generation | int) (trunc 16 .Values.subjectSha256) }}
{{- if ne .Release.Name $name }}{{ fail "each provider checkpoint requires its own generation-addressed release" }}{{ end }}
{{- if ne .Release.Namespace "fs2-system" }}{{ fail "the provider checkpoint namespace is fixed" }}{{ end }}
{{- if ne .Values.securityCustody "external-platform-security" }}{{ fail "provider checkpoints require external Platform Security custody" }}{{ end }}
{{- if ne (sha256sum (printf "%s\n" .Values.checkpointJson)) .Values.checkpointSha256 }}{{ fail "provider checkpoint bytes differ from their digest" }}{{ end }}
{{- if ne (sha256sum (printf "%s\n" .Values.attestationJson)) .Values.attestationSha256 }}{{ fail "provider checkpoint attestation differs from its digest" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: fs2-system
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
    fs2-serve.nebius.ai/provider-renewal-checkpoint: "true"
    fs2-serve.nebius.ai/provider-renewal-generation: {{ .Values.generation | quote }}
immutable: true
data:
  subject.json: {{ .Values.checkpointJson | quote }}
  subject.sha256: {{ .Values.checkpointSha256 | quote }}
  attestation.json: {{ .Values.attestationJson | quote }}
  attestation.sha256: {{ .Values.attestationSha256 | quote }}
