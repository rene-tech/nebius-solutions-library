{{- if index .Values.components "scheduling" }}
# Queue-level priorities for the run class (both clusters). The GPU pool flavor and the shared `default`
# ClusterQueue are per cluster: rendered by charts/fleet. Per-tenant ClusterQueues
# (same cohort, nominal quota 0, borrowingLimit = per-tenant cap on the shared pool) come from charts/tenant.
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: customer-priority
value: 2000
description: "Work of keys with priority high (docs/API.md Priority); ordered first, may evict the two classes below."
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: customer-batch
value: 1000
description: "Customer-facing run-class work (priority normal); ordered before and may evict bulk-backfill within the queue."
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: bulk-backfill
value: 100
description: "Backfill / bulk runs; last in the queue, first to be evicted by customer-batch."
{{- end }}
