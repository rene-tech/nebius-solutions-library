{{- if index .Values.components "gateway" }}
# Cluster-wide per-key rate limit for every route on the external Gateway that does not carry its own
# BackendTrafficPolicy (the model predictor hosts, the UIs): counted per distinct Authorization header
# in the shared Redis, so it holds across Envoy replicas. Requests without an Authorization header
# (browser UIs with cookies) are not matched. The API route has its own, stricter policy
# (charts/platform/templates/api/api.yaml). If Redis is unreachable Envoy fails open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: { name: per-key-rate-limit, namespace: envoy-gateway-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: serverless2-external }
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - { name: Authorization, type: Distinct, invert: false }   # invert is a server default; explicit avoids render/default differences
          limit: { requests: 3000, unit: Minute }
{{- end }}
{{- if index .Values.components "gateway" }}
---
# Envoy Gateway translates every rate limit with disable_x_envoy_ratelimited_header: true, so a refusal by the limiter
# is not distinguishable by header from an upstream 429 (the API's own admission refusal carries
# X-Serverless2-Admission: refused; a model's 429 carries neither). This patch flips only that flag on the external
# Gateway's listeners: Envoy then adds `x-envoy-ratelimited: true` to its OWN rate-limit local replies and to nothing
# else, which is what callers key on (services/jobs/bin/call.sh edge_refusal, docs/API.md). Limits, descriptors,
# routes and the x-ratelimit-* headers are unchanged. The jsonPath selects the ratelimit filter by name (never a
# positional index); the property exists in every translated https listener, so `replace` applies. Only the https
# listener is patched: port 80 is the HTTPS redirect on every cluster and carries a ratelimit filter only where a
# limited route happens to attach (not on every cluster; Envoy Gateway rejects the whole policy when one op selects
# nothing: south, 2026-10-20). Needs extensionApis.enableEnvoyPatchPolicy on the controller.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata: { name: ratelimit-refusal-header, namespace: envoy-gateway-system }
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: serverless2-external
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: envoy-gateway-system/serverless2-external/https
      operation:
        op: replace
        jsonPath: "$.filter_chains[*].filters[*].typed_config.http_filters[?(@.name=='envoy.filters.http.ratelimit')].typed_config"
        path: "disable_x_envoy_ratelimited_header"
        value: false
{{- end }}
