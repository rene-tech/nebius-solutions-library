{{- if .Values.maintenance.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fs2-serve.fullname" . }}-maintenance
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.maintenance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            {{- include "fs2-serve.maintenanceSelectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "fs2-serve.serviceAccountName" (dict "root" . "component" "maintenance") }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              image: {{ include "fs2-serve.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["maintenance"]
              env:
                {{- include "fs2-serve.maintenanceEnv" . | nindent 16 }}
              volumeMounts:
                {{- include "fs2-serve.databaseCaVolumeMount" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            {{- include "fs2-serve.databaseCaVolume" (dict "secret" .Values.secrets.maintenanceDatabase) | nindent 12 }}
{{- end }}
