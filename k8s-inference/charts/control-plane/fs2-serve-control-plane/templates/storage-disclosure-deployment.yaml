{{- if .Values.customerStorage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs2-serve.fullname" . }}-storage-disclosure
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-disclosure
spec:
  replicas: {{ .Values.customerStorage.disclosure.replicaCount }}
  selector:
    matchLabels:
      {{- include "fs2-serve.storageDisclosureSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fs2-serve.storageDisclosureSelectorLabels" . | nindent 8 }}
      annotations:
        fs2.nebius.ai/image-digest: {{ .Values.image.digest | quote }}
    spec:
      serviceAccountName: {{ include "fs2-serve.serviceAccountName" (dict "root" . "component" "storage-disclosure") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-disclosure
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["storage-disclosure"]
          ports:
            - name: http
              containerPort: {{ .Values.customerStorage.disclosure.port }}
              protocol: TCP
          env:
            {{- include "fs2-serve.storageDisclosureDatabaseEnv" . | nindent 12 }}
            - name: FS2_USER_STORAGE_ENABLED
              value: "true"
            - name: FS2_USER_STORAGE_KEYRING_FILE
              value: /var/run/secrets/fs2-serve/customer-storage-crypto/keyring.json
            - name: FS2_TOKEN_PEPPER_FILE
              value: /var/run/secrets/fs2-serve/token-pepper/token-pepper.json
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          volumeMounts:
            {{- include "fs2-serve.storageCipherVolumeMount" . | nindent 12 }}
            {{- include "fs2-serve.databaseCaVolumeMount" . | nindent 12 }}
            - name: token-pepper
              mountPath: /var/run/secrets/fs2-serve/token-pepper
              readOnly: true
          resources:
            {{- toYaml .Values.customerStorage.disclosure.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        {{- include "fs2-serve.storageCipherVolume" . | nindent 8 }}
        {{- include "fs2-serve.databaseCaVolume" (dict "secret" (dict "name" .Values.customerStorage.disclosureDatabaseSecretName "caKey" "ca.crt")) | nindent 8 }}
        - name: token-pepper
          secret:
            secretName: {{ .Values.secrets.tokenPepper.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.tokenPepper.key }}
                path: token-pepper.json
{{- end }}
