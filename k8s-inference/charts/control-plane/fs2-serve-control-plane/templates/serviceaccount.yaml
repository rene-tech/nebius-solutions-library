{{- range $component := list "runtime" "maintenance" "migration" "bootstrap" "controller" "gpu-observer" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- $componentEnabled := and (or (ne $component "bootstrap") $.Values.bootstrapAccess.enabled) (or (ne $component "controller") $.Values.modelController.enabled) (or (ne $component "gpu-observer") $.Values.runtimeAttribution.enabled) }}
{{- if and $account.create $componentEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fs2-serve.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
