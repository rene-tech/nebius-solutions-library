{{- range $component := list "runtime" "maintenance" "migration" "bootstrap" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- if and $account.create (or (ne $component "bootstrap") $.Values.bootstrapAccess.enabled) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fs2-serve.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
