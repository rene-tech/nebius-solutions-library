{{- range $component := list "runtime" "maintenance" "migration" "bootstrap" "controller" "gpu-observer" "network-boundary" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- $componentEnabled := and (or (ne $component "bootstrap") (or $.Values.bootstrapAccess.enabled $.Values.scientificAccess.enabled)) (or (ne $component "controller") $.Values.modelController.enabled) (or (ne $component "gpu-observer") $.Values.runtimeAttribution.enabled) (or (ne $component "network-boundary") $.Values.networkBoundaryAdmission.enabled) }}
{{- if and $account.create $componentEnabled }}
{{- $accountNamespace := $.Release.Namespace }}
{{- if eq $component "gpu-observer" }}
{{- $accountNamespace = $.Values.runtimeAttribution.daemonSetNamespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fs2-serve.serviceAccountName" (dict "root" $ "component" $component) }}
  namespace: {{ $accountNamespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if .Values.runtimeAttribution.enabled }}
{{- range $namespace := .Values.runtimeAttribution.additionalDaemonSetNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fs2-serve.serviceAccountName" (dict "root" $ "component" "gpu-observer") }}
  namespace: {{ $namespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gpu-observer
automountServiceAccountToken: false
{{- end }}
{{- end }}
