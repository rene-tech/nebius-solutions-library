{{- if .Values.customerStorage.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fs2-serve.fullname" . }}-storage-egress-readiness
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-reconciler
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: [{{ printf "%s-storage-reconciler" (include "fs2-serve.fullname" .) | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fs2-serve.fullname" . }}-storage-egress-readiness
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ include "fs2-serve.serviceAccountName" (dict "root" . "component" "storage") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fs2-serve.fullname" . }}-storage-egress-readiness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs2-serve.fullname" . }}-storage-reconciler
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-reconciler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fs2-serve.storageSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fs2-serve.storageSelectorLabels" . | nindent 8 }}
      annotations:
        fs2.nebius.ai/image-digest: {{ .Values.image.digest | quote }}
        fs2.nebius.ai/secret-rollout-sha256: {{ dict "storage" .Values.secretRollout.storageGeneration | toJson | sha256sum | quote }}
        fs2.nebius.ai/storage-egress-cidrs-sha256: {{ .Values.customerStorage.egressCidrs | toJson | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "fs2-serve.serviceAccountName" (dict "root" . "component" "storage") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This verifier is part of the workload readiness boundary, not only a
        # Helm hook. Skipping hooks cannot start the cloud-credential-bearing
        # reconciler with self-asserted, stale, forged or DNS-drifted routes.
        - name: verify-storage-egress
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "fs2_serve.storage_egress_contract"]
          args:
            - --contract
            - /verify/contract.json
            - --public-key
            - /verify/public-key.pem
            - --expected-cidrs
            - /verify/cidrs.json
            - --expected-kubernetes-api-cidrs
            - /verify/kubernetes-api-cidrs.json
            - --kubernetes-network-policy
            - {{ .Release.Namespace | quote }}
            - {{ printf "%s-storage-reconciler" (include "fs2-serve.fullname" .) | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: egress-contract, mountPath: /verify/contract.json, subPath: contract.json, readOnly: true}
            - {name: egress-trust, mountPath: /verify/public-key.pem, subPath: public-key.pem, readOnly: true}
            - {name: egress-desired, mountPath: /verify/cidrs.json, subPath: cidrs.json, readOnly: true}
            - {name: egress-desired, mountPath: /verify/kubernetes-api-cidrs.json, subPath: kubernetes-api-cidrs.json, readOnly: true}
            - {name: kubernetes-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      containers:
        - name: storage-reconciler
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["storage-reconciler"]
          env:
            {{- include "fs2-serve.storageDatabaseEnv" . | nindent 12 }}
            {{- include "fs2-serve.storageCryptoEnv" . | nindent 12 }}
            - name: FS2_USER_STORAGE_ENABLED
              value: "true"
            - name: FS2_USER_STORAGE_PROJECT_ID
              value: {{ required "customerStorage.projectId is required" .Values.customerStorage.projectId | quote }}
            - name: FS2_USER_STORAGE_REGION
              value: {{ required "customerStorage.region is required" .Values.customerStorage.region | quote }}
            - name: FS2_USER_STORAGE_DEFAULT_MODE
              value: {{ .Values.customerStorage.defaultMode | quote }}
            - name: FS2_USER_STORAGE_QUOTA_BYTES
              value: {{ .Values.customerStorage.quotaBytes | int64 | quote }}
            - name: FS2_USER_STORAGE_EXCLUDED_TENANTS
              value: {{ .Values.customerStorage.excludedTenants | toJson | quote }}
            - name: FS2_USER_STORAGE_POLL_SECONDS
              value: "5"
            - name: FS2_USER_STORAGE_KEY_TTL_DAYS
              value: {{ .Values.customerStorage.keyTtlDays | quote }}
            - name: FS2_USER_STORAGE_ROTATION_WINDOW_DAYS
              value: {{ .Values.customerStorage.rotationWindowDays | quote }}
            - name: FS2_USER_STORAGE_ACTION_TIMEOUT_SECONDS
              value: {{ .Values.customerStorage.actionTimeoutSeconds | quote }}
            - name: FS2_USER_STORAGE_RESOURCE_CREDENTIALS_FILE
              value: /var/run/secrets/fs2-serve/customer-storage/resource/credentials.json
            - name: FS2_USER_STORAGE_IAM_CREDENTIALS_FILE
              value: /var/run/secrets/fs2-serve/customer-storage/iam/credentials.json
          volumeMounts:
            {{- include "fs2-serve.storageCryptoVolumeMount" . | nindent 12 }}
            {{- include "fs2-serve.databaseCaVolumeMount" . | nindent 12 }}
            - name: customer-storage-resource
              mountPath: /var/run/secrets/fs2-serve/customer-storage/resource
              readOnly: true
            - name: customer-storage-iam
              mountPath: /var/run/secrets/fs2-serve/customer-storage/iam
              readOnly: true
          resources:
            {{- toYaml .Values.customerStorage.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: egress-contract
          configMap:
            name: fs2-customer-storage-egress-contract
            items:
              - {key: contract.json, path: contract.json}
        - name: egress-trust
          secret:
            secretName: fs2-customer-storage-egress-trust
            defaultMode: 0400
            items:
              - {key: public-key.pem, path: public-key.pem}
        - name: egress-desired
          configMap:
            name: {{ include "fs2-serve.fullname" . }}-storage-egress-desired
            items:
              - {key: cidrs.json, path: cidrs.json}
              - {key: kubernetes-api-cidrs.json, path: kubernetes-api-cidrs.json}
        - name: kubernetes-api
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: kubernetes.default.svc
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
        {{- include "fs2-serve.storageCryptoVolume" . | nindent 8 }}
        {{- include "fs2-serve.databaseCaVolume" (dict "secret" (dict "name" .Values.customerStorage.databaseSecretName "caKey" "ca.crt")) | nindent 8 }}
        - name: customer-storage-resource
          secret:
            secretName: {{ .Values.customerStorage.resourceCredentialsSecretName | quote }}
            defaultMode: 0400
            items:
              - key: credentials.json
                path: credentials.json
        - name: customer-storage-iam
          secret:
            secretName: {{ .Values.customerStorage.iamCredentialsSecretName | quote }}
            defaultMode: 0400
            items:
              - key: credentials.json
                path: credentials.json
{{- end }}
