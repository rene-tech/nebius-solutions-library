{{- if .Values.adminReadAdapters.capacity.enabled }}
{{- $name := printf "%s-admin-capacity-reader" (include "fs2-serve.fullname" .) }}
{{- $serviceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "runtime") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
rules:
  # Nodes and these Kueue resources are cluster-scoped. The adapter only lists
  # them; it never reads Secrets or mutates, proxies, watches, or executes.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "resourceflavors", "cohorts"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-models
  namespace: {{ .Values.adminReadAdapters.capacity.modelNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["list"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["list"]
  {{- if .Values.modelController.enabled }}
  - apiGroups: ["inference.fs2.nebius.ai"]
    resources: ["modeldeployments"]
    verbs:
      - get
      - list
      {{- if .Values.modelController.writesEnabled }}
      - create
      - patch
      {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-models
  namespace: {{ .Values.adminReadAdapters.capacity.modelNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-models
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
{{- range $namespace := .Values.adminReadAdapters.capacity.kueueExtraNamespaces }}
{{- if eq $namespace $.Values.adminReadAdapters.capacity.modelNamespace }}
{{- fail "adminReadAdapters.capacity.kueueExtraNamespaces must not repeat modelNamespace" }}
{{- end }}
# A scientific lane contributes queue state and GPU allocation, so this grants
# list on its queues, workloads and Pods, and nothing else in that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-queues
  namespace: {{ $namespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-queues
  namespace: {{ $namespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-queues
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-system
  namespace: {{ .Values.adminReadAdapters.capacity.systemNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-system
  namespace: {{ .Values.adminReadAdapters.capacity.systemNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-system
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-cluster-autoscaler-status
  namespace: kube-system
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-cluster-autoscaler-status
  namespace: kube-system
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-cluster-autoscaler-status
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
