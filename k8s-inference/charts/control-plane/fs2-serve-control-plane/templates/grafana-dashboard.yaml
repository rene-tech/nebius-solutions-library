{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fs2-serve.fullname" . }}-dashboard
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    {{ .Values.grafanaDashboard.label }}: {{ .Values.grafanaDashboard.labelValue | quote }}
    {{- include "fs2-serve.labels" . | nindent 4 }}
data:
  fs2-serve-control-plane.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "max by (model, outcome) (rate(fs2_serve_requests_total[5m]))", "legendFormat": "{{`{{model}} / {{outcome}}`}}"}],
          "title": "Terminal request rate by model",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum by (model, state) (fs2_serve_operations)", "legendFormat": "{{`{{model}} / {{state}}`}}"}],
          "title": "Durable operations and queue depth",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [{"expr": "max by (model) (fs2_serve_oldest_queued_operation_age_seconds)", "legendFormat": "{{`{{model}}`}}"}],
          "title": "Oldest durable queue age",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, model) (rate(fs2_serve_cold_start_duration_seconds_bucket[15m])))", "legendFormat": "{{`{{model}}`}}"}],
          "title": "Cold-start p95 (durable T0 to ready)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "targets": [{"expr": "max by (model, gpu_class) (rate(fs2_serve_estimated_gpu_seconds_total[5m]))", "legendFormat": "{{`{{model}} / {{gpu_class}}`}}"}],
          "title": "Conservative GPU-seconds estimate (not measured utilization)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "targets": [{"expr": "avg by (pod) (DCGM_FI_DEV_GPU_UTIL{namespace=\"fs2-models\"})", "legendFormat": "{{`{{pod}}`}}"}],
          "title": "Measured GPU utilization (DCGM)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "postgres", "uid": {{ .Values.grafanaDashboard.reportingDatasourceUid | quote }}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 7,
          "targets": [{
            "format": "time_series",
            "rawQuery": true,
            "rawSql": "SELECT time, principal_id AS metric, sum(operations)::double precision AS value FROM fs2_reporting_principal_usage WHERE $__timeFilter(time) GROUP BY 1,2 ORDER BY 1",
            "refId": "A"
          }],
          "title": "Per-principal admitted usage (payload-free ledger)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "postgres", "uid": {{ .Values.grafanaDashboard.reportingDatasourceUid | quote }}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 8,
          "targets": [{
            "format": "table",
            "rawQuery": true,
            "rawSql": "SELECT model_id, status, sum(operations) AS operations, round(sum(estimated_gpu_seconds)::numeric,2) AS estimated_gpu_seconds FROM fs2_reporting_model_usage WHERE $__timeFilter(time) GROUP BY 1,2 ORDER BY 1,2",
            "refId": "A"
          }],
          "title": "Model outcomes and conservative accounting",
          "type": "table"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "h"}},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 24},
          "id": 9,
          "targets": [{"expr": "sum by (tenant, model, phase) (fs2_serve_lifecycle_gpu_seconds_total{tenant=~\"$tenant\",model=~\"$model\"}) / 3600", "legendFormat": "{{`{{tenant}} / {{model}} / {{phase}}`}}"}],
          "title": "Durable GPU-hours by lifecycle phase",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "h"}},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 24},
          "id": 10,
          "targets": [{"expr": "sum by (tenant, model, clock) (fs2_serve_lifecycle_clock_gpu_seconds_total{tenant=~\"$tenant\",model=~\"$model\"}) / 3600", "legendFormat": "{{`{{tenant}} / {{model}} / {{clock}}`}}"}],
          "title": "Quota, scheduler-occupied and device-allocated GPU-hours",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "h"}},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 33},
          "id": 11,
          "targets": [
            {"expr": "sum by (tenant, model) (fs2_serve_lifecycle_gpu_seconds_total{tenant=~\"$tenant\",model=~\"$model\",phase=\"active_compute\"}) / 3600", "legendFormat": "{{`{{tenant}} / {{model}} / active`}}", "refId": "A"},
            {"expr": "sum by (tenant, model) (fs2_serve_lifecycle_gpu_seconds_total{tenant=~\"$tenant\",model=~\"$model\",phase!=\"active_compute\"}) / 3600", "legendFormat": "{{`{{tenant}} / {{model}} / occupied idle`}}", "refId": "B"}
          ],
          "title": "Useful compute versus occupied idle",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 33},
          "id": 12,
          "targets": [{"expr": "sum by (tenant, model, quality, reconciled) (fs2_serve_lifecycle_workloads_total{tenant=~\"$tenant\",model=~\"$model\"})", "legendFormat": "{{`{{tenant}} / {{model}} / {{quality}} / reconciled={{reconciled}}`}}"}],
          "title": "Terminal lifecycle reconciliation state",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 42},
          "id": 13,
          "targets": [
            {"expr": "sum by (tenant, model) (fs2_serve_lifecycle_reconciliation_delta_seconds_total{tenant=~\"$tenant\",model=~\"$model\"})", "legendFormat": "{{`{{tenant}} / {{model}} / absolute delta`}}", "refId": "A"},
            {"expr": "sum by (tenant, model) (fs2_serve_lifecycle_unclassified_gpu_seconds_total{tenant=~\"$tenant\",model=~\"$model\"})", "legendFormat": "{{`{{tenant}} / {{model}} / unclassified`}}", "refId": "B"}
          ],
          "title": "Reconciliation delta and unclassified occupancy",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "postgres", "uid": {{ .Values.grafanaDashboard.reportingDatasourceUid | quote }}},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 42},
          "id": 14,
          "targets": [{
            "format": "table",
            "rawQuery": true,
            "rawSql": "SELECT accepted_at, tenant_id, model_id, model_revision, workload_kind, outcome, round((scheduler_occupied_gpu_seconds/3600.0)::numeric,4) AS occupied_gpu_hours, round(active_gpu_seconds::numeric,2) AS active_gpu_seconds, round(occupied_idle_gpu_seconds::numeric,2) AS occupied_idle_gpu_seconds, round(reconciliation_delta_seconds::numeric,3) AS reconciliation_delta_seconds, reconciled, quality, array_to_string(data_gaps, ', ') AS data_gaps FROM fs2_reporting_lifecycle_workloads WHERE $__timeFilter(accepted_at) ORDER BY accepted_at DESC LIMIT 500",
            "refId": "A"
          }],
          "title": "Durable workload reconciliation drill-down",
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["fs2-serve", "inference", "accounting"],
      "templating": {
        "list": [
          {"name": "prometheus", "type": "datasource", "query": "prometheus", "current": {}},
          {"name": "tenant", "type": "query", "datasource": {"type": "prometheus", "uid": "$prometheus"}, "query": {"query": "label_values(fs2_serve_lifecycle_gpu_seconds_total, tenant)", "refId": "tenant"}, "includeAll": true, "allValue": ".*", "current": {}},
          {"name": "model", "type": "query", "datasource": {"type": "prometheus", "uid": "$prometheus"}, "query": {"query": "label_values(fs2_serve_lifecycle_gpu_seconds_total{tenant=~\"$tenant\"}, model)", "refId": "model"}, "includeAll": true, "allValue": ".*", "current": {}}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "utc",
      "title": "fs2-serve inference gateway",
      "uid": "fs2-serve-gateway",
      "version": 2
    }
{{- end }}
