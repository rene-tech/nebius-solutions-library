{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fs2-serve.fullname" . }}-dashboard
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    {{ .Values.grafanaDashboard.label }}: {{ .Values.grafanaDashboard.labelValue | quote }}
    {{- include "fs2-serve.labels" . | nindent 4 }}
data:
  fs2-serve-control-plane.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "max by (model, outcome) (rate(fs2_serve_requests_total[5m]))", "legendFormat": "{{`{{model}} / {{outcome}}`}}"}],
          "title": "Terminal request rate by model",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum by (model, state) (fs2_serve_operations)", "legendFormat": "{{`{{model}} / {{state}}`}}"}],
          "title": "Durable operations and queue depth",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [{"expr": "max by (model) (fs2_serve_oldest_queued_operation_age_seconds)", "legendFormat": "{{`{{model}}`}}"}],
          "title": "Oldest durable queue age",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, model) (rate(fs2_serve_cold_start_duration_seconds_bucket[15m])))", "legendFormat": "{{`{{model}}`}}"}],
          "title": "Cold-start p95 (durable T0 to ready)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "targets": [{"expr": "max by (model, gpu_class) (rate(fs2_serve_estimated_gpu_seconds_total[5m]))", "legendFormat": "{{`{{model}} / {{gpu_class}}`}}"}],
          "title": "Conservative GPU-seconds estimate (not measured utilization)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "targets": [{"expr": "avg by (pod) (DCGM_FI_DEV_GPU_UTIL{namespace=\"fs2-models\"})", "legendFormat": "{{`{{pod}}`}}"}],
          "title": "Measured GPU utilization (DCGM)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "postgres", "uid": {{ .Values.grafanaDashboard.reportingDatasourceUid | quote }}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 7,
          "targets": [{
            "format": "time_series",
            "rawQuery": true,
            "rawSql": "SELECT time, principal_id AS metric, sum(operations)::double precision AS value FROM fs2_reporting_principal_usage WHERE $__timeFilter(time) GROUP BY 1,2 ORDER BY 1",
            "refId": "A"
          }],
          "title": "Per-principal admitted usage (payload-free ledger)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "postgres", "uid": {{ .Values.grafanaDashboard.reportingDatasourceUid | quote }}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 8,
          "targets": [{
            "format": "table",
            "rawQuery": true,
            "rawSql": "SELECT model_id, status, sum(operations) AS operations, round(sum(estimated_gpu_seconds)::numeric,2) AS estimated_gpu_seconds FROM fs2_reporting_model_usage WHERE $__timeFilter(time) GROUP BY 1,2 ORDER BY 1,2",
            "refId": "A"
          }],
          "title": "Model outcomes and conservative accounting",
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["fs2-serve", "inference", "accounting"],
      "templating": {
        "list": [
          {"name": "prometheus", "type": "datasource", "query": "prometheus", "current": {}}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "utc",
      "title": "fs2-serve inference gateway",
      "uid": "fs2-serve-gateway",
      "version": 1
    }
{{- end }}
