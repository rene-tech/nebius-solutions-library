{{- if .Values.publicGateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-public-tls
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.publicGateway.gatewayName }}
      sectionName: {{ .Values.publicGateway.httpsListenerName }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ .Values.edgeRateLimit.trustedHops }}
  connection:
    connectionLimit:
      value: {{ .Values.edgeConnectionLimits.connectionLimit }}
    maxConnectionDuration: {{ .Values.edgeConnectionLimits.maxConnectionDuration }}
    maxRequestsPerConnection: {{ .Values.edgeConnectionLimits.maxRequestsPerConnection }}
    maxStreamDuration: {{ .Values.edgeConnectionLimits.maxStreamDuration }}
  timeout:
    http:
      requestReceivedTimeout: {{ .Values.edgeConnectionLimits.requestReceivedTimeout }}
      idleTimeout: {{ .Values.edgeConnectionLimits.idleTimeout }}
      streamIdleTimeout: {{ .Values.edgeConnectionLimits.streamIdleTimeout }}
  http2:
    maxConcurrentStreams: {{ .Values.edgeConnectionLimits.http2MaxConcurrentStreams }}
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-public-http-limits
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.publicGateway.gatewayName }}
      sectionName: {{ .Values.publicGateway.httpListenerName }}
  connection:
    connectionLimit:
      value: {{ .Values.edgeConnectionLimits.connectionLimit }}
    maxConnectionDuration: {{ .Values.edgeConnectionLimits.maxConnectionDuration }}
    maxRequestsPerConnection: {{ .Values.edgeConnectionLimits.maxRequestsPerConnection }}
    maxStreamDuration: {{ .Values.edgeConnectionLimits.maxStreamDuration }}
  timeout:
    http:
      requestReceivedTimeout: {{ .Values.edgeConnectionLimits.requestReceivedTimeout }}
      idleTimeout: {{ .Values.edgeConnectionLimits.idleTimeout }}
      streamIdleTimeout: {{ .Values.edgeConnectionLimits.streamIdleTimeout }}
  http2:
    maxConcurrentStreams: {{ .Values.edgeConnectionLimits.http2MaxConcurrentStreams }}
{{- end }}
