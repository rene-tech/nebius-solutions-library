{{- if .Values.publicGateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-public-tls
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.publicGateway.gatewayName }}
      sectionName: {{ .Values.publicGateway.httpsListenerName }}
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
  # Derive X-Envoy-External-Address from the immediate downstream socket and
  # ignore caller-supplied X-Forwarded-For. The application accepts that value
  # only when the backend peer belongs to its explicit Envoy CIDR contract.
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 0
{{- end }}
