{{- $maintenanceServiceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "maintenance") }}
{{- $migrationServiceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "migration") }}
