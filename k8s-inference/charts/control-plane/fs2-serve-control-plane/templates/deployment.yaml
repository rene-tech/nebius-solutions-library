{{- if .Values.bootstrapAccess.enabled }}
{{- $bootstrapServiceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "bootstrap") }}
{{- if has $bootstrapServiceAccount (list $runtimeServiceAccount $maintenanceServiceAccount $migrationServiceAccount) }}
