{{- if or (ne .Values.migration.releaseContract.schema "fs2-serve.nebius.ai/postgresql-release-contract/v1") (ne .Values.migration.releaseContract.contractPayloadSha256 "e0bba052fa4b04e93a7d944444a9de155c82db6ff62ab188ad28af6db6b62cfc") (ne .Values.migration.releaseContract.migrationSetSha256 "97d71b58d235015eb5e58901caa696f8e09c863682d5c3c48a3874bfec2520d7") (ne (int .Values.migration.releaseContract.migrationCount) 19) (ne .Values.migration.releaseContract.firstMigrationVersion "0001_initial.sql") (ne .Values.migration.releaseContract.lastMigrationVersion "0019_scientific_deployment_authorization.sql") (ne .Values.migration.releaseContract.namespaceRoleOwnershipSha256 "47397ccc7c42612a11c568101f67ccd7a3446899b2ede5af3bf3bd926aa111ca") }}
{{- fail "migration release receipt inputs must match the canonical PostgreSQL contract" }}
