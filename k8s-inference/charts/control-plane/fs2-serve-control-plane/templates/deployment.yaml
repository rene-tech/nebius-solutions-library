{{- end }}
{{- if and (or .Values.adminReadAdapters.capacity.enabled .Values.adminReadAdapters.observability.enabled) (not .Values.networkPolicy.enabled) }}
{{- fail "adminReadAdapters require networkPolicy.enabled=true" }}
{{- end }}
{{- if and .Values.adminReadAdapters.capacity.enabled (eq (len .Values.networkPolicy.kubernetesApiCidrs) 0) }}
{{- fail "adminReadAdapters.capacity requires at least one bounded networkPolicy.kubernetesApiCidrs destination" }}
{{- end }}
{{- if and .Values.adminReadAdapters.capacity.nodeScalerProvider (not .Values.adminReadAdapters.capacity.enabled) }}
{{- fail "adminReadAdapters.capacity.nodeScalerProvider requires the capacity adapter" }}
{{- end }}
{{- if and .Values.adminReadAdapters.capacity.nodeScalerProvider (not .Values.adminConfiguration.enabled) }}
{{- fail "adminReadAdapters.capacity.nodeScalerProvider requires the exact adminConfiguration pool contract" }}
{{- end }}
{{- if and .Values.modelController.writesEnabled (not .Values.adminReadAdapters.capacity.enabled) }}
{{- fail "modelController.writesEnabled requires adminReadAdapters.capacity for the runtime Kubernetes credential" }}
{{- end }}
{{- if and .Values.scientificBatch.enabled (not .Values.scientificBatch.writesEnabled) }}
{{- fail "scientificBatch.enabled requires its independent writesEnabled gate" }}
{{- end }}
{{- if and .Values.scientificBatch.writesEnabled (not .Values.scientificBatch.enabled) }}
{{- fail "scientificBatch.writesEnabled requires scientificBatch.enabled" }}
{{- end }}
{{- if .Values.scientificBatch.enabled }}
{{- if not .Values.scientificArtifacts.enabled }}
{{- fail "scientificBatch requires scientificArtifacts.enabled" }}
{{- end }}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" .Values.scientificBatch.schedulingContractConfigMapName)) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" .Values.scientificBatch.executionMapConfigMapName)) }}
{{- fail "scientificBatch requires immutable scheduling-contract and execution-map ConfigMaps" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" .Values.scientificBatch.schedulingContractSha256) }}
{{- fail "scientificBatch requires the exact Terraform scheduling-contract raw-byte SHA-256" }}
{{- end }}
{{- if ne .Values.scientificBatch.schedulingContractNamespace .Release.Namespace }}
{{- fail "scientificBatch scheduling-contract ConfigMap must be in the control-plane release namespace" }}
{{- end }}
{{- if ne .Values.scientificBatch.schedulingContractSchema "fs2-serve.nebius.ai/kueue-scheduling/v1" }}
{{- fail "scientificBatch requires the canonical Terraform scheduling-contract schema" }}
{{- end }}
{{- if eq (len .Values.scientificBatch.executionMap.models) 0 }}
{{- fail "scientificBatch requires a generated schema-v3 execution map" }}
{{- end }}
{{- $academicAssets := .Values.academicAssets }}
{{- $academicModels := 0 }}
{{- range $model := .Values.scientificBatch.executionMap.models }}
{{- if eq $model.access_profile "academic" }}
{{- $academicModels = add1 $academicModels }}
{{- if not (and $academicAssets.enabled $academicAssets.execution.enabled) }}
{{- fail "academic scientific models require the academic execution contract" }}
{{- end }}
{{- if or (ne $model.workload_namespace $academicAssets.namespace) (ne $model.workload_namespace $academicAssets.execution.namespace) }}
{{- fail "academic scientific workload namespace must equal the licensed PVC namespace" }}
{{- end }}
{{- $privateMounts := 0 }}
{{- range $stage := $model.stages }}
{{- if ne $stage.service_account_name $academicAssets.execution.serviceAccount }}
{{- fail "academic scientific stage ServiceAccount differs from the Terraform handoff" }}
{{- end }}
{{- range $mount := $stage.mounts }}
{{- if eq $mount.kind "private" }}
{{- $privateMounts = add1 $privateMounts }}
{{- if ne $mount.claim_name $academicAssets.claim }}
{{- fail "academic scientific private mount claim differs from the Terraform handoff" }}
{{- end }}
{{- $bindingMatches := 0 }}
{{- range $binding := $academicAssets.runtimeBindings }}
{{- if and (eq $binding.modelId $model.model_id) (eq $binding.sourceSubPath $mount.sub_path) (eq $binding.consumerPath $mount.mount_path) }}
{{- $bindingMatches = add1 $bindingMatches }}
{{- if or (not $binding.contentDigestSha256) (not $binding.sizeBytes) (not $binding.sourceArtifact) }}
{{- fail "academic scientific runtime binding lacks its full content/source identity" }}
{{- end }}
{{- if and (eq $binding.contentIdentityKind "tree-manifest") (not $binding.contentManifestAlgorithm) }}
{{- fail "academic scientific runtime tree binding lacks its manifest algorithm" }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $bindingMatches 1 }}
{{- fail "academic scientific private mount must match exactly one Terraform runtime binding" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $privateMounts 0 }}
{{- fail "academic scientific model has no tenant-private runtime binding" }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt $academicModels 0 }}
{{- if or (not (regexMatch "^[a-f0-9]{64}$" ($academicAssets.readinessManifestSha256 | default ""))) (not $academicAssets.tenantId) (not $academicAssets.execution.localQueue) (not $academicAssets.execution.clusterQueue) (not $academicAssets.execution.referenceDataLocalQueue) (not $academicAssets.execution.referenceDataClusterQueue) }}
{{- fail "academic scientific execution requires the exact Terraform readiness, tenant, GPU queue, and reference-data queue handoff" }}
{{- end }}
{{- end }}
{{- if or (not .Values.networkPolicy.enabled) (eq (len .Values.networkPolicy.kubernetesApiCidrs) 0) }}
{{- fail "scientificBatch requires bounded Kubernetes API egress" }}
{{- end }}
{{- end }}
{{- if or (lt (.Values.adminReadAdapters.adapterTimeoutSeconds | float64) 0.1) (gt (.Values.adminReadAdapters.adapterTimeoutSeconds | float64) 10.0) }}
{{- fail "adminReadAdapters.adapterTimeoutSeconds must be between 0.1 and 10 seconds" }}
{{- end }}
{{- if or (lt (.Values.adminReadAdapters.sourceMaxAgeSeconds | float64) 1.0) (gt (.Values.adminReadAdapters.sourceMaxAgeSeconds | float64) 3600.0) }}
{{- fail "adminReadAdapters.sourceMaxAgeSeconds must be between 1 and 3600 seconds" }}
{{- end }}
{{- if or (lt (.Values.adminReadAdapters.kubernetesCacheTtlSeconds | float64) 1.0) (gt (.Values.adminReadAdapters.kubernetesCacheTtlSeconds | float64) 60.0) }}
{{- fail "adminReadAdapters.kubernetesCacheTtlSeconds must be between 1 and 60 seconds" }}
{{- end }}
{{- $context := .Values.adminReadAdapters.context }}
{{- $contextParts := list $context.project $context.cluster $context.region }}
{{- $contextConfigured := 0 }}
{{- range $contextParts }}{{- if . }}{{- $contextConfigured = add1 $contextConfigured }}{{- end }}{{- end }}
{{- if and (gt $contextConfigured 0) (lt $contextConfigured 3) }}
{{- fail "adminReadAdapters.context project, cluster, and region must be configured together" }}
{{- end }}
{{- if and $context.label (ne $contextConfigured 3) }}
{{- fail "adminReadAdapters.context.label requires a complete context identity" }}
{{- end }}
{{- range .Values.networkPolicy.kubernetesApiCidrs }}
{{- if not (regexMatch "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2])|[0-9A-Fa-f:]+/([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$" .) }}
{{- fail "networkPolicy.kubernetesApiCidrs accepts only bounded IPv4 or IPv6 CIDRs and rejects default routes" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs2-serve.fullname" . }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fs2-serve.runtimeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fs2-serve.runtimeSelectorLabels" . | nindent 8 }}
      annotations:
        fs2.nebius.ai/image-digest: {{ .Values.image.digest | quote }}
        fs2.nebius.ai/catalog-rollout-digest: {{ .Values.catalog.rolloutDigest | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fs2-serve.serviceAccountName" (dict "root" . "component" "runtime") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ add (.Values.config.shutdownGraceSeconds | int) 10 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-schema
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["wait-schema"]
          env:
            {{- include "fs2-serve.schemaWaitEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "fs2-serve.databaseCaVolumeMount" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: control-plane
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "fs2-serve.runtimeEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "fs2-serve.runtimeVolumeMounts" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        {{- include "fs2-serve.runtimeVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
