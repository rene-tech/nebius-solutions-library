{{- if and .Values.academicAssets.enabled .Values.academicAssets.execution.enabled }}
{{- /*
  Executable template for an academic scientific Job.

  A PersistentVolumeClaim is mountable only by pods in its own namespace, so this
  renders into the namespace that holds the claim. Publishing a namespace in a
  ConfigMap was not enough: nothing consumed it, and a Job in the default model
  namespace could never have mounted the volume.

  Runtimes read the licensed bytes through the asset group, never as the staging
  user and never world-readable.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fs2-serve.fullname" . }}-academic-execution
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
data:
  execution_namespace: {{ .Values.academicAssets.execution.namespace | quote }}
  claim_namespace: {{ .Values.academicAssets.namespace | quote }}
  cross_namespace_mount: "false"
  local_queue: {{ .Values.academicAssets.execution.localQueue | quote }}
  service_account: {{ .Values.academicAssets.execution.serviceAccount | quote }}
  job_template: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      namespace: {{ .Values.academicAssets.execution.namespace }}
      labels:
        app.kubernetes.io/part-of: fs2-serve
        kueue.x-k8s.io/queue-name: {{ .Values.academicAssets.execution.localQueue }}
    spec:
      template:
        spec:
          serviceAccountName: {{ .Values.academicAssets.execution.serviceAccount }}
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            supplementalGroups: [{{ .Values.academicAssets.assetGid }}]
          volumes:
            - name: academic-assets
              persistentVolumeClaim:
                claimName: {{ .Values.academicAssets.claim }}
                readOnly: true
          containers:
            - name: scientific
              volumeMounts:
              {{- range $key, $binding := .Values.academicAssets.runtimeBindings }}
                - name: academic-assets
                  mountPath: {{ $binding.consumerPath }}
                  subPath: {{ $binding.sourceSubPath }}
                  readOnly: true
              {{- end }}
{{- end }}
