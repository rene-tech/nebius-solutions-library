{{- if .Values.networkPolicy.enabled }}
{{- $network := .Values.networkPolicy }}
{{- $webhookSourceCidrs := $network.envoyController.webhookSourceCidrs }}
{{- if and .Values.publicGateway.enabled (eq (len $webhookSourceCidrs) 0) }}
{{- fail "publicGateway requires nonempty networkPolicy.envoyController.webhookSourceCidrs from exact Kubernetes API endpoint host routes" }}
{{- end }}
{{- range $webhookSourceCidrs }}
{{- if not (regexMatch "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/32|[0-9A-Fa-f:]+/128)$" .) }}
{{- fail "networkPolicy.envoyController.webhookSourceCidrs accepts only exact IPv4 /32 or IPv6 /128 Kubernetes API endpoint hosts" }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-runtime
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      {{- include "fs2-serve.runtimeSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.scientificBatch.enabled }}
    - from:
        {{- range $workloadNamespace := (include "fs2-serve.scientificWorkloadNamespaces" . | fromJsonArray) }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $workloadNamespace }}
          podSelector:
            matchExpressions:
              - key: fs2.nebius.ai/workload-id
                operator: Exists
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.gateway.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.gateway.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.metrics.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.metrics.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.dns.port }}
          protocol: UDP
        - port: {{ $network.dns.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.database.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.database.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.database.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.runtime.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.runtime.podLabels | nindent 14 }}
      ports:
        {{- range $network.runtime.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.otlp.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.otlp.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.otlp.port }}
          protocol: TCP
    {{- if .Values.adminReadAdapters.observability.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.prometheus.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.prometheus.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.prometheus.port }}
          protocol: TCP
    {{- if .Values.adminReadAdapters.observability.lokiUrl }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.loki.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.loki.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.loki.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- if or .Values.adminReadAdapters.capacity.enabled .Values.scientificBatch.enabled }}
    - to:
        {{- range $network.kubernetesApiCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- if $network.federationCidrs }}
    - to:
        {{- range $network.federationCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $network.federationPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if and .Values.scientificArtifacts.enabled .Values.scientificArtifacts.egressCidrs }}
    # Scientific artifact object storage. Handles are presigned locally, but
    # finalize streams the stored object back to verify its digest.
    - to:
        {{- range .Values.scientificArtifacts.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- if .Values.scientificBatch.enabled }}
{{- $root := . }}
{{- range $workloadNamespace := (include "fs2-serve.scientificWorkloadNamespaces" $root | fromJsonArray) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" $root }}-scientific-workloads
  namespace: {{ $workloadNamespace }}
  labels:
    {{- include "fs2-serve.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: fs2.nebius.ai/workload-id
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.dns.port }}
          protocol: UDP
        - port: {{ $network.dns.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fs2-serve.runtimeSelectorLabels" $root | nindent 14 }}
      ports:
        - port: {{ $root.Values.service.port }}
          protocol: TCP
    {{- if $root.Values.scientificArtifacts.egressCidrs }}
    - to:
        {{- range $root.Values.scientificArtifacts.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.publicGateway.enabled }}
{{- $gatewayNamespace := required "networkPolicy.gateway.namespaceLabels must include kubernetes.io/metadata.name" (index $network.gateway.namespaceLabels "kubernetes.io/metadata.name") }}
{{- $envoyControllerNamespace := required "networkPolicy.envoyController.namespaceLabels must include kubernetes.io/metadata.name" (index $network.envoyController.namespaceLabels "kubernetes.io/metadata.name") }}
{{- $root := . }}
{{- $publicEnvoyPolicies := list (dict "name" (printf "%s-public-envoy" (include "fs2-serve.fullname" .)) "component" "public-edge" "guard" false) }}
{{- if $network.transition.renderGuards }}
{{- $publicEnvoyPolicies = append $publicEnvoyPolicies (dict "name" (printf "%s-public-envoy-transition-guard" (include "fs2-serve.fullname" .)) "component" "public-edge-transition-guard" "guard" true) }}
{{- end }}
{{- range $policy := $publicEnvoyPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $policy.name }}
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "fs2-serve.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $policy.component }}
    {{- if $policy.guard }}
    fs2.nebius.ai/network-policy-transition: guard
    fs2.nebius.ai/network-policy-role: public-envoy
    {{- end }}
  {{- if $policy.guard }}
  annotations:
    fs2.nebius.ai/normal-policy-name: {{ include "fs2-serve.fullname" $root }}-public-envoy
    fs2.nebius.ai/deny-policy-name: {{ include "fs2-serve.fullname" $root }}-envoy-default-deny
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $network.gateway.podLabels | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range $network.publicListenerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.metrics.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.metrics.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.envoyController.metricsPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.dns.port }}
          protocol: UDP
        - port: {{ $network.dns.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fs2-serve.runtimeSelectorLabels" $root | nindent 14 }}
      ports:
        - port: {{ $root.Values.service.port }}
          protocol: TCP
    {{- if $root.Values.adminConsole.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fs2-serve.adminConsoleSelectorLabels" $root | nindent 14 }}
      ports:
        - port: {{ $root.Values.adminConsole.service.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.solver.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.solver.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.solver.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.envoyController.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.envoyController.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.envoyController.port }}
          protocol: TCP
    {{- range $network.gatewayBackends }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
{{- end }}
{{- $controllerPolicies := list (dict "name" (printf "%s-envoy-controller-xds" (include "fs2-serve.fullname" .)) "component" "envoy-controller-xds" "guard" false) }}
{{- if $network.transition.renderGuards }}
{{- $controllerPolicies = append $controllerPolicies (dict "name" (printf "%s-envoy-controller-xds-transition-guard" (include "fs2-serve.fullname" .)) "component" "envoy-controller-xds-transition-guard" "guard" true) }}
{{- end }}
{{- range $policy := $controllerPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $policy.name }}
  namespace: {{ $envoyControllerNamespace }}
  labels:
    {{- include "fs2-serve.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $policy.component }}
    {{- if $policy.guard }}
    fs2.nebius.ai/network-policy-transition: guard
    fs2.nebius.ai/network-policy-role: envoy-controller
    {{- end }}
  {{- if $policy.guard }}
  annotations:
    fs2.nebius.ai/normal-policy-name: {{ include "fs2-serve.fullname" $root }}-envoy-controller-xds
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $network.envoyController.podLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.gateway.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.gateway.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.envoyController.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.metrics.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.metrics.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.envoyController.metricsPort }}
          protocol: TCP
    {{- if gt (len $webhookSourceCidrs) 0 }}
    - from:
        {{- range $webhookSourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ $network.envoyController.webhookPort }}
          protocol: TCP
    {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-envoy-default-deny
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-acme-solver
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: acme-solver
spec:
  podSelector:
    matchLabels:
      {{- toYaml $network.solver.podLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.gateway.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.gateway.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.solver.port }}
          protocol: TCP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-maintenance
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  podSelector:
    matchLabels:
      {{- include "fs2-serve.maintenanceSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.dns.port }}
          protocol: UDP
        - port: {{ $network.dns.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.database.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.database.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.database.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-migration
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  podSelector:
    matchLabels:
      {{- include "fs2-serve.migrationSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.dns.port }}
          protocol: UDP
        - port: {{ $network.dns.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.database.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.database.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.database.port }}
          protocol: TCP
