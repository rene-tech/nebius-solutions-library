        - port: {{ $network.solver.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-envoy-controller-xds
  namespace: envoy-gateway-system
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-controller-xds
spec:
  podSelector:
    matchLabels:
      {{- toYaml $network.envoyController.podLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $network.gateway.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $network.gateway.podLabels | nindent 14 }}
      ports:
        - port: {{ $network.envoyController.port }}
          protocol: TCP
{{- end }}
