{{- if .Values.academicAssets.enabled }}
{{- /*
  Machine-readable delivery contract for licensed academic assets.

  A model runtime pod reads this to learn which tenant-private claim to mount,
  where to mount it, and which supplemental group grants read access. The
  licensed bytes themselves are never in this ConfigMap, never in an image, and
  never in a general shared cache.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fs2-serve.fullname" . }}-academic-assets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
data:
  delivery_mode: "tenant-private-volume"
  namespace: {{ .Values.academicAssets.namespace | quote }}
  claim: {{ .Values.academicAssets.claim | quote }}
  mount_root: {{ .Values.academicAssets.mountRoot | quote }}
  asset_gid: {{ .Values.academicAssets.assetGid | quote }}
  consumer_access: "supplemental-group"
  read_only: {{ .Values.academicAssets.readOnly | quote }}
  embeds_licensed_bytes: "false"
  general_shared_cache: "false"
  world_readable: "false"
  # Generated from the exact bindings: each entry is a real subPath mount, which
  # could not be produced from the claim and mount root alone.
  runtime_binding_mounts: |
{{- if .Values.academicAssets.runtimeBindings }}
    volumes:
      - name: academic-assets
        persistentVolumeClaim:
          claimName: {{ .Values.academicAssets.claim }}
          readOnly: true
    volumeMounts:
  {{- range $key, $binding := .Values.academicAssets.runtimeBindings }}
      - name: academic-assets
        mountPath: {{ $binding.consumerPath }}
        subPath: {{ $binding.sourceSubPath }}
        readOnly: true
  {{- end }}
{{- else }}
    volumeMounts: []
{{- end }}
  runtime_bindings: |
{{- if .Values.academicAssets.runtimeBindings }}
  {{- range $key, $binding := .Values.academicAssets.runtimeBindings }}
    {{ $key }}:
      modelId: {{ $binding.modelId }}
      artifactId: {{ $binding.artifactId }}
      sourceSubPath: {{ $binding.sourceSubPath }}
      consumerPath: {{ $binding.consumerPath }}
      mechanism: {{ $binding.mechanism }}
      contentIdentityKind: {{ $binding.contentIdentityKind }}
      contentDigestSha256: {{ $binding.contentDigestSha256 | default "null" }}
  {{- end }}
{{- else }}
    {}
{{- end }}
  consumer_pod_contract: |
    securityContext:
      supplementalGroups: [{{ .Values.academicAssets.assetGid }}]
    volumes:
      - name: academic-assets
        persistentVolumeClaim:
          claimName: {{ .Values.academicAssets.claim }}
          readOnly: true
    volumeMounts:
      - name: academic-assets
        mountPath: {{ .Values.academicAssets.mountRoot }}
        readOnly: true
{{- end }}
