{{- if .Values.benchmarkWorkers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fs2-serve.fullname" . }}-benchmarks
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: benchmark-worker
spec:
  replicas: {{ .Values.benchmarkWorkers.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: benchmark-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: benchmark-worker
      annotations:
        fs2.nebius.ai/source-commit: {{ .Values.benchmarkWorkers.sourceCommit | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector:
        kubernetes.io/arch: amd64
        {{- with .Values.benchmarkWorkers.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.benchmarkWorkers.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: benchmark-worker
          image: {{ .Values.benchmarkWorkers.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - pool
            - --origin
            - {{ .Values.config.publicBaseUrl | quote }}
            - --directory
            - /tmp/receipts
            - --commit
            - {{ .Values.benchmarkWorkers.sourceCommit | quote }}
            - --worker
            - $(POD_NAME)
            - --token-file
            - /credentials/inference/token
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: FS2_BENCHMARK_ADMIN_TOKEN_FILE
              value: /credentials/admin/token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.benchmarkWorkers.resources | nindent 12 }}
          volumeMounts:
            - {name: receipts, mountPath: /tmp}
            - {name: inference, mountPath: /credentials/inference, readOnly: true}
            - {name: admin, mountPath: /credentials/admin, readOnly: true}
      volumes:
        - name: receipts
          emptyDir: {sizeLimit: 2Gi}
        - name: inference
          secret:
            secretName: {{ .Values.benchmarkWorkers.credentialSecret | quote }}
            items:
              - key: {{ .Values.benchmarkWorkers.credentialKey | quote }}
                path: token
        - name: admin
          secret:
            secretName: {{ .Values.secrets.admin.name | quote }}
            items:
              - key: {{ .Values.secrets.admin.key | quote }}
                path: token
{{- end }}
