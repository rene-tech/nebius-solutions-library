{{- if .Values.publicGateway.enabled }}
{{- if not .Values.edgeRateLimit.enabled }}
{{- fail "a public Gateway requires edgeRateLimit.enabled=true" }}
{{- end }}
{{- $identity := .Values.edgeClientIdentity }}
{{- if not $identity.verified }}
{{- fail "a public Gateway requires a verified edgeClientIdentity provider/LB contract" }}
{{- end }}
{{- if lt (int $identity.trustedHops) 1 }}
{{- fail "a verified edgeClientIdentity requires at least one authoritative trusted hop" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" $identity.providerContractSha256) }}
{{- fail "a verified edgeClientIdentity requires an exact provider contract SHA-256" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{64}$" $identity.evidenceReceiptSha256) }}
{{- fail "a verified edgeClientIdentity requires the reopened signed receipt SHA-256" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $identity.issuerKeyId) }}
{{- fail "a verified edgeClientIdentity requires a source-trusted issuer key ID" }}
{{- end }}
{{- if not (regexMatch "^[a-z][a-z0-9-]{7,127}$" $identity.providerLoadBalancerId) }}
{{- fail "a verified edgeClientIdentity requires the exact authenticated provider load-balancer ID" }}
{{- end }}
{{- if not $identity.directAccessExcluded }}
{{- fail "a verified edgeClientIdentity requires proof that direct access cannot forge X-Forwarded-For" }}
{{- end }}
{{- if or (lt (int $identity.perSourceConnectionLimit) 1) (gt (int $identity.perSourceConnectionLimit) 128) }}
{{- fail "a verified edgeClientIdentity requires a provider-enforced per-source connection limit from 1 through 128" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "fs2-serve.fullname" . }}-edge-limit
  annotations:
    fs2.nebius.ai/provider-load-balancer-id: {{ $identity.providerLoadBalancerId | quote }}
    fs2.nebius.ai/provider-per-source-connection-limit: {{ $identity.perSourceConnectionLimit | quote }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.publicGateway.gatewayName }}
      sectionName: {{ .Values.publicGateway.httpsListenerName }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.publicGateway.gatewayName }}
      sectionName: {{ .Values.publicGateway.httpListenerName }}
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: {{ .Values.edgeRateLimit.sourceCidr | quote }}
          limit:
            requests: {{ .Values.edgeRateLimit.requests }}
            unit: {{ .Values.edgeRateLimit.unit }}
          shared: false
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: {{ .Values.edgeRateLimit.sourceCidr | quote }}
              path:
                type: PathPrefix
                value: /admin
          limit:
            requests: {{ .Values.edgeRateLimit.adminRequests }}
            unit: {{ .Values.edgeRateLimit.adminUnit }}
          shared: false
{{- end }}
