{{- if .Values.federation.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fs2-serve.fullname" . }}-federation
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.federation.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "federation.externalSecret.secretStoreRef.name is required" .Values.federation.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.federation.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.federation.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "federation.externalSecret.remoteKey is required" .Values.federation.externalSecret.remoteKey | quote }}
{{- end }}
