{{- if .Values.runtimeAttribution.enabled }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "runtimeAttribution requires networkPolicy.enabled=true" }}
{{- end }}
{{- if ne .Values.runtimeAttribution.kubernetesApiUrl "https://kubernetes.default.svc:443" }}
{{- fail "runtimeAttribution.kubernetesApiUrl must use the exact in-cluster API service on port 443" }}
{{- end }}
{{- $name := printf "%s-gpu-observer" (include "fs2-serve.fullname" .) }}
{{- $serviceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "gpu-observer") }}
{{- $runtimeServiceAccount := include "fs2-serve.serviceAccountName" (dict "root" . "component" "runtime") }}
{{- $observerNamespace := .Values.runtimeAttribution.observerNamespace }}
{{- $observerUsername := printf "system:serviceaccount:%s:%s" $observerNamespace $serviceAccount }}
{{- $namespaces := .Values.runtimeAttribution.namespaces }}
{{- if eq (len $namespaces) 0 }}
{{- $namespaces = list .Values.runtimeAttribution.modelNamespace }}
{{- end }}
{{- $namespaces = sortAlpha (uniq $namespaces) }}
{{- range $namespace := $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "fs2-serve.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $observerNamespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-publication-writer
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-publication-writer
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-publication-writer
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $observerNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-publication-reader
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-publication-reader
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-publication-reader
subjects:
  - kind: ServiceAccount
    name: {{ $runtimeServiceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-publication-custody
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
  validations:
    - expression: >-
        request.userInfo.username != '{{ $observerUsername }}' ||
        ('authentication.kubernetes.io/node-name' in request.userInfo.extra &&
         size(request.userInfo.extra['authentication.kubernetes.io/node-name']) == 1 &&
         object.metadata.name == request.userInfo.extra['authentication.kubernetes.io/node-name'][0] &&
         object.metadata.name != 'kube-root-ca.crt' &&
         has(object.metadata.labels) &&
         object.metadata.labels['app.kubernetes.io/component'] == 'gpu-allocation-observer' &&
         object.metadata.labels['telemetry.fs2.nebius.ai/publication-schema'] == 'gpu-allocation-v2' &&
         has(object.data) && size(object.data) == 1 && 'observations.json' in object.data)
      message: The GPU observer may write only its bounded publication objects
      reason: Forbidden
    - expression: >-
        object.metadata.name == 'kube-root-ca.crt' ||
        request.userInfo.username == '{{ $observerUsername }}'
      message: Non-CA ConfigMaps in the GPU observer namespace are owned exclusively by the observer ServiceAccount
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ $observerUsername }}' ||
        (has(object.metadata.annotations) &&
         'authentication.kubernetes.io/node-name' in request.userInfo.extra &&
         'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
         'authentication.kubernetes.io/pod-uid' in request.userInfo.extra &&
         size(request.userInfo.extra['authentication.kubernetes.io/node-name']) == 1 &&
         size(request.userInfo.extra['authentication.kubernetes.io/pod-name']) == 1 &&
         size(request.userInfo.extra['authentication.kubernetes.io/pod-uid']) == 1 &&
         object.metadata.annotations['telemetry.fs2.nebius.ai/node-name'] ==
           request.userInfo.extra['authentication.kubernetes.io/node-name'][0] &&
         object.metadata.annotations['telemetry.fs2.nebius.ai/observer-pod-name'] ==
           request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] &&
         object.metadata.annotations['telemetry.fs2.nebius.ai/observer-pod-uid'] ==
           request.userInfo.extra['authentication.kubernetes.io/pod-uid'][0] &&
         'telemetry.fs2.nebius.ai/published-at' in object.metadata.annotations &&
         'telemetry.fs2.nebius.ai/expires-at' in object.metadata.annotations &&
         has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) == 1 &&
         object.metadata.ownerReferences[0].apiVersion == 'v1' &&
         object.metadata.ownerReferences[0].kind == 'Pod' &&
         object.metadata.ownerReferences[0].name ==
           request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] &&
         string(object.metadata.ownerReferences[0].uid) ==
           request.userInfo.extra['authentication.kubernetes.io/pod-uid'][0] &&
         object.metadata.ownerReferences[0].controller == false &&
         object.metadata.ownerReferences[0].blockOwnerDeletion == false)
      message: GPU allocation publication custody must match the bound observer Pod and node
      reason: Forbidden
    - expression: >-
        oldObject == null ||
        object.metadata.name == 'kube-root-ca.crt' ||
        (oldObject.metadata.annotations['telemetry.fs2.nebius.ai/node-name'] ==
           object.metadata.annotations['telemetry.fs2.nebius.ai/node-name'])
      message: GPU allocation publication node custody is immutable
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-publication-custody
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  policyName: {{ $name }}-publication-custody
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $observerNamespace }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $name }}-publication-bound
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  hard:
    count/configmaps: {{ add .Values.runtimeAttribution.maxPublications 1 | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  selector:
    matchLabels:
      {{- include "fs2-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpu-allocation-observer
  template:
    metadata:
      labels:
        {{- include "fs2-serve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gpu-allocation-observer
      annotations:
        fs2.nebius.ai/image-digest: {{ .Values.image.digest | quote }}
    spec:
      serviceAccountName: {{ $serviceAccount }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: observer
          image: {{ include "fs2-serve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gpu-allocation-observer"]
          env:
            - name: FS2_GPU_ALLOCATION_OBSERVER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FS2_GPU_ALLOCATION_OBSERVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FS2_GPU_ALLOCATION_OBSERVER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: FS2_GPU_ALLOCATION_OBSERVER_NAMESPACES
              value: {{ toJson $namespaces | quote }}
            - name: FS2_GPU_ALLOCATION_OBSERVER_PUBLICATION_NAMESPACE
              value: {{ $observerNamespace | quote }}
            - name: FS2_GPU_ALLOCATION_OBSERVER_API_URL
              value: {{ .Values.runtimeAttribution.kubernetesApiUrl | quote }}
            - name: FS2_GPU_ALLOCATION_OBSERVER_TOKEN_FILE
              value: /var/run/secrets/fs2-serve/gpu-observer/token
            - name: FS2_GPU_ALLOCATION_OBSERVER_CA_FILE
              value: /var/run/secrets/fs2-serve/gpu-observer/ca.crt
            - name: FS2_GPU_ALLOCATION_OBSERVER_CHECKPOINT_FILE
              value: {{ .Values.runtimeAttribution.checkpointHostPath | quote }}
            - name: FS2_GPU_ALLOCATION_OBSERVER_POLL_SECONDS
              value: {{ .Values.runtimeAttribution.pollSeconds | quote }}
            - name: FS2_GPU_ALLOCATION_OBSERVER_PUBLICATION_TTL_SECONDS
              value: {{ .Values.runtimeAttribution.publicationTtlSeconds | quote }}
          volumeMounts:
            - name: kubelet-device-checkpoint
              mountPath: {{ .Values.runtimeAttribution.checkpointHostPath | quote }}
              readOnly: true
            - name: kubernetes-token
              mountPath: /var/run/secrets/fs2-serve/gpu-observer
              readOnly: true
          resources:
            {{- toYaml .Values.runtimeAttribution.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: kubelet-device-checkpoint
          hostPath:
            path: {{ .Values.runtimeAttribution.checkpointHostPath | quote }}
            type: File
        - name: kubernetes-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  expirationSeconds: {{ .Values.runtimeAttribution.tokenExpirationSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      {{- with .Values.runtimeAttribution.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeAttribution.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  podSelector:
    matchLabels:
      {{- include "fs2-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpu-allocation-observer
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.dns.port }}
          protocol: UDP
        - port: {{ .Values.networkPolicy.dns.port }}
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-apiserver
  namespace: {{ $observerNamespace }}
  labels:
    {{- include "fs2-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-allocation-observer
spec:
  endpointSelector:
    matchLabels:
      {{- include "fs2-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpu-allocation-observer
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
