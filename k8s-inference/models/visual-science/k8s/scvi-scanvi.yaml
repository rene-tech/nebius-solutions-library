# The service trains a bounded model per request. The platform controller owns replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scvi-scanvi
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: scvi-scanvi
    app.kubernetes.io/part-of: fs2-serve
    fs2-serve.nebius.ai/model-id: scvi-scanvi
spec:
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scvi-scanvi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scvi-scanvi
        fs2-serve.nebius.ai/model-id: scvi-scanvi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        accelerator.fs2.nebius/class: nvidia-h100-sxm5-80gb
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: runtime
          image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/visual-science/scvi-scanvi@sha256:cd22562eb59d067f734b65af1669c483f971dacb5e58462ca7f4d43afc940396
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "6"
              memory: 32Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 96Gi
              ephemeral-storage: 128Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scvi-scanvi
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: scvi-scanvi
    fs2-serve.nebius.ai/model-id: scvi-scanvi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scvi-scanvi
  ports:
    - name: http
      port: 8000
      targetPort: http
