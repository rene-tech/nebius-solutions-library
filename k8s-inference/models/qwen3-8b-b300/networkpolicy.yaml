apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen3-8b-b300
  namespace: fs2-models
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: qwen3-8b-b300
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fs2-models
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fs2-system
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
