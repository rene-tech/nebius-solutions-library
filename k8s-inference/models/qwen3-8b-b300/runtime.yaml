apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3-8b-b300
  namespace: fs2-models
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/instance: qwen3-8b-b300
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/version: b968826d9c46dd6066d109eabc6255188de91218
  annotations:
    fs2.nebius/model-revision: b968826d9c46dd6066d109eabc6255188de91218
    fs2.nebius/runtime-image-digest: sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
    fs2.nebius/quantization: none
    fs2.nebius/task: fs2-serve-qwen-b300-vertical-slice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 2400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: qwen3-8b-b300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-8b
        app.kubernetes.io/instance: qwen3-8b-b300
        app.kubernetes.io/component: model-runtime
        app.kubernetes.io/part-of: fs2-serve
        app.kubernetes.io/version: b968826d9c46dd6066d109eabc6255188de91218
      annotations:
        fs2.nebius/model-revision: b968826d9c46dd6066d109eabc6255188de91218
        fs2.nebius/runtime-image-digest: sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
        fs2.nebius/quantization: none
    spec:
      serviceAccountName: qwen3-8b-b300
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        capacity.fs2.nebius/pool: burst
        capacity.fs2.nebius/preset: b300-8x
        capacity.fs2.nebius/type: preemptible
        kubernetes.io/arch: amd64
        nebius.com/gpu-name: B300
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      initContainers:
        - name: localize-model
          image: registry.example.invalid/k8s-inference/models/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /contract/localize.py
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: MODEL_DIR
              value: /models/qwen3-8b
            - name: MODEL_LOCK_PATH
              value: /contract/model.lock.json
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 32Gi
            limits:
              cpu: "16"
              memory: 32Gi
              ephemeral-storage: 96Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: model
              mountPath: /models
      containers:
        - name: vllm
          image: registry.example.invalid/k8s-inference/models/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
          imagePullPolicy: IfNotPresent
          args:
            - /models/qwen3-8b
            - --served-model-name
            - Qwen/Qwen3-8B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --tensor-parallel-size
            - "1"
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.80"
            - --generation-config
            - vllm
            - --enable-prefix-caching
          env:
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HOME
              value: /runtime-cache/home
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /runtime-cache/torchinductor
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TRITON_CACHE_DIR
              value: /runtime-cache/triton
            - name: VLLM_CACHE_ROOT
              value: /runtime-cache/vllm
            - name: VLLM_NO_USAGE_STATS
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "24"
              memory: 160Gi
              ephemeral-storage: 32Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: runtime-cache
              mountPath: /runtime-cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: contract
          configMap:
            name: qwen3-8b-b300-contract
            defaultMode: 0444
        - name: model
          emptyDir:
            sizeLimit: 64Gi
        - name: runtime-cache
          emptyDir:
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/instance: qwen3-8b-b300
    app.kubernetes.io/part-of: fs2-serve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: qwen3-8b-b300
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
