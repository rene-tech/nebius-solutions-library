{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "magpie-tts-multilingual-357m",
        "namespace": "fs2-models",
        "labels": {
          "app.kubernetes.io/name": "magpie-tts-multilingual-357m",
          "app.kubernetes.io/part-of": "fs2-serve",
          "app.kubernetes.io/component": "model-runtime",
          "fs2-serve.nebius.ai/model-id": "magpie-tts-multilingual-357m",
          "workload.fs2.nebius/owner": "voice-agent-20260916",
          "fs2.voice/model": "magpie-tts-multilingual-357m"
        }
      },
      "spec": {
        "replicas": 0,
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxUnavailable": 0,
            "maxSurge": 1
          }
        },
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "magpie-tts-multilingual-357m"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "magpie-tts-multilingual-357m",
              "app.kubernetes.io/part-of": "fs2-serve",
              "app.kubernetes.io/component": "model-runtime",
              "fs2-serve.nebius.ai/model-id": "magpie-tts-multilingual-357m",
              "workload.fs2.nebius/owner": "voice-agent-20260916",
              "fs2.voice/model": "magpie-tts-multilingual-357m"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 1900,
            "securityContext": {
              "runAsUser": 10001,
              "runAsGroup": 10001,
              "fsGroup": 10001
            },
            "nodeSelector": {},
            "tolerations": [
              {
                "key": "dedicated",
                "operator": "Equal",
                "value": "fs2-inference",
                "effect": "NoSchedule"
              }
            ],
            "containers": [
              {
                "name": "voice",
                "image": "cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/voice-agent/magpie@sha256:fc9db5fd5df87e819766297d90a4595664aec63e7dbfd6735b3f2053b4725ead",
                "imagePullPolicy": "IfNotPresent",
                "env": [
                  {
                    "name": "FS2_VOICE_MODEL",
                    "value": "magpie-tts-multilingual-357m"
                  },
                  {
                    "name": "OMP_NUM_THREADS",
                    "value": "2"
                  },
                  {
                    "name": "FS2_SPEECH_ARTIFACT_HOSTS",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "fs2-speech-runtime-settings",
                        "key": "artifact-hosts"
                      }
                    }
                  }
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "2",
                    "memory": "16Gi",
                    "ephemeral-storage": "16Gi",
                    "nvidia.com/gpu": "1"
                  },
                  "limits": {
                    "cpu": "4",
                    "memory": "32Gi",
                    "ephemeral-storage": "32Gi",
                    "nvidia.com/gpu": "1"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "failureThreshold": 180
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": "http"
                  },
                  "periodSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": "http"
                  },
                  "periodSeconds": 30,
                  "failureThreshold": 5
                },
                "lifecycle": {
                  "preStop": {
                    "exec": {
                      "command": [
                        "python",
                        "-c",
                        "import json,time,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=5); deadline=time.monotonic()+1850; exec(\"while time.monotonic()<deadline:\\n try:\\n  r=urllib.request.urlopen('http://127.0.0.1:8000/metrics',timeout=5).read().decode()\\n  if 'fs2_voice_occupied 0.0' in r: break\\n except Exception: break\\n time.sleep(1)\"); time.sleep(5)"
                      ]
                    }
                  }
                },
                "volumeMounts": [
                  {
                    "name": "cache",
                    "mountPath": "/cache"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "cache",
                "emptyDir": {
                  "sizeLimit": "16Gi"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "magpie-tts-multilingual-357m",
        "namespace": "fs2-models",
        "labels": {
          "app.kubernetes.io/name": "magpie-tts-multilingual-357m",
          "app.kubernetes.io/part-of": "fs2-serve",
          "app.kubernetes.io/component": "model-runtime",
          "fs2-serve.nebius.ai/model-id": "magpie-tts-multilingual-357m",
          "workload.fs2.nebius/owner": "voice-agent-20260916",
          "fs2.voice/model": "magpie-tts-multilingual-357m"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "magpie-tts-multilingual-357m"
        },
        "ports": [
          {
            "name": "http",
            "port": 8000,
            "targetPort": "http"
          }
        ]
      }
    }
  ]
}
