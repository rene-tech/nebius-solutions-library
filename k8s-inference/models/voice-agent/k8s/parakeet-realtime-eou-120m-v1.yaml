apiVersion: apps/v1
kind: Deployment
metadata:
  name: parakeet-realtime-eou-120m-v1
  namespace: fs2-models
  labels: &id001
    app.kubernetes.io/name: parakeet-realtime-eou-120m-v1
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/component: model-runtime
    fs2-serve.nebius.ai/model-id: parakeet-realtime-eou-120m-v1
    workload.fs2.nebius/owner: voice-agent-20260916
    fs2.voice/model: parakeet-realtime-eou-120m-v1
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parakeet-realtime-eou-120m-v1
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1900
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector: {}
      tolerations:
      - key: dedicated
        operator: Equal
        value: fs2-inference
        effect: NoSchedule
      containers:
      - name: voice
        image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/voice-agent/parakeet@sha256:99c38f2fa6fc7ec267c8475cc25380a98ac6e2b0eb2141b5628569c8b45f98fa
        imagePullPolicy: IfNotPresent
        env:
        - name: FS2_VOICE_MODEL
          value: parakeet-realtime-eou-120m-v1
        - name: OMP_NUM_THREADS
          value: '2'
        - name: FS2_SPEECH_ARTIFACT_HOSTS
          valueFrom:
            configMapKeyRef:
              name: fs2-speech-runtime-settings
              key: artifact-hosts
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 16Gi
            ephemeral-storage: 16Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 32Gi
            nvidia.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          failureThreshold: 5
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - 'import json,time,urllib.request; urllib.request.urlopen(urllib.request.Request(''http://127.0.0.1:8000/drain'',method=''POST''),timeout=5);
                deadline=time.monotonic()+1850; exec("while time.monotonic()<deadline:\n
                try:\n  r=urllib.request.urlopen(''http://127.0.0.1:8000/metrics'',timeout=5).read().decode()\n  if
                ''fs2_voice_occupied 0.0'' in r: break\n except Exception: break\n
                time.sleep(1)"); time.sleep(5)'
        volumeMounts:
        - name: cache
          mountPath: /cache
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: parakeet-realtime-eou-120m-v1
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: parakeet-realtime-eou-120m-v1
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/component: model-runtime
    fs2-serve.nebius.ai/model-id: parakeet-realtime-eou-120m-v1
    workload.fs2.nebius/owner: voice-agent-20260916
    fs2.voice/model: parakeet-realtime-eou-120m-v1
spec:
  selector:
    app.kubernetes.io/name: parakeet-realtime-eou-120m-v1
  ports:
  - name: http
    port: 8000
    targetPort: http
