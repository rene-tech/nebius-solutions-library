apiVersion: v1
kind: ServiceAccount
metadata:
  name: fs2-image-cache
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: fs2-image-cache
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/managed-by: fs2-serve-models
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fs2-cold-start-cache-contract
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: fs2-image-cache
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/managed-by: fs2-serve-models
data:
  schema: fs2-serve.nebius.ai/cold-start-cache-contract/v1
  artifact-acquisition-contract: k8s-inference/catalog/runtime/contracts/artifact-acquisition.json
  acquisition-renderer: fs2_serve_catalog.kubernetes.render_artifact_acquisition_job
  catalog-image-prepull-job-renderer: fs2_serve_catalog.kubernetes.render_image_prepull_job
  resident-image-holder: one-image-per-daemonset-explicit-node-label
  localization-renderer: fs2_serve_catalog.kubernetes.render_localization_job
  shared-cache-pvc: fs2-cache
  shared-content-path: /mnt/fs2-serve-cache/models/{model_id}/sha256/{content_digest}
  local-content-path: /var/lib/fs2-serve/cache/models/{model_id}/sha256/{content_digest}
  qwen-first-cohort: protected-retain-provider-block-pvc
  local-nvme-policy: reviewed-local-pv-pvc-only
  raw-disk-formatting: forbidden
  host-path: forbidden
  runtime-image-policy: immutable-digest-only
  registry-auth: node-service-account-registry-reader
  compile-cache-abi: driver-580.173.02-sm103
  compile-cache-retention-target-generations: "2"
  compile-cache-gc: supervised-scale-zero-only
