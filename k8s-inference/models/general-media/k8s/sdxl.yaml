apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdxl
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: sdxl
    app.kubernetes.io/part-of: fs2-serve
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdxl-cache
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: sdxl
    app.kubernetes.io/part-of: fs2-serve
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi
  storageClassName: compute-csi-default-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdxl
  namespace: fs2-models
  labels:
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/instance: sdxl
    app.kubernetes.io/name: sdxl
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/version: 462165984030d82259a11f4367a4eed129e94a7b
  annotations:
    fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
    fs2.nebius/model-content-digest: sha256:8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81
    fs2.nebius/model-repository: stabilityai/stable-diffusion-xl-base-1.0
    fs2.nebius/model-revision: 462165984030d82259a11f4367a4eed129e94a7b
    fs2.nebius/runtime-image-digest: sha256:8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07
    fs2.nebius/task: fs2-serve-all-models-general-media-wave
spec:
  progressDeadlineSeconds: 2400
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: sdxl
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-runtime
        app.kubernetes.io/instance: sdxl
        app.kubernetes.io/name: sdxl
        app.kubernetes.io/part-of: fs2-serve
        app.kubernetes.io/version: 462165984030d82259a11f4367a4eed129e94a7b
      annotations:
        fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
        fs2.nebius/model-content-digest: sha256:8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81
        fs2.nebius/model-repository: stabilityai/stable-diffusion-xl-base-1.0
        fs2.nebius/model-revision: 462165984030d82259a11f4367a4eed129e94a7b
        fs2.nebius/runtime-image-digest: sha256:8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        capacity.fs2.nebius/pool: burst
        capacity.fs2.nebius/type: preemptible
        accelerator.fs2.nebius/class: nvidia-b300-sxm6-288gb
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sdxl
      terminationGracePeriodSeconds: 120
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: fs2-inference
      initContainers:
        - name: prepare-runtime-cache
          image: registry.example.invalid/k8s-inference/models/general-media-runtime@sha256:8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for directory in cuda torch-extensions torchinductor triton; do
                mkdir -p "${FS2_RUNTIME_CACHE_ROOT}/${directory}"
              done
              test -w "${FS2_RUNTIME_CACHE_ROOT}"
          env:
            - name: FS2_RUNTIME_CACHE_ROOT
              value: /model-cache/.fs2/runtime/8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07/8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81/driver-580.173.02-sm103
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 128Mi
              memory: 256Mi
            requests:
              cpu: 10m
              ephemeral-storage: 16Mi
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
      containers:
        - name: server
          image: registry.example.invalid/k8s-inference/models/general-media-runtime@sha256:8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07
          imagePullPolicy: IfNotPresent
          command:
            - /opt/fs2-media-venv/bin/python
            - /opt/fs2-media/sdxl_server.py
          env:
            - name: DO_NOT_TRACK
              value: "1"
            - name: FS2_MODEL_ID
              value: sdxl
            - name: FS2_MODEL_REPOSITORY
              value: stabilityai/stable-diffusion-xl-base-1.0
            - name: FS2_MODEL_REVISION
              value: 462165984030d82259a11f4367a4eed129e94a7b
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_HOME
              value: /model-cache
            - name: HOME
              value: /runtime-cache/home
            - name: CUDA_CACHE_PATH
              value: /model-cache/.fs2/runtime/8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07/8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81/driver-580.173.02-sm103/cuda
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /model-cache/.fs2/runtime/8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07/8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81/driver-580.173.02-sm103/torchinductor
            - name: TORCH_EXTENSIONS_DIR
              value: /model-cache/.fs2/runtime/8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07/8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81/driver-580.173.02-sm103/torch-extensions
            - name: TRITON_CACHE_DIR
              value: /model-cache/.fs2/runtime/8ea08b1a5eabf0ed9c5193e7f49c5546fcbd8452692bbd4ba13accecd7fc8e07/8699099d13a60f34bd19470fa56abd7a8614260b09838bd61a876d5b9d080c81/driver-580.173.02-sm103/triton
            - name: XDG_CACHE_HOME
              value: /runtime-cache/xdg
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "24"
              ephemeral-storage: 16Gi
              memory: 96Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "8"
              ephemeral-storage: 4Gi
              memory: 48Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 240
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /runtime-cache
              name: runtime-cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: sdxl-cache
        - emptyDir:
            sizeLimit: 16Gi
          name: runtime-cache
        - emptyDir:
            sizeLimit: 8Gi
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: sdxl
  namespace: fs2-models
  labels:
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/instance: sdxl
    app.kubernetes.io/name: sdxl
    app.kubernetes.io/part-of: fs2-serve
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: sdxl
  type: ClusterIP
