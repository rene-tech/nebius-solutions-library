apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-5-2-fp8-localizer
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: glm-5-2-fp8
    app.kubernetes.io/part-of: fs2-serve
data:
  localize.py: |
    import json
    import os
    import shutil
    from concurrent.futures import ThreadPoolExecutor
    from pathlib import Path

    from huggingface_hub import snapshot_download

    REPOSITORY = "zai-org/GLM-5.2-FP8"
    REVISION = "ba978f7d347eaf65d22f1a86833408afdb953541"
    EXPECTED_BYTES = 755_663_676_164

    cold_root = Path("/cold-cache/huggingface")
    local_root = Path("/model-cache")
    runtime_root = Path(os.environ["FS2_RUNTIME_CACHE_ROOT"])
    workers = int(os.environ.get("FS2_LOCALIZE_WORKERS", "32"))

    snapshot = Path(
        snapshot_download(
            repo_id=REPOSITORY,
            revision=REVISION,
            cache_dir=cold_root,
            max_workers=workers,
        )
    )
    files = sorted(path for path in snapshot.rglob("*") if path.is_file())
    source_bytes = sum(path.stat().st_size for path in files)
    if source_bytes != EXPECTED_BYTES:
        raise RuntimeError(
            f"snapshot size mismatch: expected {EXPECTED_BYTES}, got {source_bytes}"
        )

    def stage(path: Path) -> int:
        relative = path.relative_to(snapshot)
        destination = local_root / relative
        destination.parent.mkdir(parents=True, exist_ok=True)
        source = path.resolve(strict=True)
        if destination.exists() and destination.stat().st_size == source.stat().st_size:
            return source.stat().st_size
        temporary = destination.with_name(f".{destination.name}.partial")
        shutil.copy2(source, temporary, follow_symlinks=True)
        os.replace(temporary, destination)
        return source.stat().st_size

    local_root.mkdir(parents=True, exist_ok=True)
    with ThreadPoolExecutor(max_workers=workers) as executor:
        staged_bytes = sum(executor.map(stage, files))
    if staged_bytes != EXPECTED_BYTES:
        raise RuntimeError(
            f"localized size mismatch: expected {EXPECTED_BYTES}, got {staged_bytes}"
        )

    for directory in ("cuda", "torch-extensions", "torchinductor", "triton", "vllm"):
        (runtime_root / directory).mkdir(parents=True, exist_ok=True)
    receipt = {
        "repository": REPOSITORY,
        "revision": REVISION,
        "source": "durable-network-pvc",
        "target": "kubelet-ephemeral-local-nvme",
        "bytes": staged_bytes,
        "workers": workers,
    }
    (runtime_root / "localization-receipt.json").write_text(
        json.dumps(receipt, sort_keys=True) + "\n",
        encoding="utf-8",
    )
---
