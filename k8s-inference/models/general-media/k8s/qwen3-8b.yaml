apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-b300
  namespace: fs2-models
  labels: &labels
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/instance: qwen3-8b-b300
    app.kubernetes.io/managed-by: fs2-serve-models
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/version: b968826d9c46dd6066d109eabc6255188de91218
  annotations:
    fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
    fs2.nebius/model-content-digest: sha256:5b0f0f64ddb02ee2deeed4772968b9e2139a922acc9b9bb9c3488d23c678971d
    fs2.nebius/runtime-image-digest: sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: qwen3-8b-b300
  template:
    metadata:
      labels: *labels
      annotations:
        fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
        fs2.nebius/model-content-digest: sha256:5b0f0f64ddb02ee2deeed4772968b9e2139a922acc9b9bb9c3488d23c678971d
        fs2.nebius/model-revision: b968826d9c46dd6066d109eabc6255188de91218
        fs2.nebius/runtime-image-digest: sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
    spec:
      serviceAccountName: qwen3-8b-b300
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        capacity.fs2.nebius/pool: burst
        accelerator.fs2.nebius/class: nvidia-b300-sxm6-288gb
        accelerator.fs2.nebius/pool-id: nebius-b300-preemptible-8x
        capacity.fs2.nebius/type: preemptible
        workload.fs2.nebius/gpu: "true"
      tolerations:
        - {key: dedicated, operator: Equal, value: fs2-inference, effect: NoSchedule}
      initContainers:
        - name: localize-model
          image: registry.example.invalid/k8s-inference/models/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
          command: [python3, /contract/localize.py]
          env:
            - {name: HF_HUB_DISABLE_TELEMETRY, value: "1"}
            - {name: HF_HOME, value: /models/.cache/huggingface}
          resources:
            requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 4Gi}
            limits: {cpu: "16", memory: 32Gi, ephemeral-storage: 16Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: contract, mountPath: /contract, readOnly: true}
            - {name: model, mountPath: /models}
      containers:
        - name: vllm
          image: registry.example.invalid/k8s-inference/models/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
          args: [/models/qwen3-8b, --served-model-name, qwen3-8b, Qwen/Qwen3-8B, --host, 0.0.0.0, --port, "8000", --dtype, bfloat16, --tensor-parallel-size, "1", --max-model-len, "32768", --gpu-memory-utilization, "0.80", --generation-config, vllm, --enable-prefix-caching]
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
            - {name: VLLM_CACHE_ROOT, value: /runtime-cache/vllm}
            - {name: TRITON_CACHE_DIR, value: /runtime-cache/triton}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          resources:
            requests: {cpu: "8", memory: 64Gi, ephemeral-storage: 4Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "24", memory: 160Gi, ephemeral-storage: 32Gi, nvidia.com/gpu: "1"}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15, failureThreshold: 4}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: model, mountPath: /models, readOnly: true}
            - {name: runtime-cache, mountPath: /runtime-cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: contract
          configMap: {name: qwen3-8b-b300-contract, defaultMode: 292}
        - name: model
          persistentVolumeClaim: {claimName: qwen3-8b-cache}
        - name: runtime-cache
          emptyDir: {sizeLimit: 16Gi}
        - name: tmp
          emptyDir: {sizeLimit: 8Gi}
