          {"path":"README.md","size":16660,"sha256":"0f36caaff9c2516411a7738db384606263ba653c1e63e61d72f511606164d5a6"},
          {"path":"config.json","size":728,"sha256":"f7c4eadfbbf522470667b797a3c89be2524832d2d599797248dc304fff447c30"},
          {"path":"generation_config.json","size":239,"sha256":"2325da0f15bb848e018c5ae071b7943332e9f871d6b60e2ed22ca97d4cb993d2"},
          {"path":"merges.txt","size":1671853,"sha256":"8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5"},
          {"path":"model-00001-of-00005.safetensors","size":3996250744,"sha256":"31d6a825ae35f11fb85b195b4c42c146c051e446433125a215336abdf95cbf5f"},
          {"path":"model-00002-of-00005.safetensors","size":3993160032,"sha256":"5991236cea6fe21f3d43cab0f0e84448734fbbe0789816202989f2ddc9d18282"},
