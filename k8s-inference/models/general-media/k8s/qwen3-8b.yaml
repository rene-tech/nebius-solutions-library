    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/part-of: fs2-serve
data:
  localize.py: |
    import hashlib, json, os
    from pathlib import Path
    from huggingface_hub import snapshot_download

    lock = json.loads(Path("/contract/model.lock.json").read_text())
    model = lock["model"]
    target = Path("/models/qwen3-8b")
    target.mkdir(parents=True, exist_ok=True)
    snapshot_download(
        repo_id=model["repo_id"],
        revision=model["revision"],
        local_dir=target,
        allow_patterns=[item["path"] for item in model["files"]],
    )
    actual = {
        p.relative_to(target).as_posix()
        for p in target.rglob("*")
        if p.is_file()
        and ".cache" not in p.parts
        and p.name != "localization-receipt.json"
    }
    expected = {item["path"] for item in model["files"]}
    if actual != expected:
        raise RuntimeError(f"inventory mismatch: missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}")
    total = 0
    for item in model["files"]:
        path = target / item["path"]
        digest = hashlib.sha256(path.read_bytes()).hexdigest()
        if path.stat().st_size != item["size"] or digest != item["sha256"]:
            raise RuntimeError(f"artifact mismatch: {item['path']}")
        total += path.stat().st_size
    if total != model["total_size_bytes"]:
        raise RuntimeError("total artifact size mismatch")
    Path("/models/localization-receipt.json").write_text(json.dumps({"revision": model["revision"], "total_size_bytes": total}, sort_keys=True))
  model.lock.json: |
    {
