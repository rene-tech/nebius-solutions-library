  name: evo2-40b
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: evo2-40b
    app.kubernetes.io/part-of: fs2-serve
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evo2-40b-cache
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: evo2-40b
    app.kubernetes.io/part-of: fs2-serve
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 192Gi
  storageClassName: compute-csi-default-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo2-40b
  namespace: fs2-models
  labels:
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/instance: evo2-40b
    app.kubernetes.io/name: evo2-40b
    app.kubernetes.io/part-of: fs2-serve
    app.kubernetes.io/version: d529aa57c30771814217ad89baaeaf6e2315c7d7
  annotations:
