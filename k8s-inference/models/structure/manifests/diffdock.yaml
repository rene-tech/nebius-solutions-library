apiVersion: v1
kind: Service
metadata:
  name: diffdock-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: diffdock
    app.kubernetes.io/instance: diffdock-b300
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/model-id: diffdock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: diffdock-b300
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diffdock-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: diffdock
    app.kubernetes.io/instance: diffdock-b300
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/model-id: diffdock
  annotations:
    fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
    fs2.nebius/model-content-digest: sha256:fe05bca0521f77e120fe135021f555269b0128e929e60f201542d4c17483329c
    fs2.nebius/runtime-image-digest: sha256:cb3875f7d66b8d170d0e3f16d3d9a63aee8d63fbb23fdf65ec7ea0214d849529
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: diffdock-b300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diffdock
        app.kubernetes.io/instance: diffdock-b300
        app.kubernetes.io/component: model-runtime
        app.kubernetes.io/part-of: fs2-serve
        fs2.nebius.ai/model-id: diffdock
      annotations:
        fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
        fs2.nebius/model-content-digest: sha256:fe05bca0521f77e120fe135021f555269b0128e929e60f201542d4c17483329c
        fs2.nebius/runtime-image-digest: sha256:cb3875f7d66b8d170d0e3f16d3d9a63aee8d63fbb23fdf65ec7ea0214d849529
        fs2.nebius.ai/source-revision: 85c49b60d3e0b0182a59ee43a34a6d7036981284
        fs2.nebius.ai/score-checkpoint-sha256: 64afbdc97f6c700df0309162eb533ee6f2754c71412aca7a3a534a7239667260
        fs2.nebius.ai/confidence-checkpoint-sha256: 18d0fcc97fc55436786db02305ac61c734ad682aa5f8dee601555369c8461a57
        fs2.nebius.ai/esm-checkpoint-sha256: ea9d0522b335a8778dea6535a65301f10208dece28cd5865482b0b1fc446168c
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        capacity.fs2.nebius/pool: burst
        capacity.fs2.nebius/type: preemptible
        accelerator.fs2.nebius/class: nvidia-b300-sxm6-288gb
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: registry.example.invalid/k8s-inference/models/diffdock@sha256:cb3875f7d66b8d170d0e3f16d3d9a63aee8d63fbb23fdf65ec7ea0214d849529
          imagePullPolicy: IfNotPresent
          env:
            - name: FS2_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "24"
              memory: 200Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 360
          readinessProbe:
            # The bounded threaded server reserves one handler for probes;
            # live B300 qualification kept this endpoint below one second
            # while four semantic requests serialized on the GPU worker.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
