        fs2.nebius.ai/source-revision: 86507b6538f51fce57b5a72477165f03999ed7ae
        fs2.nebius.ai/checkpoint-sha256: 0fcf7d7c32b4848030aca3a051e6768de194616f96ba6c38186351a33bfc6eca
