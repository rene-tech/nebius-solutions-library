apiVersion: v1
kind: Service
metadata:
  name: proteinmpnn-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: proteinmpnn
    app.kubernetes.io/instance: proteinmpnn-b300
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/model-id: proteinmpnn
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: proteinmpnn-b300
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proteinmpnn-b300
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: proteinmpnn
    app.kubernetes.io/instance: proteinmpnn-b300
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/model-id: proteinmpnn
  annotations:
    fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
    fs2.nebius/model-content-digest: sha256:c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd
    fs2.nebius/runtime-image-digest: sha256:13d195ac5e24ca9d75de058f08141ece37e60962dcdffb50b6d24ea474313d47
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: proteinmpnn-b300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteinmpnn
        app.kubernetes.io/instance: proteinmpnn-b300
        app.kubernetes.io/component: model-runtime
        app.kubernetes.io/part-of: fs2-serve
        fs2.nebius.ai/model-id: proteinmpnn
      annotations:
        fs2.nebius/compile-cache-abi: driver-580.173.02-sm103
        fs2.nebius/model-content-digest: sha256:c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd
        fs2.nebius/runtime-image-digest: sha256:13d195ac5e24ca9d75de058f08141ece37e60962dcdffb50b6d24ea474313d47
        fs2.nebius.ai/source-revision: 8907e6671bfbfc92303b5f79c4b5e6ce47cdef57
        fs2.nebius.ai/checkpoint-sha256: c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        capacity.fs2.nebius/pool: burst
        capacity.fs2.nebius/type: preemptible
        accelerator.fs2.nebius/class: nvidia-b300-sxm6-288gb
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: registry.example.invalid/k8s-inference/models/proteinmpnn@sha256:13d195ac5e24ca9d75de058f08141ece37e60962dcdffb50b6d24ea474313d47
          imagePullPolicy: IfNotPresent
          env:
            - name: FS2_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 360
          readinessProbe:
            # Startup already proves model readiness. Afterwards, keep the
            # endpoint routable while the single-flight GPU worker is busy.
            # Even TCP connects can exhaust the listen backlog during a long
            # inference, so probe the already-started PID without using its
            # request socket.
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            # The exact adapter serializes inference on its HTTP thread; an
            # HTTP/TCP liveness probe would kill healthy long-running requests
            # when the listen backlog is full. Startup proves the model once;
            # after that, liveness only asserts that the runtime PID exists.
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
