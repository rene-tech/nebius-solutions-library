apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfold3
  namespace: fs2-models
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfold3-preview2-cache
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: openfold3
    app.kubernetes.io/part-of: fs2-serve
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: compute-csi-default-sc
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfold3
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: openfold3
    app.kubernetes.io/instance: openfold3
    app.kubernetes.io/part-of: fs2-serve
  annotations:
    fs2.nebius/compile-cache-abi: deployment-profile-abi-v1
    fs2.nebius/model-repository: github.com/aqlaboratory/openfold-3
    fs2.nebius/model-revision: 4a0eaeaeae8ca1d815d0a97d8eb45d639b91a47e
    fs2.nebius/model-content-digest: sha256:36ae787cface66870e498823d54670103922475757b1610ba24f199174150590
    fs2.nebius/runtime-image-digest: sha256:1e35247f0de8be59119ddf875c2631173a8c533c90f7b21e1c01ef70a069c00c
    fs2.nebius/runtime-origin: upstream-source-preview2-not-nim
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 2400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: openfold3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfold3
        app.kubernetes.io/instance: openfold3
        app.kubernetes.io/part-of: fs2-serve
      annotations:
        fs2.nebius/compile-cache-abi: deployment-profile-abi-v1
        fs2.nebius/model-repository: github.com/aqlaboratory/openfold-3
        fs2.nebius/model-revision: 4a0eaeaeae8ca1d815d0a97d8eb45d639b91a47e
        fs2.nebius/model-content-digest: sha256:36ae787cface66870e498823d54670103922475757b1610ba24f199174150590
        fs2.nebius/runtime-image-digest: sha256:1e35247f0de8be59119ddf875c2631173a8c533c90f7b21e1c01ef70a069c00c
        fs2.nebius/runtime-origin: upstream-source-preview2-not-nim
    spec:
      serviceAccountName: openfold3
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
        - key: dedicated
          operator: Equal
          value: fs2-inference
          effect: NoSchedule
      containers:
        - name: model
          image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/openfold3-preview2@sha256:1e35247f0de8be59119ddf875c2631173a8c533c90f7b21e1c01ef70a069c00c
          imagePullPolicy: IfNotPresent
          env:
            - name: FS2_RUNTIME_CACHE_ROOT
              value: /model-cache/1e35247f0de8be59119ddf875c2631173a8c533c90f7b21e1c01ef70a069c00c/deployment-profile-abi-v1
            - name: MAX_JOBS
              value: "8"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "6"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 900
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: openfold3-preview2-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openfold3
  namespace: fs2-models
  labels:
    app.kubernetes.io/name: openfold3
    app.kubernetes.io/part-of: fs2-serve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: openfold3
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
