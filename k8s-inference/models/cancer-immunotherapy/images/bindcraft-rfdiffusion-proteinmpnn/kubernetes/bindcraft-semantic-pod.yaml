apiVersion: v1
kind: Pod
metadata:
  name: fs2-image-smoke-bindcraft
  namespace: fs2-academic-poc
  labels:
    app.kubernetes.io/managed-by: fs2-cancer-runtime-image-smoke
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/offline-validation: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  enableServiceLinks: false
  nodeSelector:
    accelerator.fs2.nebius/class: nvidia-h100-sxm5-80gb
    capacity.fs2.nebius/source: capacity-block
  tolerations:
    - key: dedicated
      operator: Equal
      value: fs2-inference
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    supplementalGroups: [65532]
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: prepare-external-weight-mount
      image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/bindcraft@sha256:9ec7eb93208ffd5ec88669e9a6714d8d1e9bffcea1bd5130ab81271095736aa1
      imagePullPolicy: IfNotPresent
      command: [python, -c, "from pathlib import Path; p=Path('/work/weights_soluble'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch(mode=0o444, exist_ok=True)"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
  containers:
    - name: runtime
      image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/bindcraft@sha256:9ec7eb93208ffd5ec88669e9a6714d8d1e9bffcea1bd5130ab81271095736aa1
      imagePullPolicy: IfNotPresent
      command: [python, -c, "import time; print('ready', flush=True); time.sleep(86400)"]
      env:
        - name: PYTHONPATH
          value: /opt/fs2/academic/pyrosetta-bindcraft/site-packages:/opt/bindcraft
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: "false"
        - name: FS2_RUNTIME_IMAGE_DIGEST
          value: sha256:9ec7eb93208ffd5ec88669e9a6714d8d1e9bffcea1bd5130ab81271095736aa1
      resources:
        requests:
          cpu: "4"
          memory: 96Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "16"
          memory: 128Gi
          nvidia.com/gpu: "1"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: academic-runtime
          mountPath: /opt/fs2/academic/pyrosetta-bindcraft/site-packages
          subPath: pyrosetta-bindcraft/site-packages
          readOnly: true
        - name: work
          mountPath: /work
        - name: work
          mountPath: /opt/conda/lib/python3.10/site-packages/colabdesign/mpnn/weights_soluble
          subPath: weights_soluble
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: academic-runtime
      persistentVolumeClaim:
        claimName: academic-assets-runtime-rwx
        readOnly: true
    - name: work
      emptyDir:
        sizeLimit: 16Gi
    - name: tmp
      emptyDir:
        sizeLimit: 8Gi
