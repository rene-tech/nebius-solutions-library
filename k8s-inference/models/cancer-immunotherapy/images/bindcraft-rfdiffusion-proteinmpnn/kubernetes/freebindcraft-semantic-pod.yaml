apiVersion: v1
kind: Pod
metadata:
  name: fs2-image-smoke-freebindcraft
  namespace: fs2-academic-poc
  labels:
    app.kubernetes.io/managed-by: fs2-cancer-runtime-image-smoke
    app.kubernetes.io/part-of: fs2-serve
    fs2.nebius.ai/offline-validation: "true"
    fs2.nebius.ai/task: fs2-cancer-images-bindcraft-rfdiffusion-proteinmpnn-r20260902
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  enableServiceLinks: false
  nodeSelector:
    accelerator.fs2.nebius/class: nvidia-h100-sxm5-80gb
    capacity.fs2.nebius/source: capacity-block
  tolerations:
    - key: dedicated
      operator: Equal
      value: fs2-inference
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: prepare-external-weight-mount
      image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/freebindcraft@sha256:6d44aba5780c2b74985db037045e06e732f4e867795d33a6313c5faa95bd9e30
      imagePullPolicy: IfNotPresent
      command: [python, -c, "from pathlib import Path; p=Path('/work/weights_soluble'); p.mkdir(parents=True, exist_ok=True); (p/'__init__.py').touch(mode=0o444, exist_ok=True)"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
  containers:
    - name: runtime
      image: cr.eu-north1.nebius.cloud/e00akg9ndpx77eaexh/fs2-models/freebindcraft@sha256:6d44aba5780c2b74985db037045e06e732f4e867795d33a6313c5faa95bd9e30
      imagePullPolicy: IfNotPresent
      command: [python, -c, "import time; print('ready', flush=True); time.sleep(86400)"]
      env:
        - name: PYTHONPATH
          value: /opt/freebindcraft
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: "false"
        - name: FS2_RUNTIME_IMAGE_DIGEST
          value: sha256:6d44aba5780c2b74985db037045e06e732f4e867795d33a6313c5faa95bd9e30
      resources:
        requests:
          cpu: "4"
          memory: 96Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "16"
          memory: 128Gi
          nvidia.com/gpu: "1"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
        - name: work
          mountPath: /opt/conda/lib/python3.10/site-packages/colabdesign/mpnn/weights_soluble
          subPath: weights_soluble
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 16Gi
    - name: tmp
      emptyDir:
        sizeLimit: 8Gi
