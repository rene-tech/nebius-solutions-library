apiVersion: batch/v1
kind: Job
metadata: {name: fs2-complexa-h100-visibility-r20260903, namespace: fs2-academic-poc, labels: {fs2.nebius.ai/run-id: h100vis-r20260903}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata: {labels: {fs2.nebius.ai/run-id: h100vis-r20260903}}
    spec:
      restartPolicy: Never
      # The consumer node class: an 8xH100 inference node, reached through its
      # taint. No GPU is requested; this probe reads a filesystem.
      nodeSelector:
        accelerator.fs2.nebius/class: nvidia-h100-sxm5-80gb
        storage.fs2.nebius/reference-data: "true"
      tolerations:
      - {key: dedicated, operator: Equal, value: fs2-inference, effect: NoSchedule}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, supplementalGroups: [1000]}
      containers:
      - name: probe
        image: python:3.11-slim
        command:
        - python3
        - /opt/probe/generation_visibility_probe.py
        - --contract
        - /opt/probe/ingestion-contract.json
        - --generations-root
        - /reference/scientific-localization/public/generations
        - --expect
        - complexa-protein=eaaf891e89935b909f13bece3ff1e8c4a1ae43d0e2378b834e07ca74e2607536
        - --expect
        - complexa-ligand=61247c8dbf261307d708be53decfda69f21e73ff421556662366045c30d9cea5
        - --expect
        - complexa-ame=d38c622eaa0dad419f0ff0af72f36ab49299c533f5f56bbf08fa180e829afa5a
        - --expect
        - rosettafold3-checkpoint=d909fe65e86670b0a18a7494dd06811d301d0899e30778442e8ca6a343164bce
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: FS2_NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        volumeMounts: [{name: reference, mountPath: /reference, readOnly: true}, {name: probe, mountPath: /opt/probe, readOnly: true}]
        resources: {requests: {cpu: "4", memory: 2Gi}, limits: {cpu: "4", memory: 2Gi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
      - {name: reference, hostPath: {path: /mnt/fs2-reference-data/data, type: Directory}}
      - {name: probe, configMap: {name: fs2-complexa-visibility-probe, defaultMode: 0555}}
