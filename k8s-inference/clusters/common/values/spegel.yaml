# Spegel (clusters/common/apps/spegel.yaml, docs/IMAGES.md). containerd on every node must read per-registry
# hosts.toml files (config_path = /etc/containerd/certs.d, discard_unpacked_layers = false): the CPU node
# images ship that, the GPU node images do not; the node-config DaemonSet in this namespace adds it
# (charts/platform/templates/node-config). Spegel writes the hosts.toml files.
spegel:
  logLevel: INFO
  # Registries that get a hosts.toml: the fleet's logical host (every catalog/platform image) plus the public
  # registries other charts pull from directly, so their layers are shared between nodes as well.
  mirroredRegistries:
    - https://registry.serverless2.local
    - https://docker.io
    - https://ghcr.io
    - https://quay.io
    - https://nvcr.io
    - https://registry.k8s.io
  # After the peers: the cluster's Zot cache on the node's loopback NodePort (fleet.yaml images.cache.node_port).
  # Zot answers for registry.serverless2.local/<alias>/...; for the public hosts above it answers 404 and
  # containerd falls through to the upstream registry.
  additionalMirrorTargets:
    - http://127.0.0.1:30500
  resolveTags: true
  containerdMirrorAdd: true
# The containerd mirror file lists the registry's hostPort first, then its NodePort, then additionalMirrorTargets.
# Cilium here runs kube-proxy replacement without hostPort support (mk8s-managed, no enable-host-port), so a pod
# hostPort is never programmed: NODE_IP:30020 refused on every node, and containerd's blob re-open after a broken
# peer stream (httpReadSeeker) goes to that first host with no fallback: a definite pull failure
# (gpu-portability-e3-h200-r2, 2026-10-22). The hostPort is set to the NodePort so every listed host answers; the
# chart renders the entry twice, harmless. (hostPort null renders a broken `http://NODE_IP:` entry in chart 0.7.4.)
service:
  registry:
    hostPort: 30021
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }
serviceMonitor:
  enabled: true
grafanaDashboard:
  enabled: true
  mode: Sidecar
  labels: { grafana_dashboard: "1" }
