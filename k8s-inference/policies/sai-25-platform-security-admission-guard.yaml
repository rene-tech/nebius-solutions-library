# Defense-in-depth source contract only. This policy cannot prove or protect its
# own lifecycle. Before activation, a separate provider/IAM owner must deny the
# workload release identity admission-registration and protected-backend writes;
# independent Platform Security signs that provider receipt and the canonical
# live policy/binding projection. SAI-25 and its SAI-09 dependency consume those
# two authorizations and remain unready when either is absent, stale, or differs.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fs2-platform-security-admission-guard
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - validatingadmissionpolicies
          - validatingadmissionpolicybindings
          - validatingwebhookconfigurations
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "secrets", "serviceaccounts", "services"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
  matchConditions:
    - name: exact-sai-25-security-objects
      expression: >-
        (object != null && has(object.metadata) && (
          (request.resource.group == 'admissionregistration.k8s.io' &&
           request.resource.resource in [
             'validatingadmissionpolicies',
             'validatingadmissionpolicybindings',
             'validatingwebhookconfigurations'
           ] && object.metadata.name in [
             'fs2-platform-security-admission-guard',
             'fs2-scientific-runtime-cache-writer-fence',
             'fs2-scientific-cache-controller-chain',
             'fs2-nim-operator-admission',
             'fs2-serve-control-plane-nim-admission'
           ]) ||
          (object.metadata.namespace == 'fs2-system' && (
            (request.resource.group == '' && request.resource.resource == 'configmaps' &&
             (object.metadata.name.startsWith('fs2-nim-admission-') ||
              object.metadata.name.startsWith('fs2-nim-installation-') ||
              object.metadata.name.startsWith('fs2-nim-root-'))) ||
            (request.resource.group == '' && request.resource.resource == 'secrets' &&
             object.metadata.name.startsWith('fs2-nim-admission-tls-')) ||
            (request.resource.group == '' &&
             request.resource.resource in ['serviceaccounts', 'services'] &&
             object.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'apps' && request.resource.resource == 'deployments' &&
             object.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'networking.k8s.io' &&
             request.resource.resource == 'networkpolicies' &&
             object.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'policy' &&
             request.resource.resource == 'poddisruptionbudgets' &&
             object.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'rbac.authorization.k8s.io' &&
             request.resource.resource in ['roles', 'rolebindings'] &&
             object.metadata.name.startsWith('fs2-serve-control-plane-nim-')))) ||
          (request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['clusterroles', 'clusterrolebindings'] &&
           object.metadata.name == 'fs2-serve-control-plane-nim-policy-reader') ||
          (request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['roles', 'rolebindings'] &&
           object.metadata.name == 'fs2-serve-control-plane-nim-owner-reader') ||
          (object.metadata.namespace == 'fs2-models' &&
           request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['roles', 'rolebindings'] &&
           object.metadata.name.startsWith('fs2-serve-control-plane-nim-'))
        )) ||
        (oldObject != null && has(oldObject.metadata) && (
          (request.resource.group == 'admissionregistration.k8s.io' &&
           request.resource.resource in [
             'validatingadmissionpolicies',
             'validatingadmissionpolicybindings',
             'validatingwebhookconfigurations'
           ] && oldObject.metadata.name in [
             'fs2-platform-security-admission-guard',
             'fs2-scientific-runtime-cache-writer-fence',
             'fs2-scientific-cache-controller-chain',
             'fs2-nim-operator-admission',
             'fs2-serve-control-plane-nim-admission'
           ]) ||
          (oldObject.metadata.namespace == 'fs2-system' && (
            (request.resource.group == '' && request.resource.resource == 'configmaps' &&
             (oldObject.metadata.name.startsWith('fs2-nim-admission-') ||
              oldObject.metadata.name.startsWith('fs2-nim-installation-') ||
              oldObject.metadata.name.startsWith('fs2-nim-root-'))) ||
            (request.resource.group == '' && request.resource.resource == 'secrets' &&
             oldObject.metadata.name.startsWith('fs2-nim-admission-tls-')) ||
            (request.resource.group == '' &&
             request.resource.resource in ['serviceaccounts', 'services'] &&
             oldObject.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'apps' && request.resource.resource == 'deployments' &&
             oldObject.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'networking.k8s.io' &&
             request.resource.resource == 'networkpolicies' &&
             oldObject.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'policy' &&
             request.resource.resource == 'poddisruptionbudgets' &&
             oldObject.metadata.name == 'fs2-serve-control-plane-nim-admission') ||
            (request.resource.group == 'rbac.authorization.k8s.io' &&
             request.resource.resource in ['roles', 'rolebindings'] &&
             oldObject.metadata.name.startsWith('fs2-serve-control-plane-nim-')))) ||
          (request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['clusterroles', 'clusterrolebindings'] &&
           oldObject.metadata.name == 'fs2-serve-control-plane-nim-policy-reader') ||
          (request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['roles', 'rolebindings'] &&
           oldObject.metadata.name == 'fs2-serve-control-plane-nim-owner-reader') ||
          (oldObject.metadata.namespace == 'fs2-models' &&
           request.resource.group == 'rbac.authorization.k8s.io' &&
           request.resource.resource in ['roles', 'rolebindings'] &&
           oldObject.metadata.name.startsWith('fs2-serve-control-plane-nim-'))
        ))
  validations:
    - expression: >-
        request.operation == 'CREATE' &&
        object.kind == 'ConfigMap' &&
        object.metadata.namespace == 'fs2-system' &&
        object.metadata.name.startsWith('fs2-nim-root-')
          ? request.userInfo.username ==
              'system:serviceaccount:fs2-system:fs2-serve-control-plane-nim-admission' &&
            object.immutable == true &&
            object.metadata.labels == {
              'fs2-serve.nebius.ai/nim-root-enrollment':'true'
            } &&
            object.data.schema == 'fs2-serve.nebius.ai/nim-root-enrollment/v1' &&
            object.data.resource_kind in ['NIMCache', 'NIMService'] &&
            object.data.root_uid.matches(
              '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
            ) &&
            object.data.subject_sha256.matches('^[a-f0-9]{64}$') &&
            object.metadata.name.matches('^fs2-nim-root-[a-f0-9]{12}-[0-9a-f-]{36}$')
          : request.userInfo.username ==
              '__DENY_UNTEMPLATED_EPOCH_PRINCIPAL__'
      message: >-
        protected SAI-25 objects require the external Platform Security
        identity; immutable NIM enrollment CREATE is restricted to the exact
        admission reconciler and generation-addressed signed-root schema
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fs2-platform-security-admission-guard
  labels:
    app.kubernetes.io/managed-by: platform-security
    fs2-serve.nebius.ai/immutable-security-boundary: "true"
spec:
  policyName: fs2-platform-security-admission-guard
  validationActions: [Deny, Audit]
