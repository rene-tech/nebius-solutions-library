name: 'Kubernetes Inference Image Security'

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'k8s-inference/components/control-plane/Dockerfile'
      - 'k8s-inference/components/control-plane/uv.lock'
      - 'k8s-inference/components/admin-console/Dockerfile'
      - 'k8s-inference/components/admin-console/package-lock.json'
      - 'k8s-inference/catalog/runtime/**'
      - 'k8s-inference/observability/**'
      - 'k8s-inference/stages/foundation/values/**'
      - 'k8s-inference/stages/workloads/values/dcgm-exporter.yaml'
      - 'k8s-inference/addons/values/envoy-gateway.yaml'
      - 'k8s-inference/security/**'
      - '.github/workflows/k8s-inference-image-security.yml'

permissions:
  contents: read

concurrency:
  group: k8s-inference-image-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_RELEASE: '0.70.0'
  TRIVY_ARCHIVE: 'trivy_0.70.0_Linux-64bit.tar.gz'
  TRIVY_ARCHIVE_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'

jobs:
  scan-first-party-and-catalog:
    name: 'Scan exact first-party candidates and catalog lock'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install checksum-bound Trivy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin" "${RUNNER_TEMP}/sai-24-evidence"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_RELEASE}/${TRIVY_ARCHIVE}"
          printf '%s  %s\n' "${TRIVY_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            --directory "${RUNNER_TEMP}/trivy-bin" trivy
          printf '%s\n' "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version > "${RUNNER_TEMP}/sai-24-evidence/trivy-binary-version.txt"

      - name: Build exact OCI archives and record manifest digests
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          source_tree=$(git rev-parse HEAD^{tree})
          docker buildx build \
            --file k8s-inference/components/control-plane/Dockerfile \
            --output "type=oci,dest=${RUNNER_TEMP}/control-plane.oci.tar" \
            --metadata-file "${evidence}/control-plane-build-metadata.json" \
            --build-arg "FS2_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "FS2_SOURCE_TREE=${source_tree}" \
            --build-arg "FS2_UV_LOCK_SHA256=$(sha256sum k8s-inference/components/control-plane/uv.lock | awk '{print $1}')" \
            --build-arg "FS2_DOCKERFILE_SHA256=$(sha256sum k8s-inference/components/control-plane/Dockerfile | awk '{print $1}')" \
            --build-arg "FS2_CONTEXT_POLICY_SHA256=$(sha256sum k8s-inference/components/control-plane/Dockerfile.dockerignore | awk '{print $1}')" \
            .
          docker buildx build \
            --file k8s-inference/components/admin-console/Dockerfile \
            --output "type=oci,dest=${RUNNER_TEMP}/admin-console.oci.tar" \
            --metadata-file "${evidence}/admin-console-build-metadata.json" \
            --build-arg "FS2_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "FS2_SOURCE_TREE=${source_tree}" \
            --build-arg "FS2_PACKAGE_LOCK_SHA256=$(sha256sum k8s-inference/components/admin-console/package-lock.json | awk '{print $1}')" \
            .
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${evidence}/control-plane-build-metadata.json" > "${evidence}/control-plane.digest"
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${evidence}/admin-console-build-metadata.json" > "${evidence}/admin-console.digest"

      - name: Produce complete reports, SBOMs, and digest-bound receipts
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          source_tree=$(git rev-parse HEAD^{tree})
          for component in control-plane admin-console; do
            trivy image --input "${RUNNER_TEMP}/${component}.oci.tar" \
              --scanners vuln,secret --format json --output "${evidence}/${component}.trivy.json"
            trivy image --input "${RUNNER_TEMP}/${component}.oci.tar" \
              --format spdx-json --output "${evidence}/${component}.spdx.json"
          done
          trivy fs k8s-inference/catalog/runtime --scanners vuln,secret --format json \
            --output "${evidence}/catalog-runtime.trivy.json"
          trivy fs k8s-inference/catalog/runtime --format spdx-json \
            --output "${evidence}/catalog-runtime.spdx.json"
          trivy version --format json > "${evidence}/trivy-version.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind image \
            --subject "local/fs2-control-plane@$(cat "${evidence}/control-plane.digest")" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy image --input OCI_ARCHIVE --scanners vuln,secret --format json' \
            --report "${evidence}/control-plane.trivy.json" \
            --sbom "${evidence}/control-plane.spdx.json" \
            --output "${evidence}/control-plane.receipt.json"
          python3 k8s-inference/security/image_security_evidence.py package-inventory \
            --sbom "${evidence}/admin-console.spdx.json" \
            --package libcrypto3 --package libssl3 --package libexpat --package libuuid \
            --output "${evidence}/admin-console-runtime-packages.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind image \
            --subject "local/fs2-admin-console@$(cat "${evidence}/admin-console.digest")" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy image --input OCI_ARCHIVE --scanners vuln,secret --format json' \
            --report "${evidence}/admin-console.trivy.json" \
            --sbom "${evidence}/admin-console.spdx.json" \
            --package-inventory "${evidence}/admin-console-runtime-packages.json" \
            --output "${evidence}/admin-console.receipt.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind filesystem --subject "git-tree:${source_tree}:k8s-inference/catalog/runtime" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy fs k8s-inference/catalog/runtime --scanners vuln,secret --format json' \
            --report "${evidence}/catalog-runtime.trivy.json" \
            --sbom "${evidence}/catalog-runtime.spdx.json" \
            --output "${evidence}/catalog-runtime.receipt.json"

      - name: Retain complete first-party evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sai-24-first-party-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sai-24-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce report and receipt policy after evidence retention
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          python3 k8s-inference/security/image_security_evidence.py report \
            "${evidence}/control-plane.trivy.json" \
            "${evidence}/admin-console.trivy.json" \
            "${evidence}/catalog-runtime.trivy.json"
          python3 k8s-inference/security/image_security_evidence.py receipt \
            "${evidence}/control-plane.receipt.json" \
            "${evidence}/admin-console.receipt.json" \
            "${evidence}/catalog-runtime.receipt.json"

  scan-third-party-images:
    name: 'Scan complete digest-bound third-party inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install checksum-bound Trivy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin" "${RUNNER_TEMP}/sai-24-third-party"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_RELEASE}/${TRIVY_ARCHIVE}"
          printf '%s  %s\n' "${TRIVY_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            --directory "${RUNNER_TEMP}/trivy-bin" trivy
          printf '%s\n' "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version > "${RUNNER_TEMP}/sai-24-third-party/trivy-binary-version.txt"

      - name: Require and scan every exact inventory subject
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-third-party"
          source_tree=$(git rev-parse HEAD^{tree})
          python3 k8s-inference/security/image_security_evidence.py inventory \
            k8s-inference/security/third-party-images.lock.json \
            --print-digest-references > "${RUNNER_TEMP}/third-party-digests.txt"
          while IFS= read -r image_ref; do
            artifact_id=$(printf '%s' "${image_ref}" | sha256sum | cut -c1-16)
            trivy image "${image_ref}" --scanners vuln,secret --format json \
              --output "${evidence}/${artifact_id}.trivy.json"
            trivy image "${image_ref}" --format spdx-json \
              --output "${evidence}/${artifact_id}.spdx.json"
          done < "${RUNNER_TEMP}/third-party-digests.txt"
          trivy version --format json > "${evidence}/trivy-version.json"
          while IFS= read -r image_ref; do
            artifact_id=$(printf '%s' "${image_ref}" | sha256sum | cut -c1-16)
            python3 k8s-inference/security/image_security_evidence.py create-receipt \
              --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
              --kind image --subject "${image_ref}" \
              --scanner-release "${TRIVY_RELEASE}" \
              --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
              --scanner-version "${evidence}/trivy-version.json" \
              --command-contract 'trivy image DIGEST_REFERENCE --scanners vuln,secret --format json' \
              --report "${evidence}/${artifact_id}.trivy.json" \
              --sbom "${evidence}/${artifact_id}.spdx.json" \
              --output "${evidence}/${artifact_id}.receipt.json"
          done < "${RUNNER_TEMP}/third-party-digests.txt"

      - name: Retain complete third-party evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sai-24-third-party-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sai-24-third-party
          if-no-files-found: error
          retention-days: 90

      - name: Enforce all retained third-party reports and receipts
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-third-party"
          mapfile -t reports < <(find "${evidence}" -maxdepth 1 -name '*.trivy.json' -print | sort)
          mapfile -t receipts < <(find "${evidence}" -maxdepth 1 -name '*.receipt.json' -print | sort)
          test "${#reports[@]}" -gt 0
          test "${#reports[@]}" -eq "${#receipts[@]}"
          python3 k8s-inference/security/image_security_evidence.py report "${reports[@]}"
          python3 k8s-inference/security/image_security_evidence.py receipt "${receipts[@]}"
