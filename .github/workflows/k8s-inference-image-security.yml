name: 'Kubernetes Inference Image Security'

on:
  workflow_call:
    inputs:
      render_evidence_artifact_id:
        description: 'GitHub artifact ID containing the signed out-of-tree render packet'
        required: false
        type: string
      render_evidence_archive_sha256:
        description: 'SHA-256 of the exact render evidence artifact archive'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      render_evidence_artifact_id:
        description: 'GitHub artifact ID containing the signed out-of-tree render packet'
        required: false
        type: string
      render_evidence_archive_sha256:
        description: 'SHA-256 of the exact render evidence artifact archive'
        required: false
        type: string
  pull_request:
    paths:
      - 'k8s-inference/components/control-plane/Dockerfile'
      - 'k8s-inference/components/control-plane/uv.lock'
      - 'k8s-inference/components/admin-console/Dockerfile'
      - 'k8s-inference/components/admin-console/package-lock.json'
      - 'k8s-inference/catalog/runtime/**'
      - 'k8s-inference/observability/**'
      - 'k8s-inference/stages/foundation/values/**'
      - 'k8s-inference/stages/workloads/values/dcgm-exporter.yaml'
      - 'k8s-inference/addons/values/envoy-gateway.yaml'
      - 'k8s-inference/security/**'
      - '.github/workflows/k8s-inference-image-security.yml'

permissions:
  contents: read

concurrency:
  group: k8s-inference-image-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_RELEASE: '0.70.0'
  TRIVY_ARCHIVE: 'trivy_0.70.0_Linux-64bit.tar.gz'
  TRIVY_ARCHIVE_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'

jobs:
  scan-first-party-and-catalog:
    name: 'Untrusted source scan (not promotion evidence)'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install checksum-bound Trivy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin" "${RUNNER_TEMP}/sai-24-evidence"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_RELEASE}/${TRIVY_ARCHIVE}"
          printf '%s  %s\n' "${TRIVY_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            --directory "${RUNNER_TEMP}/trivy-bin" trivy
          printf '%s\n' "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version > "${RUNNER_TEMP}/sai-24-evidence/trivy-binary-version.txt"

      - name: Build exact OCI archives and record manifest digests
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          source_tree=$(git rev-parse HEAD^{tree})
          alpine_lock=k8s-inference/security/alpine-runtime-packages.lock.json
          libcrypto3=$(python3 k8s-inference/security/image_security_evidence.py alpine-package "$alpine_lock" --package libcrypto3)
          libssl3=$(python3 k8s-inference/security/image_security_evidence.py alpine-package "$alpine_lock" --package libssl3)
          libexpat=$(python3 k8s-inference/security/image_security_evidence.py alpine-package "$alpine_lock" --package libexpat)
          libuuid=$(python3 k8s-inference/security/image_security_evidence.py alpine-package "$alpine_lock" --package libuuid)
          docker buildx build \
            --file k8s-inference/components/control-plane/Dockerfile \
            --provenance=mode=max \
            --output "type=oci,dest=${evidence}/control-plane.oci.tar" \
            --metadata-file "${evidence}/control-plane-build-metadata.json" \
            --build-arg "FS2_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "FS2_SOURCE_TREE=${source_tree}" \
            --build-arg "FS2_UV_LOCK_SHA256=$(sha256sum k8s-inference/components/control-plane/uv.lock | awk '{print $1}')" \
            --build-arg "FS2_DOCKERFILE_SHA256=$(sha256sum k8s-inference/components/control-plane/Dockerfile | awk '{print $1}')" \
            --build-arg "FS2_CONTEXT_POLICY_SHA256=$(sha256sum k8s-inference/components/control-plane/Dockerfile.dockerignore | awk '{print $1}')" \
            .
          docker buildx build \
            --file k8s-inference/components/admin-console/Dockerfile \
            --provenance=mode=max \
            --output "type=oci,dest=${evidence}/admin-console.oci.tar" \
            --metadata-file "${evidence}/admin-console-build-metadata.json" \
            --build-arg "FS2_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "FS2_SOURCE_TREE=${source_tree}" \
            --build-arg "FS2_PACKAGE_LOCK_SHA256=$(sha256sum k8s-inference/components/admin-console/package-lock.json | awk '{print $1}')" \
            --build-arg "FS2_ALPINE_PACKAGE_LOCK_SHA256=$(sha256sum "$alpine_lock" | awk '{print $1}')" \
            --build-arg "FS2_LIBCRYPTO3_APK=${libcrypto3}" \
            --build-arg "FS2_LIBSSL3_APK=${libssl3}" \
            --build-arg "FS2_LIBEXPAT_APK=${libexpat}" \
            --build-arg "FS2_LIBUUID_APK=${libuuid}" \
            .
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${evidence}/control-plane-build-metadata.json" > "${evidence}/control-plane.digest"
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${evidence}/admin-console-build-metadata.json" > "${evidence}/admin-console.digest"

      - name: Produce complete reports, SBOMs, and digest-bound receipts
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          source_tree=$(git rev-parse HEAD^{tree})
          for component in control-plane admin-console; do
            trivy image --input "${evidence}/${component}.oci.tar" \
              --scanners vuln,secret --format json --output "${evidence}/${component}.trivy.json"
            trivy image --input "${evidence}/${component}.oci.tar" \
              --format spdx-json --output "${evidence}/${component}.spdx.json"
          done
          trivy fs k8s-inference/catalog/runtime --scanners vuln,secret --format json \
            --output "${evidence}/catalog-runtime.trivy.json"
          trivy fs k8s-inference/catalog/runtime --format spdx-json \
            --output "${evidence}/catalog-runtime.spdx.json"
          trivy version --format json > "${evidence}/trivy-version.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --repository "$GITHUB_WORKSPACE" \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind image \
            --subject "local/fs2-control-plane@$(cat "${evidence}/control-plane.digest")" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy image --input OCI_ARCHIVE --scanners vuln,secret --format json' \
            --report "${evidence}/control-plane.trivy.json" \
            --sbom "${evidence}/control-plane.spdx.json" \
            --build-metadata "${evidence}/control-plane-build-metadata.json" \
            --oci-archive "${evidence}/control-plane.oci.tar" \
            --output "${evidence}/control-plane.receipt.json"
          python3 k8s-inference/security/image_security_evidence.py package-inventory \
            --sbom "${evidence}/admin-console.spdx.json" \
            --package libcrypto3 --package libssl3 --package libexpat --package libuuid \
            --output "${evidence}/admin-console-runtime-packages.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --repository "$GITHUB_WORKSPACE" \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind image \
            --subject "local/fs2-admin-console@$(cat "${evidence}/admin-console.digest")" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy image --input OCI_ARCHIVE --scanners vuln,secret --format json' \
            --report "${evidence}/admin-console.trivy.json" \
            --sbom "${evidence}/admin-console.spdx.json" \
            --package-inventory "${evidence}/admin-console-runtime-packages.json" \
            --build-metadata "${evidence}/admin-console-build-metadata.json" \
            --oci-archive "${evidence}/admin-console.oci.tar" \
            --output "${evidence}/admin-console.receipt.json"
          python3 k8s-inference/security/image_security_evidence.py create-receipt \
            --repository "$GITHUB_WORKSPACE" \
            --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
            --kind filesystem --subject "git-tree:${source_tree}:k8s-inference/catalog/runtime" \
            --scanner-release "${TRIVY_RELEASE}" \
            --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
            --scanner-version "${evidence}/trivy-version.json" \
            --command-contract 'trivy fs k8s-inference/catalog/runtime --scanners vuln,secret --format json' \
            --report "${evidence}/catalog-runtime.trivy.json" \
            --sbom "${evidence}/catalog-runtime.spdx.json" \
            --output "${evidence}/catalog-runtime.receipt.json"

      - name: Record unsigned source-scan evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          printf '%s\n' \
            'These reports are untrusted source-scan evidence only.' \
            'They are neither signed promotion evidence nor authorization to deploy.' \
            > "${evidence}/SOURCE-SCAN-ONLY.txt"
          find "${evidence}" -maxdepth 1 -type f ! -name UNSIGNED-SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > "${evidence}/UNSIGNED-SHA256SUMS"

      - name: Retain complete first-party evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sai-24-first-party-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sai-24-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source-scan report policy after evidence retention
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-evidence"
          python3 k8s-inference/security/image_security_evidence.py report \
            "${evidence}/control-plane.trivy.json" \
            "${evidence}/admin-console.trivy.json" \
            "${evidence}/catalog-runtime.trivy.json"

  scan-release-image-closure:
    name: 'Protected release closure and OIDC attestation'
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: sai24-release-attestation
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RENDER_EVIDENCE_ARTIFACT_ID: ${{ inputs.render_evidence_artifact_id || vars.SAI24_RENDER_EVIDENCE_ARTIFACT_ID }}
      RENDER_EVIDENCE_ARCHIVE_SHA256: ${{ inputs.render_evidence_archive_sha256 || vars.SAI24_RENDER_EVIDENCE_ARCHIVE_SHA256 }}
      ATTESTATION_BROKER_URL: ${{ vars.SAI24_ATTESTATION_BROKER_URL }}
      ATTESTATION_AUDIENCE: 'fs2-sai24-release-attestation'
      ATTESTATION_ENVIRONMENT: 'sai24-release-attestation'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Acquire exact signed render packet outside the Git tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RENDER_EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RENDER_EVIDENCE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="${RUNNER_TEMP}/sai-24-render-evidence.zip"
          bundle="${RUNNER_TEMP}/sai-24-render-evidence"
          mkdir -p "$bundle"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$archive" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RENDER_EVIDENCE_ARTIFACT_ID}/zip"
          printf '%s  %s\n' "$RENDER_EVIDENCE_ARCHIVE_SHA256" "$archive" | \
            sha256sum --check --strict
          BUNDLE_ARCHIVE="$archive" BUNDLE_ROOT="$bundle" python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          archive = pathlib.Path(os.environ["BUNDLE_ARCHIVE"])
          root = pathlib.Path(os.environ["BUNDLE_ROOT"]).resolve()
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  target = (root / member.filename).resolve()
                  target.relative_to(root)
              bundle.extractall(root)
          PY
          test -f "${bundle}/production-render-packet.json"
          printf 'RENDER_PACKET=%s\n' \
            "${bundle}/production-render-packet.json" >> "$GITHUB_ENV"

      - name: Materialize protected OIDC attestation identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BROKER_URL"
          python3 k8s-inference/security/oidc_attestation_broker.py identity \
            --audience "$ATTESTATION_AUDIENCE" \
            --environment "$ATTESTATION_ENVIRONMENT" \
            --trust k8s-inference/security/image-attestation-trust.json \
            --output "${RUNNER_TEMP}/sai-24-attestation-identity.json"

      - name: Install checksum-bound Trivy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-bin" "${RUNNER_TEMP}/sai-24-third-party"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_RELEASE}/${TRIVY_ARCHIVE}"
          printf '%s  %s\n' "${TRIVY_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${TRIVY_ARCHIVE}" \
            --directory "${RUNNER_TEMP}/trivy-bin" trivy
          printf '%s\n' "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version > "${RUNNER_TEMP}/sai-24-third-party/trivy-binary-version.txt"

      - name: Derive and scan every exact release-closure subject
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-third-party"
          source_tree=$(git rev-parse HEAD^{tree})
          python3 k8s-inference/security/image_security_evidence.py inventory \
            --trust k8s-inference/security/image-attestation-trust.json \
            k8s-inference/security/third-party-images.lock.json
          python3 k8s-inference/security/release_image_closure.py \
            --root k8s-inference \
            --surfaces k8s-inference/security/release-image-surfaces.json \
            --render-packet "$RENDER_PACKET" \
            --trust k8s-inference/security/image-attestation-trust.json \
            --inventory k8s-inference/security/third-party-images.lock.json \
            --first-party-inventory k8s-inference/security/first-party-images.lock.json \
            --catalog-image-map k8s-inference/security/catalog-images.lock.json \
            --attestation-identity "${RUNNER_TEMP}/sai-24-attestation-identity.json" \
            --output "${evidence}/release-image-closure.json"
          python3 k8s-inference/security/oidc_attestation_broker.py sign \
            --broker-url "$ATTESTATION_BROKER_URL" \
            --audience "$ATTESTATION_AUDIENCE" \
            --identity "${RUNNER_TEMP}/sai-24-attestation-identity.json" \
            --trust k8s-inference/security/image-attestation-trust.json \
            "${evidence}/release-image-closure.json"
          jq -er '.subjects[]' "${evidence}/release-image-closure.json" \
            > "${RUNNER_TEMP}/release-image-digests.txt"
          while IFS= read -r image_ref; do
            artifact_id=$(printf '%s' "${image_ref}" | sha256sum | cut -c1-16)
            trivy image "${image_ref}" --scanners vuln,secret --format json \
              --output "${evidence}/${artifact_id}.trivy.json"
            trivy image "${image_ref}" --format spdx-json \
              --output "${evidence}/${artifact_id}.spdx.json"
          done < "${RUNNER_TEMP}/release-image-digests.txt"
          trivy version --format json > "${evidence}/trivy-version.json"
          while IFS= read -r image_ref; do
            artifact_id=$(printf '%s' "${image_ref}" | sha256sum | cut -c1-16)
            python3 k8s-inference/security/image_security_evidence.py create-receipt \
              --repository "$GITHUB_WORKSPACE" \
              --source-commit "${GITHUB_SHA}" --source-tree "${source_tree}" \
              --kind release-image --subject "${image_ref}" \
              --scanner-release "${TRIVY_RELEASE}" \
              --scanner-archive-sha256 "${TRIVY_ARCHIVE_SHA256}" \
              --scanner-version "${evidence}/trivy-version.json" \
              --command-contract 'trivy image DIGEST_REFERENCE --scanners vuln,secret --format json' \
              --report "${evidence}/${artifact_id}.trivy.json" \
              --sbom "${evidence}/${artifact_id}.spdx.json" \
              --release-closure "${evidence}/release-image-closure.json" \
              --trust k8s-inference/security/image-attestation-trust.json \
              --attestation-identity "${RUNNER_TEMP}/sai-24-attestation-identity.json" \
              --output "${evidence}/${artifact_id}.receipt.json"
          done < "${RUNNER_TEMP}/release-image-digests.txt"

      - name: Attest every release-closure scan receipt with protected OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t receipts < <(find "${RUNNER_TEMP}/sai-24-third-party" \
            -maxdepth 1 -name '*.receipt.json' -print | sort)
          test "${#receipts[@]}" -gt 0
          python3 k8s-inference/security/oidc_attestation_broker.py sign \
            --broker-url "$ATTESTATION_BROKER_URL" \
            --audience "$ATTESTATION_AUDIENCE" \
            --identity "${RUNNER_TEMP}/sai-24-attestation-identity.json" \
            --trust k8s-inference/security/image-attestation-trust.json \
            "${receipts[@]}"

      - name: Retain complete third-party evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sai-24-third-party-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sai-24-third-party
          if-no-files-found: error
          retention-days: 90

      - name: Enforce all retained third-party reports and receipts
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sai-24-third-party"
          mapfile -t reports < <(find "${evidence}" -maxdepth 1 -name '*.trivy.json' -print | sort)
          mapfile -t receipts < <(find "${evidence}" -maxdepth 1 -name '*.receipt.json' -print | sort)
          test "${#reports[@]}" -gt 0
          test "${#reports[@]}" -eq "${#receipts[@]}"
          python3 k8s-inference/security/image_security_evidence.py report "${reports[@]}"
          python3 k8s-inference/security/image_security_evidence.py receipt \
            --trust k8s-inference/security/image-attestation-trust.json \
            "${receipts[@]}"
